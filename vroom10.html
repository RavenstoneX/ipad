<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vroom">
<meta name="theme-color" content="#bfe8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Vroom – Build &amp; Drive</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#e3f5ff;touch-action:manipulation;font-family:-apple-system,"SF Pro Rounded",system-ui,sans-serif}
button{font:inherit;border:0;cursor:pointer;padding:0;background:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
#top{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));pointer-events:none}
.nav{pointer-events:auto;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s,opacity .2s}
.nav svg{width:46px;height:46px}
.nav:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
#prev{background:#ff9f2e}#next{background:#2fb85a}
.nav.dim{opacity:.3}
.nav.go{animation:go .7s ease-in-out infinite alternate}
@keyframes go{to{transform:scale(1.15)}}
#dots{display:flex;gap:10px}
#dots i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-style:normal;font-size:25px;opacity:.55;transition:.2s}
#dots i.on{opacity:1;background:#fff;transform:scale(1.25);box-shadow:0 4px 0 rgba(0,0,0,.12)}
#prog{display:none;position:relative;width:min(46vw,520px);height:26px;border-radius:13px;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.12)}
#bar{position:absolute;left:4px;top:4px;bottom:4px;border-radius:9px;background:#ffd93d;width:0}
#mk{position:absolute;top:-16px;font-size:34px;transform:translateX(-50%) scaleX(-1)}
#fl{position:absolute;right:-14px;top:-18px;font-size:36px}
#main{position:relative;min-height:0}
#home{padding:calc(24px + env(safe-area-inset-top)) 24px 24px;background:linear-gradient(#bfe8ff,#e3f5ff);flex-direction:column;align-items:center;gap:12px;overflow:auto}
#home h1{margin:0;font-size:46px;line-height:1}
.rows{display:flex;flex-direction:column;gap:7px;width:min(600px,100%)}
.row{display:grid;grid-template-columns:50px 1fr 130px 46px;align-items:center;gap:12px;background:#fff;border-radius:26px;padding:8px 16px;box-shadow:0 4px 0 rgba(0,0,0,.12);height:66px}
.row.new{background:#fff6db;outline:5px solid #ffb21a;animation:go .6s ease-in-out infinite alternate}
.row.empty{background:rgba(255,255,255,.45);box-shadow:none;border:4px dashed rgba(0,0,0,.15)}
.row .rk{font-size:32px;text-align:center}.row .car{height:54px}.row .car svg{width:100%;height:100%}
.row .tm{font-size:28px;font-weight:800;color:#2b2b2b;font-variant-numeric:tabular-nums;text-align:right}.row .tr{font-size:28px;text-align:center}
#play{margin-top:14px;width:170px;height:120px;border-radius:60px;background:#2fb85a;color:#fff;font-size:60px;box-shadow:0 7px 0 rgba(0,0,0,.18);animation:go .8s ease-in-out infinite alternate}
#tmr{display:none;margin-left:14px;margin-right:auto;background:rgba(255,255,255,.9);border-radius:16px;padding:4px 14px;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(0,0,0,.12)}
#win .wt{font-size:54px;font-weight:900;text-align:center;color:#2b2b2b;background:rgba(255,255,255,.9);border-radius:24px;padding:4px 18px;margin-top:-10px}
#main>*{position:absolute;inset:0;width:100%;height:100%;display:none}
#stage,#drive{touch-action:none}
.grid6{padding:calc(118px + env(safe-area-inset-top)) 24px 24px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:22px;background:linear-gradient(#bfe8ff,#e3f5ff)}
@media (orientation:portrait){.grid6{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}}
.card{background:#fff;border-radius:34px;box-shadow:0 7px 0 rgba(0,0,0,.12);padding:14px;border:6px solid transparent;min-height:0;transition:transform .1s;overflow:hidden}
.card.trk{padding:0}
.card:active{transform:scale(.96)}
.card.on{border-color:#ffb21a;background:#fff6db}
.card svg{width:100%;height:100%;pointer-events:none;display:block}
#panel{background:#fff8e1;border-radius:32px 32px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.14);z-index:2;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));min-height:168px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
#panel.hide{display:none}
.items{display:grid;grid-template-columns:repeat(4,minmax(0,184px));gap:12px}
.item{width:100%;height:118px;border-radius:26px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14);padding:8px;border:5px solid transparent}
.sizes{display:flex;flex-direction:column;gap:8px;align-items:center;background:#fff;border-radius:26px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.sz{width:62px;height:42px;border-radius:21px;display:grid;place-items:center;border:4px solid transparent}
.sz i{display:block;border-radius:50%;background:#3a3a3a;border:4px solid #b9bec7}
.sz.on{border-color:#2fb85a;background:#e9fbe9}
.item.sel{border-color:#2fb85a;background:#e9fbe9}
.item:active{transform:translateY(3px)}
.hint{font-size:76px;animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-16px)}}
.sw{width:64px;height:64px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 3px rgba(0,0,0,.18),0 5px 0 rgba(0,0,0,.14);transition:transform .12s}
.sw.on{transform:scale(1.22);box-shadow:0 0 0 6px #2b2b2b,0 5px 0 rgba(0,0,0,.2)}
#count{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:190px;font-weight:900;color:#fff;-webkit-text-stroke:8px #2b2b2b;pointer-events:none;z-index:4;display:none}
#count.go{color:#2fb85a}
#count.pulse{animation:cnt .8s ease-out}
@keyframes cnt{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}to{transform:translate(-50%,-50%) scale(1)}}
.clr{width:84px;height:118px;border-radius:26px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.14);font-size:42px}
.clr.warn{background:#ff6b6b}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#touch{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font-size:90px;pointer-events:none;z-index:4;display:none;animation:bob .6s ease-in-out infinite alternate}
#win{position:absolute;left:50%;top:13%;transform:translate(-50%,0);font-size:130px;pointer-events:none;z-index:4;display:none;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
#win.show{display:block;animation:winpop .8s cubic-bezier(.3,1.7,.5,1)}
@keyframes winpop{from{transform:translate(-50%,0) scale(0) rotate(-30deg)}}
/* ghosts & parts */
.gp *{stroke:#8593a4!important;stroke-dasharray:14 10;stroke-width:6px!important;fill:rgba(255,255,255,.55)!important;animation:none!important}
.gp [fill="none"]{fill:none!important}
.gp [stroke-width="32"]{stroke:rgba(255,255,255,.7)!important;stroke-width:22px!important;stroke-dasharray:none}
.gp circle[fill="#2b2b2b"]{fill:#8593a4!important;stroke:none!important}
.gp .fx{display:none}
.gp.hot *{stroke:#ff8a00!important}
.gp.hot{animation:pulse .7s infinite alternate}
@keyframes pulse{to{opacity:.4}}
.gp{cursor:pointer}
.pop{transform-box:fill-box;transform-origin:center bottom;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.3) translateY(-120px);opacity:0}100%{transform:none;opacity:1}}
.selp{transform-box:fill-box;transform-origin:center bottom;animation:wig .9s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg) translateY(-6px)}}
/* moving / blinking parts */
.blink{animation:blink .7s steps(1) infinite}
.blink.b2{animation-delay:.35s}
@keyframes blink{50%{opacity:0}}
.wl,.wr{transform-box:fill-box;animation:wave .45s ease-in-out infinite alternate}
.wl{transform-origin:right center}.wr{transform-origin:left center}
@keyframes wave{from{transform:skewY(-9deg)}to{transform:skewY(9deg) scaleX(.86)}}
.prop{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:center bottom;animation:sway .8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.look{animation:look 2.6s ease-in-out infinite}
@keyframes look{0%,20%{transform:translate(0,0)}30%,50%{transform:translate(7px,2px)}60%,85%{transform:translate(-7px,1px)}}
.flame{transform-box:fill-box;transform-origin:right center;animation:flick .12s infinite alternate}
@keyframes flick{to{transform:scaleX(1.4) scaleY(.8)}}
.bob{transform-box:fill-box;transform-origin:center bottom;animation:sway 1.4s ease-in-out infinite alternate}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw .9s ease-in-out infinite alternate}
@keyframes tw{to{transform:scale(1.18) rotate(12deg)}}
#meas{position:absolute;width:10px;height:10px;left:-50px;top:-50px;visibility:hidden}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="home"></div>
    <div id="pick" class="grid6"></div>
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="150 60 1300 840" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tracks" class="grid6"></div>
    <svg id="drive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg>
  </div>
  <div id="panel"></div>
  <div id="top">
    <button class="nav" id="prev" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="mid" style="display:flex;align-items:center;margin-left:auto;margin-right:14px"><div id="dots"><i>🚙</i><i>🔧</i><i>🎨</i><i>🗺️</i><i>🏁</i></div>
    <div id="prog"><div id="bar"></div><span id="mk">🚙</span><span id="fl">🏁</span></div>
    <div id="tmr">0:00.0</div></div>
    <button class="nav" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<div id="touch">👆</div>
<div id="win">🏆</div>
<div id="count"></div>
<div id="fx"></div>
<svg id="meas" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const K='#2b2b2b';
const PALETTE=['#ff4b4b','#ff9f2e','#ffd93d','#9ed84a','#2fb85a','#27c4b0','#4db8ff','#3a6df0','#8a5cf0','#ff7ab8','#a8693a','#3a3a3a','#b9bec7','#ffffff'];
const KEY='vroom-builder-v3';
const NV=8,R8=[0,1,2,3,4,5,6,7];
const SIZES=[.7,.85,1,1.2,1.4];

/* ================= art helpers ================= */
let ctx={parts:{},colors:{},sizes:{},preset:null};
function col(s,r){const k=s+'.'+r;if(ctx.colors[k])return ctx.colors[k];if(ctx.preset)return ctx.preset(s,r);
  return r==='glass'?'#e8f7ff':r==='head'?'#ffe2c4':'#ffffff';}
const F=(s,r,w=8)=>`data-s="${s}" data-r="${r}" class="reg" fill="${col(s,r)}" stroke="${K}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const D=(w=8)=>`fill="none" stroke="${K}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"`;
const n1=x=>+(+x).toFixed(1);
const dot=(x,y,r,c=K)=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${c}" pointer-events="none"/>`;
const rect=(s,r,x,y,w,h,rx=0,ex='')=>`<rect ${F(s,r)} x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${n1(rx)}" ${ex}/>`;
const path=(s,r,d,extra='')=>`<path ${F(s,r)} d="${d}" ${extra}/>`;
const circ=(s,r,cx,cy,R)=>`<circle ${F(s,r)} cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(R)}"/>`;
const ell=(s,r,cx,cy,rx,ry)=>`<ellipse ${F(s,r)} cx="${n1(cx)}" cy="${n1(cy)}" rx="${n1(rx)}" ry="${n1(ry)}"/>`;
const deco=(d,w=6)=>`<path d="${d}" ${D(w)}/>`;
const fixedR=(x,y,w,h,c,rx=0)=>`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}" rx="${rx}" fill="${c}" stroke="${K}" stroke-width="6" pointer-events="none"/>`;
const ring=(s,r,cx,cy,R,ri)=>path(s,r,`M${n1(cx-R)} ${n1(cy)} a${n1(R)} ${n1(R)} 0 1 0 ${n1(2*R)} 0 a${n1(R)} ${n1(R)} 0 1 0 ${n1(-2*R)} 0 Z M${n1(cx-ri)} ${n1(cy)} a${n1(ri)} ${n1(ri)} 0 1 0 ${n1(2*ri)} 0 a${n1(ri)} ${n1(ri)} 0 1 0 ${n1(-2*ri)} 0 Z`,'fill-rule="evenodd"');
const TUBE=(s,r,d)=>`<path d="${d}" fill="none" stroke="${K}" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/><path data-s="${s}" data-r="${r}" class="reg" d="${d}" fill="none" stroke="${col(s,r)}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`;
function star(cx,cy,ro,ri,n){const p=[];for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=-Math.PI/2+i*Math.PI/n;p.push(n1(cx+Math.cos(a)*r)+','+n1(cy+Math.sin(a)*r));}return p.join(' ');}
function ngon(cx,cy,R,n,rot){const p=[];for(let i=0;i<n;i++){const a=rot+i*2*Math.PI/n;p.push(n1(cx+Math.cos(a)*R)+','+n1(cy+Math.sin(a)*R));}return p.join(' ');}
const heartD=(cx,cy,s)=>`M${n1(cx)} ${n1(cy+s*.9)} C${n1(cx-s*1.3)} ${n1(cy+s*.1)} ${n1(cx-s*.9)} ${n1(cy-s*.9)} ${n1(cx)} ${n1(cy-s*.35)} C${n1(cx+s*.9)} ${n1(cy-s*.9)} ${n1(cx+s*1.3)} ${n1(cy+s*.1)} ${n1(cx)} ${n1(cy+s*.9)} Z`;
const redCross=(cx,cy,s)=>`<path d="M${n1(cx-s*.3)} ${n1(cy-s)} h${n1(s*.6)} v${n1(s*.7)} h${n1(s*.7)} v${n1(s*.6)} h${n1(-s*.7)} v${n1(s*.7)} h${n1(-s*.6)} v${n1(-s*.7)} h${n1(-s*.7)} v${n1(-s*.6)} h${n1(s*.7)} Z" fill="#ff3b3b" stroke="${K}" stroke-width="5" pointer-events="none"/>`;
const sz=sl=>SIZES[(ctx.sizes||{})[sl]??2];

/* ---------- wheels: 8 shapes, any size ---------- */
const WSIDES=[0,0,0,6,3,0,4,0];
function wheel(sl,cx,cy,R0,v,R=R0*sz(sl)){
  const n=WSIDES[v];
  let s=`<g class="spin" data-c="${cx},${cy},${n1(R)},${n}">`;
  if(v===0||v===1){
    s+=circ(sl,'tire',cx,cy,R);
    if(v===0)for(let i=0;i<14;i++){const a=i*Math.PI/7,c=Math.cos(a),q=Math.sin(a);
      s+=`<line x1="${n1(cx+c*R*.76)}" y1="${n1(cy+q*R*.76)}" x2="${n1(cx+c*R*.9)}" y2="${n1(cy+q*R*.9)}" ${D(6)}/>`;}
    s+=circ(sl,'rim',cx,cy,R*(v?.66:.55))+circ(sl,'hub',cx,cy,R*(v?.3:.22));
    for(let i=0;i<5;i++){const a=i*2*Math.PI/5;s+=dot(cx+Math.cos(a)*R*(v?.48:.39),cy+Math.sin(a)*R*(v?.48:.39),R*.045);}
  }else if(v===2){
    for(let i=0;i<12;i++)s+=`<rect ${F(sl,'tire')} x="${n1(cx-R*.13)}" y="${n1(cy-R-R*.02)}" width="${n1(R*.26)}" height="${n1(R*.22)}" rx="6" transform="rotate(${i*30} ${cx} ${cy})"/>`;
    s+=circ(sl,'tire',cx,cy,R*.9)+circ(sl,'rim',cx,cy,R*.5)+`<polygon ${F(sl,'hub')} points="${star(cx,cy,R*.36,R*.18,5)}"/>`+dot(cx,cy,R*.06);
  }else if(v===3){
    s+=`<polygon ${F(sl,'tire')} points="${ngon(cx,cy,R,6,0)}"/><polygon ${F(sl,'rim')} points="${ngon(cx,cy,R*.6,6,Math.PI/6)}"/>`+circ(sl,'hub',cx,cy,R*.2)+dot(cx+R*.4,cy,R*.05);
  }else if(v===4){
    s+=`<polygon ${F(sl,'tire',10)} points="${ngon(cx,cy,R,3,Math.PI/6)}"/><polygon ${F(sl,'rim')} points="${ngon(cx,cy,R*.42,3,Math.PI/6)}"/>`+circ(sl,'hub',cx,cy,R*.12);
  }else if(v===5){
    const N=9;let d='';for(let i=0;i<=N;i++){const a=i*2*Math.PI/N,x=cx+Math.cos(a)*R*.84,y=cy+Math.sin(a)*R*.84;
      d+=i?` A${n1(R*.32)} ${n1(R*.32)} 0 0 1 ${n1(x)} ${n1(y)}`:`M${n1(x)} ${n1(y)}`;}
    s+=path(sl,'tire',d+' Z')+circ(sl,'rim',cx,cy,R*.52)+`<polygon ${F(sl,'hub')} points="${star(cx,cy,R*.34,R*.16,5)}"/>`+dot(cx,cy,R*.06);
  }else if(v===6){
    s+=`<polygon ${F(sl,'tire',10)} points="${ngon(cx,cy,R,4,Math.PI/4)}"/>`+rect(sl,'rim',cx-R*.42,cy-R*.42,R*.84,R*.84,R*.1)+circ(sl,'hub',cx,cy,R*.18)+dot(cx+R*.28,cy-R*.28,R*.05);
  }else{
    for(let i=0;i<10;i++)s+=`<rect ${F(sl,'tire',6)} x="${n1(cx-R*.12)}" y="${n1(cy-R)}" width="${n1(R*.24)}" height="${n1(R*.3)}" rx="3" transform="rotate(${i*36} ${cx} ${cy})"/>`;
    s+=circ(sl,'tire',cx,cy,R*.8)+ring(sl,'rim',cx,cy,R*.6,R*.42);
    for(let i=0;i<4;i++)s+=`<rect ${F(sl,'hub',6)} x="${n1(cx-R*.07)}" y="${n1(cy-R*.46)}" width="${n1(R*.14)}" height="${n1(R*.92)}" rx="4" transform="rotate(${i*45} ${cx} ${cy})"/>`;
    s+=circ(sl,'hub',cx,cy,R*.16);
  }
  return s+'</g>';
}

/* ---------- crazy shapes: cloud, zigzag, googly, castle, candy ---------- */
function crazy(k,s,[x,y,w,h],o={}){
  const m=o.main||'main',sc=o.sec||'stripe',mn=Math.min(w,h);let out='';
  if(k===0){
    const n=Math.max(2,Math.round(w/85)),r=w/(2*n),m2=Math.max(1,Math.round((h-r)/85)),r2=(h-r)/(2*m2);
    let d=`M${x} ${y+h} L${x} ${n1(y+r)}`;
    for(let i=0;i<n;i++)d+=` A${n1(r)} ${n1(r)} 0 0 1 ${n1(x+(i+1)*w/n)} ${n1(y+r)}`;
    for(let j=0;j<m2;j++)d+=` A${n1(r2)} ${n1(r2)} 0 0 1 ${x+w} ${n1(y+r+(j+1)*(h-r)/m2)}`;
    out+=path(s,m,d+' Z');
    if(o.glass)out+=circ(s,o.glass,x+w*.5,y+h*.45,mn*.22)+deco(`M${n1(x+w*.5-mn*.22)} ${n1(y+h*.45)} L${n1(x+w*.5+mn*.22)} ${n1(y+h*.45)}`,5)+circ(s,sc,x+w*.22,y+h*.75,mn*.08)+circ(s,sc,x+w*.8,y+h*.72,mn*.08);
    else out+=circ(s,sc,x+w*.28,y+h*.62,mn*.11)+circ(s,sc,x+w*.55,y+h*.5,mn*.13)+circ(s,sc,x+w*.8,y+h*.66,mn*.1);
  }else if(k===1){
    const t=Math.min(h*.3,60),n=Math.max(3,Math.round(w/62));
    let d=`M${x} ${y+h} L${x} ${n1(y+t)}`;
    for(let i=0;i<n;i++)d+=` L${n1(x+(i+.5)*w/n)} ${y} L${n1(x+(i+1)*w/n)} ${n1(y+t)}`;
    out+=path(s,m,d+` L${x+w} ${y+h} Z`);
    const bw=mn*.55,bx=x+w*(o.glass?.7:.5)-bw/2,by=y+t+(h-t-bw*1.1)/2,P=[[.55,0],[.15,.58],[.45,.58],[.3,1.1],[.85,.42],[.55,.42],[.75,0]];

  }else if(k===2){

    for(const fx of [x+w*.2,x+w*.8])out+=rect(s,sc,fx-mn*.06,y+t+(h-t)*.3,mn*.12,mn*.2,mn*.06);
  }else{

    let d=`M${x} ${y+h} L${x} ${n1(y+a)}`;

    if(o.glass)out+=circ(s,o.glass,x+w*.5,y+h*.48,mn*.2);

function bottomOf(a,th=0){if(a.fixed)return a.fixed;if(!a.n)return a.cy+a.R;
  const P=2*Math.PI/a.n;let t=((th%P)+P)%P;if(t>P/2)t-=P;return a.cy+a.R*Math.cos(Math.PI/a.n-Math.abs(t));}

  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.03);}

  s.buffer=b;f.type=hp?'highpass':'lowpass';f.frequency.value=hp||lp;g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+when);}

    if(p.k==='rocket'){p.trail-=dt;if(p.trail<=0){p.trail=.02;const sx=p.x-R.x+VX-Math.cos(ang/57.3)*70,sy=p.y-Math.sin(ang/57.3)*70;const P={x:sx,y:sy,age:0,k:'fire',vx:-300+R.v*.85,vy:(Math.random()-.5)*80,r:14,gr:-12,life:.3,rot:0};P.el=mk('circle',{fill:'url(#fireG)'},$('#smoke'));R.parts.push(P);}
      if(p.y>gy||p.age>1.8){boom(R,p.x,Math.min(p.y,gy));dead=true;}}
    if(p.k==='heart')p.y+=Math.sin(p.age*5+p.wob)*1.5;
    // hit balls
    if(!dead&&p.k!=='spark'&&p.k!=='frag'){const sx=p.x-R.x+VX;
      for(const m of []){if(!m.hit||m.dead>0)continue;if(Math.hypot(m.x-sx,m.yNow-p.y)<m.hit){
        m.dead=2.5+Math.random()*2;m.el.setAttribute('opacity',0);scatter(R,p.x,p.yNow??p.y,ECOL[m.e]||RAINBOW,UPS.has(m.e));
        if(p.k==='rocket'){boom(R,p.x,p.y);dead=true;}else if(p.k!=='confetti'&&p.k!=='bubble')dead=true;break;}}}
    if(!dead&&p.k!=='spark'&&p.k!=='frag')for(const o of R.obs){if(!o.gone&&Math.abs(p.x-o.x)<o.w*.6&&Math.abs(p.y-o.y)<o.w*.6){
      o.wob=.4;tone(1200,.06,'triangle',.08,800);if(p.k==='rocket')boom(R,p.x,p.y);dead=true;break;}}
    if(!dead&&p.k!=='spark'&&p.k!=='frag')for(const b of R.balls){if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+26){
      if(b.die)continue;eliminate(R,b);
      if(p.k==='rocket'){boom(R,p.x,p.y);dead=true;}else if(p.k!=='confetti'&&p.k!=='bubble')dead=true;break;}}
    if(dead||p.x>R.x+3000){p.el.remove();return false;}
    const a=p.age/p.life;
    p.el.setAttribute('transform',`translate(${n1(p.x)} ${n1(p.y)}) rotate(${n1(ang)})`);
    if(p.k==='bubble'||p.k==='heart'||p.k==='confetti'||p.k==='spark'||p.k==='frag')p.el.setAttribute('opacity',n1(a>.8?(1-a)*5:1));
    else p.el.setAttribute('opacity',1);
    return true;});
  R.proj=kept.concat(R.proj);
}

function ballEl(kind){
  const g=mk('g',{},$('#wBalls'));
  if(kind==='snow')g.innerHTML=`<circle r="44" fill="#fff" stroke="${K}" stroke-width="6"/><circle cx="-14" cy="-14" r="10" fill="#e3edfa"/>`;
  else if(kind==='cube'){const c=['#ff4b4b','#4db8ff','#ffd93d','#9ed84a'][Math.floor(Math.random()*4)];g.dataset.c=c;g.innerHTML=`<rect x="-40" y="-40" width="80" height="80" fill="${c}" stroke="${K}" stroke-width="6"/><rect x="-24" y="-24" width="20" height="20" fill="#fff" opacity=".6"/><rect x="6" y="6" width="20" height="20" fill="#000" opacity=".15"/>`;}
  else g.innerHTML=`<text font-size="96" text-anchor="middle" dominant-baseline="central">${kind}</text>`;
  return g;
}
function updBalls(dt,R){
  if(R.nextBall<DIST-1500&&R.nextBall<R.x+1100){const kind=TH.balls[Math.floor(Math.random()*TH.balls.length)],x=R.nextBall;
    const el=ballEl(kind);R.balls.push({x,y:HR(x)-44,vx:0,vy:0,rot:0,fly:false,r:44,el,kind,col:el.dataset.c});R.nextBall+=700+Math.random()*900;}
  const fr=R.frontW;
  R.balls=R.balls.filter(b=>{
    if(b.die){const d=b.die;d.t+=dt;
      if(d.k==='balloon'){b.y-=260*dt;b.x+=Math.sin(d.t*4)*3-R.v*0*dt;b.rot=Math.sin(d.t*5)*18;b.el.setAttribute('transform',`translate(${n1(b.x)} ${n1(b.y)}) rotate(${n1(b.rot)})`);if(d.t>3.5){b.el.remove();return false;}return true;}
      if(d.k==='dizzy'){b.rot+=900*dt;const s=Math.max(.01,1-d.t/1.2);b.y-=40*dt;b.el.setAttribute('transform',`translate(${n1(b.x)} ${n1(b.y)}) rotate(${n1(b.rot)}) scale(${n1(s)})`);if(d.t>1.2){b.el.remove();return false;}return true;}
      if(d.k==='squash'){const s=d.t<.18?1-d.t*3:0;b.el.setAttribute('transform',`translate(${n1(b.x)} ${n1(b.y+44*(1-s))}) scale(${n1(1+(1-s)*1.4)} ${n1(Math.max(.05,s))})`);if(d.t>.2){burst(R,b.x,b.y+30,'💦');b.el.remove();return false;}return true;}
      b.el.remove();return false;}
    if(b.fly){b.vy+=1900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt/b.r*57.3;b.vx*=.995;
      const gy=HR(b.x)-b.r;if(b.y>gy){b.y=gy;if(b.vy>0)b.vy=Math.abs(b.vy)>140?-b.vy*.62:0;b.vx*=.86;}}
    else b.y=HR(b.x)-b.r;
    if(!b.die&&R.jy>-60&&b.x-b.r<fr&&b.x+b.r>fr-260&&b.y>HR(b.x)-b.r-90&&b.vx<R.v+40){
      b.fly=true;b.vx=R.v*1.25+260+Math.random()*160;b.vy=-(620+R.v*.4+Math.random()*220);sfx.boing();}
    b.el.setAttribute('transform',`translate(${n1(b.x)} ${n1(b.y)}) rotate(${n1(b.rot%360)})`);
    if(b.x<R.x-1500||b.x>R.x+4000){b.el.remove();return false;}return true;});
  const L=R.balls.filter(b=>!b.die);
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d>0&&d<m){const nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
      const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const imp=-rv*.9;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny;a.fly=b.fly=true;if(Math.abs(rv)>200)tone(300+Math.random()*200,.08,'sine',.15,500);}}}
}
const OBS={soft:['🪵','🚧','🪵'],mountains:['🪨','🪵','🪨'],snow:['🧊','🪵','🧊'],sand:['🌵','🪨','🌵'],halloween:['🪦','🪵','🪦'],blocky:['CRATE']};
const OCOL={'🪵':['#8b5a2b','#c08a55','#5a3a1a'],'🚧':['#ff9f2e','#ffffff','#2b2b2b'],'🪨':['#9aa4b2','#6e7681','#c8ced6'],'🧊':['#bfe9ff','#ffffff','#7cc8f0'],'🌵':['#2fb85a','#9ed84a','#1f7d3a'],'🪦':['#9aa4b2','#6e7681','#d0d4da'],'CRATE':['#c08a55','#8b5a2b','#2b2b2b']};
function updObs(dt,R){
  if(R.nextObs<DIST-1800&&R.nextObs<R.x+1300){const L=OBS[S.track]||OBS.soft,e=L[Math.floor(Math.random()*L.length)],x=R.nextObs,g=mk('g',{},$('#wBalls'));
    if(e==='CRATE')g.innerHTML=`<rect x="-44" y="-44" width="88" height="88" fill="#c08a55" stroke="${K}" stroke-width="7"/><path d="M-44 -44 L44 44 M44 -44 L-44 44" stroke="#8b5a2b" stroke-width="10"/><rect x="-44" y="-44" width="88" height="88" fill="none" stroke="${K}" stroke-width="7"/>`;
    else g.innerHTML=`<text font-size="104" text-anchor="middle" dominant-baseline="central">${e}</text>`;
    R.obs.push({x,y:HR(x)-40,w:90,e,el:g,wob:0});R.nextObs+=1500+Math.random()*1400;}
  const fr=R.frontW;
  R.obs=R.obs.filter(o=>{if(o.gone)return false;
    if(!o.fly)o.y=HR(o.x)-40;
    if(!o.hit&&o.x-o.w/2<fr&&o.x>fr-160&&R.jy>-70){o.hit=true;o.fly=true;o.vx=R.v*.6+250;o.vy=-420;o.spin=420;o.rot=0;
      R.v=Math.max(R.vs.vmax*.08,R.v*R.vs.keep);R.bump=1;R.qv+=380;
      tone(110,.25,'sine',.35,50);noise(.25,.3,600);}
    if(o.fly){o.vy+=1700*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.spin*dt;const gy=HR(o.x)+58;
      if(o.y>gy){o.y=gy;o.vy=0;o.vx*=Math.pow(.02,dt);o.spin=0;o.rot+=((Math.round(o.rot/90)*90)-o.rot)*Math.min(1,dt*8);}
      o.el.setAttribute('transform',`translate(${n1(o.x)} ${n1(o.y)}) rotate(${n1(o.rot)})`);if(o.x<R.x-1500){o.el.remove();return false;}return true;}
    if(o.wob>0)o.wob-=dt;
    const r=o.wob>0?Math.sin(o.wob*40)*14*o.wob:0;
    o.el.setAttribute('transform',`translate(${n1(o.x)} ${n1(o.y)}) rotate(${n1(r)})`);
    if(o.x<R.x-1500){o.el.remove();return false;}return true;});
}
function loop(now){
  if(!DR)return;
  const dt=Math.min(.05,(now-DR.last)/1000);DR.last=now;const R=DR,vs=R.vs;
  const Xr=R.x+(R.ax[0].x-R.mid)*SC,Xf=R.x+(R.ax[1].x-R.mid)*SC;
  const thR=R.dist/(R.ax[0].R*SC),thF=R.dist/(R.ax[1].R*SC);
  const tr=HR(Xr),tf=HR(Xf),k=Math.min(1,dt*14);
  R.ry=R.ry==null?tr:R.ry+(tr-R.ry)*k;R.fy=R.fy==null?tf:R.fy+(tf-R.fy)*k;
  const slope=Math.atan2(tf-tr,Xf-Xr),vmin=vs.vmax*.15;
  if(R.cd>0){R.cd-=dt;const n=Math.ceil(R.cd/.8);if(n!==R.cdn){R.cdn=n;const el=$('#count');el.className='';void el.offsetWidth;
      if(n>0){el.textContent=n>3?'':String(n);if(n<=3){el.className='pulse';tone(520,.18,'square',.12);}}
      else{el.textContent='GO!';el.className='go pulse';tone(1040,.4,'square',.14);setTimeout(()=>{if(DR&&DR.cd<=0)el.style.display='none';},700);}}
    R.v=0;}
  else if(!R.won){
    R.t+=dt;
    const air=R.jy<0||R.jvy<0;
    if(R.thr)R.v+=vs.acc*dt;else if(!air)R.v-=vs.acc*.65*dt;
    if(!air)R.v+=Math.sin(slope)*260*dt;R.v=Math.max(vmin,Math.min(vs.vmax,R.v));
    if(R.x>DIST-2200&&!R.gate){R.gate=true;drawFinish();}
    if(R.x>=DIST){R.won=true;R.final=R.t;sfx.fanfare();}
  }else{
    R.v=Math.max(0,R.v-2000*dt);
    if(R.v===0&&!R.stopped){R.stopped=true;R.winT=now;const rk=recordResult(R.final);$('#win').innerHTML=(['🥇','🥈','🥉'][rk]||'🏆')+`<div class="wt">${fmtT(R.final)}</div>`;$('#win').style.display='block';$('#win').classList.add('show');confetti(40);renderTop();sfx.horn(S.vid);}
  }
  R.x+=R.v*dt;R.dist+=R.v*dt;
  const w0=Math.floor((R.x-1000)/800)*800;
  if(w0!==R.chunk){R.chunk=w0;const c=chunkSVG(TH,w0);$('#wGround').innerHTML=c.g;$('#wDeco').innerHTML=c.d;}
  $('#world').setAttribute('transform',`translate(${n1(VX-R.x)} 0)`);
  $('#hFar').setAttribute('d',hillD(TH.far,R.x));$('#hMid').setAttribute('d',hillD(TH.mid,R.x));
  if(TH.clouds!=='none')for(let i=0;i<5;i++){const s=.55+i*.08,x=((i*430+180-R.x*.12)%2300+2300)%2300-350,y=110+(i%3)*85;
    $('#cl'+i).setAttribute('transform',TH.clouds==='block'?`translate(${n1(x)} ${y}) scale(${s})`:`translate(${n1(x)} ${y}) scale(${s}) translate(-665 -245)`);}
  updMovers(dt,now,R.v);
  if(R.down&&!R.thr&&now-R.downT>170&&R.cd<=0)R.thr=true;
  if(R.jbuf>0){R.jbuf-=dt;if(R.jy===0&&R.jvy===0&&!R.won)doJump(R);}
  if(R.jy<0||R.jvy<0){R.jvy+=2600*dt;R.jy+=R.jvy*dt;if(R.jy>=0){if(R.jvy>300){R.qv+=Math.min(1100,R.jvy*.9);tone(140,.18,'sine',.22,70);tone(500,.25,'sine',.08,260,.06);}R.jy=0;R.jvy=0;}}
  {const air=R.jy<0,rest=air?-24:0;R.bt-=dt;if(!air&&R.bt<=0&&R.cd<=0){R.bt=.25+Math.random()*.5;R.qv+=(Math.random()*.8+.2)*140*R.v/R.vs.vmax;}
   R.qv+=(-(R.q-rest)*190-R.qv*11)*dt;R.q=Math.max(-34,Math.min(38,R.q+R.qv*dt));}
  let lift=R.jy+R.q*SC;
  if(!R.stopped)lift+=Math.sin(now/45)*Math.min(R.v/500,1)*2*(R.jy<0?0:1);
  else{const tt=(now-R.winT)/1000;if(tt<3)lift=-Math.abs(Math.sin(tt*5))*55*(1-tt/3);}
  const tilt=R.jy<0?Math.max(-40,Math.min(30,R.jvy*.035)):0;R.tl=(R.tl||0)+(tilt-(R.tl||0))*Math.min(1,dt*10);
  const P=placeT(Xr-R.x+VX,R.ry+lift,Xf-R.x+VX,R.fy+lift+R.tl,SC,R.ax,thR,thF);
  $('#veh').setAttribute('transform',P.t);
  const toScr=([lx,ly])=>{const dx=(lx-R.ax[0].x)*SC,dy=(ly-P.br)*SC,c=Math.cos(P.ang),s=Math.sin(P.ang);return[Xr-R.x+VX+dx*c-dy*s,R.ry+lift+dx*s+dy*c];};
  R.frontW=Xr+(R.front-R.ax[0].x)*SC*Math.cos(P.ang);
  const dir=R.mirror?-1:1;
  const wq=R.ax[0].fixed?0:-R.q;
  for(const w of R.wheels){const a=dir*(R.dist/SC)/w.r*57.2958;w.el.setAttribute('transform',`translate(0 ${n1(wq)}) rotate(${n1(a%360)} ${w.a} ${w.b})`);}
  // exhaust
  R.spawn-=dt;
  if(R.smokeP&&(R.v>20||R.cd>0)&&R.spawn<=0){
    const kd=R.kind;R.spawn=kd==='fire'?.03:kd==='spark'?.1:kd==='note'?.45:kd==='bubble'?.22:Math.max(.1,.3-R.v/5000)-(R.thr?.05:0);
    if(kd==='fire'&&!R.thr)R.spawn=.08;
    const[px,py]=toScr(R.smokeP);spawnExhaust(R,px,py);
  }
  if(R.role==='robber'&&!R.won){R.cash-=dt;if(R.cash<=0){R.cash=.5;const[px,py]=toScr([R.ax[0].x-60,P.br-160]);const k0=R.kind;R.kind='cash';spawnExhaust(R,px,py);R.kind=k0;}}
  updParticles(dt,R);
  // gadget
  if(R.gkind&&!R.won&&R.cd<=0){R.gunT-=dt;if(R.gunT<=0){R.gunT={water:.9,arrow:.45,rocket:2.4,bubble:.7,confetti:1.8,star:1.2,heart:1.2}[R.gkind];
    const[sx,sy]=toScr(R.muzP);fireGadget(R,sx-VX+R.x,sy);}}
  updProj(dt,R);
  updBalls(dt,R);updObs(dt,R);
  if(R.role&&!R.won)sirenTick(R.role,R,dt);
  engineSet(R.won?R.v*.5:R.v,R.thr&&!R.won);
  if(R.stopped&&eng)engineStop();
  const pct=Math.min(1,R.x/DIST);$('#tmr').textContent=fmtT(R.won?R.final:R.t);
  $('#bar').style.width=`calc(${pct*100}% - ${pct*8}px)`;$('#mk').style.left=(pct*100)+'%';
  raf=requestAnimationFrame(loop);
}

  $('#wFinish').innerHTML=`<rect x="${x-170}" y="${n1(y-360)}" width="22" height="380" rx="8" fill="#ff4b4b" stroke="${K}" stroke-width="7"/>`+
    `<rect x="${x+148}" y="${n1(y-360)}" width="22" height="380" rx="8" fill="#ff4b4b" stroke="${K}" stroke-width="7"/>`+chk+
    `<rect x="${x-150}" y="${n1(y-340)}" width="300" height="60" fill="none" stroke="${K}" stroke-width="7"/>`+
    `<text x="${x-159}" y="${n1(y-372)}" font-size="70" text-anchor="middle">🎈</text><text x="${x+159}" y="${n1(y-372)}" font-size="70" text-anchor="middle">🎈</text>`;
}
function doJump(R){R.jvy=-1050;R.jy=-.01;R.jbuf=0;R.qv-=420;tone(300,.25,'sine',.25,900);tone(600,.15,'triangle',.08,1200,.05);}
function press(e){if(!DR)return;ac();const R=DR;R.down=true;R.downT=performance.now();if(!R.touched){R.touched=true;$('#touch').style.display='none';}
  if(!R.won&&R.cd<=0){if(!R.started){R.started=true;return;}if(R.jy===0&&R.jvy===0)doJump(R);else R.jbuf=.25;}}
function release(){if(!DR)return;DR.down=false;DR.thr=false;}
dsvg.addEventListener('pointerdown',press);
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',()=>{if(DR){DR.down=false;DR.thr=false;}});

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
