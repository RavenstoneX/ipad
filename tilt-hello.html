<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Tilt Hello</title>
<style>
  :root {
    --bg: #f3efe6;
    --ink: #1d2433;
    --panel: rgba(255,255,255,.88);
    --accent: #2b5cff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151d;
      --ink: #f1ede4;
      --panel: rgba(30,34,46,.9);
      --accent: #7f9cff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151d; --ink: #f1ede4; --panel: rgba(30,34,46,.9); --accent: #7f9cff; color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: var(--bg); z-index: 5; text-align: center; padding: 24px;
  }
  #start h1 { margin: 0; font-size: clamp(40px, 9vw, 88px); font-weight: 800; letter-spacing: -.02em; }
  #start p { margin: 0; max-width: 30ch; font-size: 18px; line-height: 1.45; opacity: .75; }
  #go {
    font: inherit; font-size: 20px; font-weight: 700; color: #fff; background: var(--accent);
    border: 0; border-radius: 999px; padding: 16px 36px; margin-top: 8px;
  }
  #go:active { transform: scale(.97); }
  #status {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    background: var(--panel); color: var(--ink); font-size: 14px;
    padding: 8px 14px; border-radius: 999px; z-index: 4; opacity: 0;
    transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #status.show { opacity: 1; }
  #ver {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    z-index: 3; font-size: 13px; opacity: .55; pointer-events: none;
  }
  #clear {
    position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    z-index: 4; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink);
    background: var(--panel); border: 0; border-radius: 999px; padding: 10px 18px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status"></div>
<div id="ver"></div>
<button id="clear" type="button">Clear circles</button>

<div id="start">
  <h1>Tilt Hello</h1>
  <p>Tilt your iPad to make “Hello” fall. Touch the screen to drop circles.</p>
  <button id="go" type="button">Start</button>
</div>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var startEl = document.getElementById('start');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layoutText();
  }

  function say(msg, ms) {
    statusEl.textContent = msg; statusEl.classList.add('show');
    clearTimeout(say.t);
    if (ms) say.t = setTimeout(function () { statusEl.classList.remove('show'); }, ms);
  }

  /* ---------- Gravity from sensors ---------- */
  var gravity = { x: 0, y: 1 };          // unit-ish vector in screen space (y down)
  var target = { x: 0, y: 1 };
  var gotSensor = false;

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    if (typeof window.orientation === 'number') return (window.orientation + 360) % 360;
    return 0;
  }

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var VERSION = 'v5';
  var offset = 90;  // fixed turn so gravity points down on the iPad
  var verEl = document.getElementById('ver');
  verEl.textContent = VERSION;

  function onMotion(e) {
    var acc = e.accelerationIncludingGravity;
    if (!acc || acc.x == null || acc.y == null) return;
    gotSensor = true;
    // iOS reports the gravity direction itself, Android reports the opposite
    var sign = isIOS ? 1 : -1;
    var dx = sign * acc.x / 9.81;      // device frame: x right, y up
    var dy = sign * acc.y / 9.81;
    var a = (screenAngle() + offset + 360) % 360, sx, sy;
    if (a === 90)       { sx = -dy; sy = -dx; }
    else if (a === 180) { sx = -dx; sy =  dy; }
    else if (a === 270) { sx =  dy; sy =  dx; }
    else                { sx =  dx; sy = -dy; }
    target.x = sx; target.y = sy;
  }

  function startSensors() {
    var needsPermission = typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission === 'function';
    function attach() {
      window.addEventListener('devicemotion', onMotion, true);
      setTimeout(function () {
        if (!gotSensor) say('No motion sensor data. Check Settings › Safari › Motion & Orientation Access.', 7000);
      }, 1800);
    }
    if (needsPermission) {
      DeviceMotionEvent.requestPermission().then(function (r) {
        if (r === 'granted') attach();
        else say('Motion access was denied. Reload the page to try again.', 7000);
      }).catch(function () {
        say('Could not get motion access here.', 6000);
      });
    } else {
      attach();
    }
  }

  /* ---------- Hello text body ---------- */
  var hello = { x: 0, y: 0, vx: 0, vy: 0, a: 0, va: 0, hw: 100, hh: 50, fs: 100 };
  function layoutText() {
    hello.fs = Math.max(70, Math.min(W, H) * 0.2);
    ctx.font = '800 ' + hello.fs + 'px "Avenir Next", "Trebuchet MS", system-ui, sans-serif';
    hello.hw = ctx.measureText('Hello').width / 2;
    hello.hh = hello.fs * 0.5;
    if (!hello.placed) { hello.x = W / 2; hello.y = H * 0.3; hello.placed = true; }
  }

  /* ---------- Pop sound ---------- */
  var actx = null;
  function initAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !actx) actx = new AC();
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (err) {}
  }
  function pop(r) {
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume();
      var t = actx.currentTime;
      var f = 620 - r * 6;                       // smaller ball, higher pop
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.22, t + 0.09);
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.14);
      var len = Math.floor(actx.sampleRate * 0.03);
      var buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      var n = actx.createBufferSource(), ng = actx.createGain();
      n.buffer = buf; ng.gain.value = 0.35;
      n.connect(ng); ng.connect(actx.destination);
      n.start(t);
    } catch (err) {}
  }

  /* ---------- Circles ---------- */
  var circles = [];
  var MAX = 160;
  var palette = ['#ff5a4f', '#ffb020', '#2fbf71', '#2b8cff', '#8a5cff', '#ff4fa0', '#14b8c4'];
  var colorIdx = 0;

  function spawn(x, y) {
    var r = 24 + Math.random() * 22;
    var c = { x: x, y: y, vx: (Math.random() - .5) * 120, vy: (Math.random() - .5) * 120,
              r: r, c: palette[colorIdx++ % palette.length] };
    circles.push(c);
    if (circles.length > MAX) circles.shift();
    return c;
  }

  var pointers = {};
  var rings = [];

  // pop the top circle under (x, y); circles owned by this pointer's own trail are skipped
  function popAt(x, y, pid) {
    for (var i = circles.length - 1; i >= 0; i--) {
      var c = circles[i], dx = x - c.x, dy = y - c.y, rr = c.r + 6;
      if (c.owner === pid) continue;
      if (dx * dx + dy * dy <= rr * rr) {
        circles.splice(i, 1);
        rings.push({ x: c.x, y: c.y, r: c.r, c: c.c, t: 0 });
        pop(c.r);
        return true;
      }
    }
    return false;
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = { x: e.clientX, y: e.clientY, onBall: false, lx: e.clientX, ly: e.clientY };
    pointers[e.pointerId] = p;
    if (popAt(e.clientX, e.clientY, e.pointerId)) { p.onBall = true; return; }
    spawn(e.clientX, e.clientY).owner = e.pointerId;
  });
  canvas.addEventListener('pointermove', function (e) {
    var p = pointers[e.pointerId];
    if (!p) return;
    // walk along the finger's path so fast drags don't skip circles
    var dx = e.clientX - p.lx, dy = e.clientY - p.ly;
    var n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 12)), k, popped = false;
    for (k = 1; k <= n; k++) {
      if (popAt(p.lx + dx * k / n, p.ly + dy * k / n, e.pointerId)) popped = true;
    }
    p.lx = e.clientX; p.ly = e.clientY;
    if (popped) p.onBall = true;
    if (p.onBall) return;
    var sx = e.clientX - p.x, sy = e.clientY - p.y;
    if (sx * sx + sy * sy > 55 * 55) { p.x = e.clientX; p.y = e.clientY; spawn(p.x, p.y).owner = e.pointerId; }
  });
  function up(e) {
    delete pointers[e.pointerId];
    for (var i = 0; i < circles.length; i++) if (circles[i].owner === e.pointerId) delete circles[i].owner;
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  document.getElementById('clear').addEventListener('click', function () { circles.length = 0; });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  /* ---------- Physics ---------- */
  var G = 2600;        // px/s²
  var REST = 0.45;

  function step(dt) {
    for (var q = rings.length - 1; q >= 0; q--) { rings[q].t += dt; if (rings[q].t > 0.28) rings.splice(q, 1); }
    // smooth the sensor vector
    gravity.x += (target.x - gravity.x) * Math.min(1, dt * 12);
    gravity.y += (target.y - gravity.y) * Math.min(1, dt * 12);
    var gx = gravity.x * G, gy = gravity.y * G;

    // circles
    var i, j, c, d, dx, dy, dist, min, nx, ny, overlap, rel, imp;
    for (i = 0; i < circles.length; i++) {
      c = circles[i];
      c.vx += gx * dt; c.vy += gy * dt;
      c.vx *= 0.9985; c.vy *= 0.9985;
      c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.x < c.r)     { c.x = c.r;     c.vx = -c.vx * REST; }
      if (c.x > W - c.r) { c.x = W - c.r; c.vx = -c.vx * REST; }
      if (c.y < c.r)     { c.y = c.r;     c.vy = -c.vy * REST; }
      if (c.y > H - c.r) { c.y = H - c.r; c.vy = -c.vy * REST; }
    }
    for (i = 0; i < circles.length; i++) {
      for (j = i + 1; j < circles.length; j++) {
        var a = circles[i], b = circles[j];
        dx = b.x - a.x; dy = b.y - a.y; min = a.r + b.r;
        if (dx * dx + dy * dy < min * min) {
          dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
          nx = dx / dist; ny = dy / dist; overlap = (min - dist) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) {
            imp = -(1 + REST) * rel / 2;
            a.vx -= imp * nx; a.vy -= imp * ny;
            b.vx += imp * nx; b.vy += imp * ny;
          }
        }
      }
    }

    // Hello: falls, bounces off walls, and turns so its feet point along gravity
    var h = hello;
    h.vx += gx * dt; h.vy += gy * dt;
    h.vx *= 0.999; h.vy *= 0.999;
    h.x += h.vx * dt; h.y += h.vy * dt;

    var gl = Math.hypot(gravity.x, gravity.y) || 1;
    var want = Math.atan2(-gravity.x / gl, gravity.y / gl);
    var diff = want - h.a;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    h.va += (diff * 60 - h.va * 5.5) * dt;
    h.a += h.va * dt;

    var ca = Math.abs(Math.cos(h.a)), sa = Math.abs(Math.sin(h.a));
    var ex = ca * h.hw + sa * h.hh, ey = sa * h.hw + ca * h.hh;
    var hit = 0;
    if (h.x < ex)     { h.x = ex;     hit = Math.abs(h.vx); h.vx = -h.vx * REST; }
    if (h.x > W - ex) { h.x = W - ex; hit = Math.abs(h.vx); h.vx = -h.vx * REST; }
    if (h.y < ey)     { h.y = ey;     hit = Math.abs(h.vy); h.vy = -h.vy * REST; }
    if (h.y > H - ey) { h.y = H - ey; hit = Math.abs(h.vy); h.vy = -h.vy * REST; }
    if (hit > 250) h.va += (Math.random() - .5) * Math.min(hit, 1500) * 0.006;
  }

  /* ---------- Render ---------- */
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var i, c;
    for (i = 0; i < circles.length; i++) {
      c = circles[i];
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.fillStyle = c.c; ctx.globalAlpha = 0.9; ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (i = 0; i < rings.length; i++) {
      var rg = rings[i], k = rg.t / 0.28;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r * (1 + k * 0.7), 0, Math.PI * 2);
      ctx.strokeStyle = rg.c; ctx.lineWidth = 5 * (1 - k) + 1;
      ctx.globalAlpha = 1 - k; ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(hello.x, hello.y); ctx.rotate(hello.a);
    ctx.font = '800 ' + hello.fs + 'px "Avenir Next", "Trebuchet MS", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1d2433';
    ctx.fillText('Hello', 0, hello.fs * 0.04);
    ctx.restore();
  }

  var last = 0, running = false;
  function frame(t) {
    if (!running) return;
    var dt = Math.min(0.033, (t - last) / 1000 || 0.016);
    last = t;
    var n = 2, k;
    for (k = 0; k < n; k++) step(dt / n);
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 200); });
  resize();
  draw();

  document.getElementById('go').addEventListener('click', function () {
    startEl.style.display = 'none';
    initAudio();
    startSensors();
    running = true; last = performance.now();
    requestAnimationFrame(frame);
    say('Touch to add circles, tap or drag over them to pop', 3500);
  });
})();
</script>
</body>
</html>
