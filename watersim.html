<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Splash">
<title>Paper Splash</title>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1d2230;
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif; color: #fff;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  #stage, #ui, .canvasWrap { touch-action: none; }
  input[type=range] { touch-action: pan-x; }
  button { font-family: inherit; cursor: pointer; }
  #stage { position: fixed; left: 0; top: 0; }
  #gl, #ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  /* ---------- UI strip: its own area, never over the drawing ---------- */
  :root { --rot: 0deg; }
  #ui { position: fixed; z-index: 10; display: flex; flex-direction: row; gap: 12px; align-items: center; justify-content: center;
        left: 0; right: 0; bottom: 0; padding: 6px 8px calc(env(safe-area-inset-bottom) + 6px); background: #252b3d; }
  #toolbar { display: grid; gap: 5px; grid-auto-flow: column; grid-template-rows: repeat(2, 46px); }
  #flyout { display: grid; gap: 5px; grid-template-rows: repeat(2, 40px); grid-auto-flow: column; grid-auto-columns: 40px;
            align-content: start; justify-content: start; width: 220px; height: 85px; }
  .fgroup { display: contents; }
  .tb {
    width: 46px; height: 46px; border-radius: 13px; border: none; padding: 0;
    background: rgba(255,255,255,.93); color: #223; font-size: 20px; line-height: 1;
    box-shadow: 0 3px 0 rgba(0,0,0,.3); transition: background .15s;
  }
  .in { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        transform: rotate(var(--rot)); transition: transform .35s; }
  .in small { font-size: 7px; font-weight: 800; margin-top: 2px; letter-spacing: .2px; text-transform: uppercase; color: #556; }
  .tb svg { width: 22px; height: 22px; }
  .tb:active, .chip:active { transform: scale(.92); }
  .tb.on { background: #ffd23f; box-shadow: 0 3px 0 #b8901a, 0 0 0 3px #fff; }
  .tb.on small { color: #6a4c00; }
  .tb.toggle.on { background: #5be37d; box-shadow: 0 3px 0 #2b9a48, 0 0 0 3px #fff; }
  .tb.toggle.on small { color: #10551f; }
  .chip {
    width: 40px; height: 40px; border-radius: 12px; border: none; padding: 0;
    background: rgba(255,255,255,.88); color: #223; font-size: 17px; line-height: 1;
    box-shadow: 0 2px 0 rgba(0,0,0,.3);
  }
  .chip small { font-size: 6.5px; font-weight: 800; text-transform: uppercase; color: #556; margin-top: 2px; white-space: nowrap; }
  .chip.on { background: #7fd3ff; box-shadow: 0 2px 0 #3a8fbd, 0 0 0 2.5px #fff; }
  .dot { border-radius: 50%; background: #334; display: inline-block; }

  #hint {
    position: fixed; z-index: 11; top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(var(--rot)); padding: 10px 20px; border-radius: 22px;
    background: rgba(25,30,45,.82); font-size: 17px; font-weight: 600; pointer-events: none;
    opacity: 0; transition: opacity .35s; white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #stats {
    position: fixed; z-index: 11; right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 8px);
    font: 11px ui-monospace, Menlo, monospace; color: rgba(0,0,0,.5); pointer-events: none;
    background: rgba(255,255,255,.55); padding: 3px 7px; border-radius: 8px;
  }

  /* ---------- full screens ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; background: #000; }
  .hidden { display: none !important; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camFrame { position: absolute; inset: 18px; border: 3px dashed rgba(255,255,255,.7); border-radius: 18px; pointer-events: none; }
  #camMsg {
    position: absolute; top: calc(env(safe-area-inset-top) + 20px); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); padding: 10px 18px; border-radius: 18px; font-size: 17px; font-weight: 600; text-align: center; max-width: 80%;
  }
  .camBar { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); display: flex; justify-content: center; align-items: center; gap: 40px; }
  #shutter { width: 88px; height: 88px; border-radius: 50%; border: 6px solid #fff; background: #ff5a5a; box-shadow: 0 0 0 4px rgba(0,0,0,.35); }
  #shutter:active { transform: scale(.92); }
  .pill {
    min-width: 56px; height: 52px; border-radius: 26px; border: none; padding: 0 18px;
    background: rgba(255,255,255,.92); color: #223; font-size: 17px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(0,0,0,.3); white-space: nowrap;
  }
  .pill:active { transform: scale(.94); }
  .pill.go { background: #5be37d; color: #0c3d18; font-size: 20px; padding: 0 26px; }
  .pill.big { font-size: 24px; padding: 0 14px; }

  .editScreen { background: #1d2230; display: flex; flex-direction: column; }
  .canvasWrap { flex: 1; min-height: 0; width: 100%; position: relative; }
  .canvasWrap canvas { position: absolute; left: 0; top: 0; }
  #reviewWrap { display: flex; align-items: center; justify-content: center; padding: 14px; padding-top: calc(env(safe-area-inset-top) + 14px); }
  #reviewCanvas { position: static !important; max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .panel {
    width: 100%; display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: center;
    padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px); background: rgba(0,0,0,.28);
  }
  .slider { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #cfd6ea; }
  .slider input { width: 170px; height: 30px; accent-color: #ffd23f; }
  .slider b { color: #fff; font-weight: 800; }
  .legend { font-size: 13px; color: #cfd6ea; }
  .legend b { color: #ff6b6b; }
  .title { font-size: 15px; font-weight: 800; color: #fff; opacity: .85; }
  #edPreview { width: 120px; height: 80px; border-radius: 6px; background: #000; }

  /* ---------- settings ---------- */
  #settings { background: rgba(10,14,24,.82); display: flex; align-items: center; justify-content: center; }
  #setBox {
    width: min(680px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
    background: #252b3d; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden;
  }
  #setHead, .setHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #2e3550; }
  #setHead h2, .setHead h2 { margin: 0; font-size: 20px; }
  #setList { overflow-y: auto; padding: 6px 20px 20px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #setList h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: #ffd23f; }
  .srow { display: grid; grid-template-columns: 1fr 64px 38px; align-items: center; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .srow label { font-size: 14px; color: #dfe5f5; }
  .srow span { text-align: right; font: 13px ui-monospace, Menlo, monospace; color: #9fb0d8; }
  .srow .rst { width: 32px; height: 28px; border-radius: 9px; border: none; background: #3a4260; color: #cfd6ea; font-size: 15px; justify-self: end; }
  .srow input[type=range] { grid-column: 1 / 4; width: 100%; height: 28px; accent-color: #7fd3ff; touch-action: pan-x; }
  .srow input[type=checkbox] { width: 26px; height: 26px; justify-self: end; accent-color: #5be37d; }
  .srow .note { grid-column: 1 / 4; font-size: 11px; color: #8a93ad; }
  .setBtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .setBtns .pill { height: 44px; font-size: 15px; }
  /* ---------- multiplayer ---------- */
  #netVideo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; display: none; background: #1d2230; }
  body.guest #netVideo { display: block; }
  body.guest #stats { display: none; }
  body.guest #bPhoto, body.guest #bEdit, body.guest #bTilt, body.guest #bSettings { display: none; }
  #bNet.live { background: #5be37d; box-shadow: 0 3px 0 #2b9a48, 0 0 0 3px #fff; }
  #netBadge { position: fixed; z-index: 11; left: calc(env(safe-area-inset-left) + 10px); top: calc(env(safe-area-inset-top) + 8px);
              font-size: 13px; font-weight: 800; background: rgba(25,30,45,.78); padding: 4px 10px; border-radius: 10px; pointer-events: none; }
  #netScr { background: rgba(10,14,24,.82); display: flex; align-items: center; justify-content: center; }
  #netBox { width: min(520px, 94vw); max-height: 90vh; display: flex; flex-direction: column; background: #252b3d; border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden; }
  #netBody { overflow-y: auto; padding: 8px 22px 22px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
  .nlab { margin-top: 8px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: #ffd23f; font-weight: 800; }
  .ninp { font: 800 20px inherit; font-family: inherit; color: #223; background: #fff; border: 0; border-radius: 12px; padding: 10px 14px; width: 100%;
          -webkit-user-select: text; user-select: text; box-sizing: border-box; }
  .nrow { display: flex; gap: 10px; align-items: center; }
  #netCode { text-transform: uppercase; letter-spacing: .3em; text-align: center; font-size: 26px; padding: 6px; }
  .ncode { font-size: 72px; font-weight: 900; letter-spacing: .14em; color: #ffd23f; line-height: 1; }
  .nnote { font-size: 13px; color: #9fb0d8; line-height: 1.4; -webkit-user-select: text; user-select: text; word-break: break-all; }
  .nerr { margin: 0; min-height: 1.2em; color: #ffb3c0; font-size: 14px; font-weight: 700; }
  #netList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #netList li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: rgba(255,255,255,.08); border-radius: 12px; font-weight: 800; }
  #netList .pc { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; flex: none; }
  #netList .tag { margin-left: auto; font-size: 11px; color: #9fb0d8; letter-spacing: .08em; }
  #netList .kick { margin-left: 8px; width: 34px; height: 30px; border: 0; border-radius: 9px; background: #5a3040; color: #fff; font-size: 15px; }
  .nseg { display: flex; gap: 6px; flex-wrap: wrap; }
  .nseg button { flex: 1; min-width: 54px; height: 40px; border: 0; border-radius: 11px; background: #3a4260; color: #dfe5f5; font-weight: 800; font-size: 14px; }
  .nseg button.on { background: #7fd3ff; color: #12324a; }
  .ncheck { display: flex; align-items: center; gap: 10px; font-size: 15px; color: #dfe5f5; }
  .ncheck input { width: 24px; height: 24px; accent-color: #5be37d; }
  #nogl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 20px; }
</style>
</head>
<body>

<div id="stage"><canvas id="gl"></canvas><video id="netVideo" playsinline muted autoplay></video><canvas id="ov"></canvas></div>

<div id="ui">
  <div id="toolbar">
    <button class="tb" id="bPhoto"><div class="in"><span>📷</span><small>Photo</small></div></button>
    <button class="tb" id="bEdit"><div class="in"><span>🖼️</span><small>Edit</small></div></button>
    <button class="tb mode on" data-mode="pour"><div class="in"><span>💧</span><small>Pour</small></div></button>
    <button class="tb mode" data-mode="pipe"><div class="in"><span>🚰</span><small>Pipe</small></div></button>
    <button class="tb mode" data-mode="sewer"><div class="in"><span>🕳️</span><small>Sewer</small></div></button>
    <button class="tb mode" data-mode="mill"><div class="in"><svg viewBox="-16 -16 32 32"><g stroke="#333" stroke-width="1">
      <path d="M0 0L0-14A8 8 0 0 1 8-7Z" fill="#ff5a5a"/><path d="M0 0L14 0A8 8 0 0 1 7 8Z" fill="#ffd23f"/>
      <path d="M0 0L0 14A8 8 0 0 1-8 7Z" fill="#3fa9ff"/><path d="M0 0L-14 0A8 8 0 0 1-7-8Z" fill="#5be37d"/></g>
      <circle r="2.6" fill="#fff" stroke="#333"/></svg><small>Mill</small></div></button>
    <button class="tb mode" data-mode="wall"><div class="in"><span>🧱</span><small>Wall</small></div></button>
    <button class="tb mode" data-mode="wind"><div class="in"><span>🌬️</span><small>Wind</small></div></button>
    <button class="tb mode" data-mode="fish"><div class="in"><span>🐠</span><small>Animal</small></div></button>
    <button class="tb mode" data-mode="fire"><div class="in"><span>🔥</span><small>Fire</small></div></button>
    <button class="tb mode" data-mode="bomb"><div class="in"><span>💣</span><small>Bomb</small></div></button>
    <button class="tb mode" data-mode="object"><div class="in"><span>📦</span><small>Object</small></div></button>
    <button class="tb" id="bClear"><div class="in"><span>🧹</span><small>Clear</small></div></button>
    <button class="tb mode" data-mode="erase"><div class="in"><span>🧽</span><small>Erase</small></div></button>
    <button class="tb toggle" id="bTilt"><div class="in"><span>📱</span><small>Tilt</small></div></button>
    <button class="tb" id="bSettings"><div class="in"><span>⚙️</span><small>Setup</small></div></button>
    <button class="tb" id="bNet"><div class="in"><span>👥</span><small>Friends</small></div></button>
  </div>
  <div id="flyout"></div>
</div>
<div id="hint"></div>
<div id="stats"></div>
<div id="netBadge" class="hidden"></div>

<!-- multiplayer: one iPad shares its picture, friends join with the code -->
<div id="netScr" class="screen hidden">
  <div id="netBox">
    <div id="netHead" class="setHead"><h2>👥 Play together</h2><button class="pill go" id="netClose">Done</button></div>
    <div id="netBody">
      <div id="netMenu" style="display:flex;flex-direction:column;gap:10px">
        <div class="nlab">Your name</div>
        <input id="netName" class="ninp" maxlength="12" autocomplete="off">
        <button class="pill go" id="netHost">🎉 Share my picture</button>
        <div class="nnote">Friends see your picture live on their iPads and can play in it with you.</div>
        <div class="nlab">…or join a friend</div>
        <div class="nrow"><input id="netCode" class="ninp" placeholder="ABC" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="pill go" id="netJoin">Join</button></div>
      </div>
      <div id="netRoom" class="hidden" style="display:flex;flex-direction:column;gap:8px">
        <div class="nlab" id="netRoomLab">Room code</div>
        <div id="netCodeBig" class="ncode">···</div>
        <div id="netLink" class="nnote"></div>
        <ul id="netList"></ul>
        <div id="netHostCtl" style="display:flex;flex-direction:column;gap:8px">
          <div class="nlab">Stream quality</div>
          <div class="nseg" id="netQ"></div>
          <div class="nnote" id="netQNote"></div>
          <div class="nlab">Max players</div>
          <div class="nseg" id="netMax"></div>
          <label class="ncheck"><input type="checkbox" id="netAllowClear"> Friends can use 🧹 Clear</label>
          <label class="ncheck"><input type="checkbox" id="netPause"> Pause friends (they can only watch)</label>
        </div>
        <button class="pill" id="netLeave" style="margin-top:8px">Stop</button>
      </div>
      <p id="netErr" class="nerr"></p>
    </div>
  </div>
</div>

<!-- camera -->
<div id="camera" class="screen hidden">
  <video id="video" playsinline muted autoplay></video>
  <div id="camFrame"></div>
  <div id="camMsg">Point the camera at your drawing</div>
  <div class="camBar">
    <button class="pill" id="camCancel">✕</button>
    <button id="shutter" aria-label="Take picture"></button>
    <button class="pill" id="camGallery">🖼️</button>
  </div>
</div>

<!-- photo editor: crop / rotate / stretch -->
<div id="editor" class="screen editScreen hidden">
  <div class="canvasWrap" id="edWrap"><canvas id="edCanvas"></canvas></div>
  <div class="panel">
    <button class="pill" id="edCancel">✕</button>
    <span class="title">Drag the corners to crop</span>
    <button class="pill big" id="edRotL">↺</button>
    <button class="pill big" id="edRotR">↻</button>
    <label class="slider">Straighten <b id="edAngleV">0°</b><input type="range" id="edAngle" min="-30" max="30" step="0.5" value="0"></label>
    <label class="slider">Width <b id="edWV">100%</b><input type="range" id="edW" min="25" max="300" value="100"></label>
    <label class="slider">Height <b id="edHV">100%</b><input type="range" id="edH" min="25" max="300" value="100"></label>
    <button class="pill" id="edFill">⤢ Fill screen</button>
    <button class="pill" id="edReset">Reset</button>
    <canvas id="edPreview"></canvas>
    <button class="pill go" id="edNext">Next ›</button>
  </div>
</div>

<!-- wall detection review -->
<div id="review" class="screen editScreen hidden">
  <div class="canvasWrap" id="reviewWrap"><canvas id="reviewCanvas"></canvas></div>
  <div class="panel">
    <button class="pill" id="rvBack">‹ Back</button>
    <button class="pill" id="rvRetake">📷 Retake</button>
    <div class="legend"><b>Red</b> = walls for the water</div>
    <label class="slider">Pencil sensitivity <b id="sSensV"></b><input type="range" id="sSens" min="0" max="100" value="55"></label>
    <label class="slider">Wall thickness <b id="sThickV"></b><input type="range" id="sThick" min="0" max="5" value="1"></label>
    <label class="slider">Ignore small dots <b id="sDotsV"></b><input type="range" id="sDots" min="0" max="300" value="40"></label>
    <button class="pill go" id="rvPlay">✓ Play!</button>
  </div>
</div>

<!-- settings -->
<div id="settings" class="screen hidden">
  <div id="setBox">
    <div id="setHead"><h2>⚙️ Setup</h2><div style="display:flex;gap:10px"><button class="pill" id="setResetAll">↺ Reset all</button><button class="pill go" id="setClose">Done</button></div></div>
    <div id="setList"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">

<script>
'use strict';
/* =====================================================================
   Paper Splash — photograph a pencil drawing, play with particle water.
   - Walls: Sauvola local threshold (integral images), cleanup, dilation
   - Liquids: FLIP on a MAC grid; water / oil / foam particle types
   - Sub-pixel SDF collisions; local SDF + grid updates for drawn walls
   - Wind lines (velocity field), water mills (two-way coupled rotors)
   - Creatures swimming in the flow, rendered under the water surface
   - WebGL2: metaball splats -> refractive water / oil / foam shader
   ===================================================================== */

/* ---------------------------------------------------------------------
   Settings (persisted). Lengths & speeds are in "800-px units": they are
   scaled by world.U so changing the sim resolution keeps the feel.
   --------------------------------------------------------------------- */
const DEFAULTS = {
  maskLong: 800, cell: 5, maxParticles: 20000,
  pressureIters: 32, separateIters: 2, flipRatio: 0.9, driftK: 0.35,
  gravity: 1100, vmax: 1500, timeScale: 1,
  oilLift: 1.8, oilFlip: 0.6, foamLift: 2.6, foamLife: 12,
  brushRadius: 24, pipeSpeed: 280, pipeWidth: 10.5, sewerRadius: 12, sewerPull: 2200,
  wallS: 2, wallM: 4, wallL: 8,
  windSpeed: 420, windAccel: 3000, windWidth: 14, windOnAnimals: 0.5,
  millSize: 34, millFriction: 0.6, millMass: 2500,
  maxCreatures: 40, creatureSize: 28, creatureSwim: 60, dryTime: 10,
  fireSpread: 1, woodBurnTime: 3, oilBurnTime: 4, fireBrush: 16, fireSize: 1.4,
  ropeSpeed: 49, plastSpeed: 300, sandFriction: 0.8,
  fuseTime: 5, bombRadius: 42, fireBombGlobs: 26,
  fireFx: 1, fireRes: 3, bgBright: 0.64,
  dprCap: 2, denScale: 1, blobSize: 3.9, showStats: 1,
};
const CFG_KEY = 'paperSplash.cfg6';
const CFG = Object.assign({}, DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
  for (const k in saved) if (k in DEFAULTS && typeof saved[k] === 'number') CFG[k] = saved[k];
} catch (e) {}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {} }

const SETTINGS = [
  { g: 'Water simulation' },
  { k: 'maxParticles', l: 'Max drops', min: 2000, max: 100000, step: 1000, rebuild: 1 },
  { k: 'cell', l: 'Grid cell size (px) – smaller is finer but slower', min: 3, max: 8, step: 1, rebuild: 1 },
  { k: 'maskLong', l: 'Simulation resolution (px)', min: 400, max: 1600, step: 50, rebuild: 2 },
  { k: 'pressureIters', l: 'Pressure iterations', min: 5, max: 100, step: 1 },
  { k: 'separateIters', l: 'Drop separation iterations', min: 0, max: 4, step: 1 },
  { k: 'flipRatio', l: 'Splashiness (FLIP ratio)', min: 0.5, max: 0.99, step: 0.01 },
  { k: 'driftK', l: 'Volume keeping', min: 0, max: 1, step: 0.05 },
  { k: 'gravity', l: 'Gravity', min: 100, max: 3000, step: 50 },
  { k: 'vmax', l: 'Max speed', min: 300, max: 3000, step: 50 },
  { k: 'timeScale', l: 'Simulation speed (slow motion < 1)', min: 0.2, max: 2, step: 0.05 },
  { g: 'Oil, foam & sand' },

  /* ---- walls ---- */

  /* ---- integrate: gravity, buoyancy, wind, foam aging, anti-tunneling ---- */

  /* ---- push particles out of the walls (SDF) ---- */

              else if (nb === 1) { if (!hasR) continue; a = cellStart[c + 1]; e = cellStart[c + 2]; }
              else {
                if (!hasD) break;
                const dc = nb - 3;
                if ((dc === -1 && !hasL) || (dc === 1 && !hasR)) continue;
                const cc = c + pNX + dc; a = cellStart[cc]; e = cellStart[cc + 1];
              }
              for (let q = a; q < e; q++) {
                const j = cellEntries[q];
                let dx = px[j] - xi, dy = py[j] - yi;
                const d2 = dx * dx + dy * dy;
                if (d2 > minDist2 || d2 === 0) continue;
                const d = Math.sqrt(d2), s = 0.5 * (minDist - d) / d;
                if (si && pt[j] === 3) {     // grain-grain static friction: cancel relative sliding
                  const nx = dx / d, ny = dy / d;
                  const rdx = (px[j] - ox[j]) - (xi - ox[i]), rdy = (py[j] - oy[j]) - (yi - oy[i]);
                  const tn = rdx * nx + rdy * ny, sx = rdx - tn * nx, sy = rdy - tn * ny;
                  const kf = sx * sx + sy * sy < 0.09 ? 0.5 : fr, tx = sx * kf, ty = sy * kf;
                  xi += tx; yi += ty; px[j] -= tx; py[j] -= ty;
                }
                dx *= s; dy *= s;
                xi -= dx; yi -= dy; px[j] += dx; py[j] += dy;
              }
            }
            px[i] = xi; py[i] = yi;
          }
        }
      }
    }
  }

  /* ---- water mills: blades push liquid, liquid spins the rotor ---- */
  stepMills(dt) {
    if (!this.mills.length) return;
    const { px, py, vx, vy } = this, N = this.N, r = this.r, U = this.U;
    for (const m of this.mills) {
      const R = CFG.millSize * U * m.mul, hub = R * 0.18;
      const bt0 = Math.max(1.4, 1.2 * U), bt1 = R * 0.16;
      const reach = R + bt1 + r, reach2 = reach * reach, hubR2 = (hub + r) * (hub + r);
      const cs = [], sn = [];
      for (let k = 0; k < 4; k++) { cs.push(Math.cos(m.th + k * Math.PI / 2)); sn.push(Math.sin(m.th + k * Math.PI / 2)); }
      const w = m.om, mx = m.x, my = m.y;
      let L = 0;
      for (let i = 0; i < N; i++) {
        let rx = px[i] - mx; if (rx > reach || rx < -reach) continue;
        let ry = py[i] - my; if (ry > reach || ry < -reach) continue;
        const d2 = rx * rx + ry * ry; if (d2 > reach2) continue;
        if (d2 < hubR2 && d2 > 1e-6) {           // hub
          const d = Math.sqrt(d2), nx = rx / d, ny = ry / d, pen = hub + r - d;
          rx += nx * pen; ry += ny * pen;
          const vn = (vx[i] + w * ry) * nx + (vy[i] - w * rx) * ny;
          if (vn < 0) { vx[i] -= vn * nx; vy[i] -= vn * ny; }
        }
        for (let k = 0; k < 4; k++) {
          const bx = cs[k], by = sn[k];
          const along = rx * bx + ry * by;
          if (along < 0 || along > R) continue;
          const perp = bx * ry - by * rx, ap = perp < 0 ? -perp : perp;
          const bt = bt0 + (bt1 - bt0) * (along / R);
          if (ap >= bt + r) continue;
          const sg = perp < 0 ? -1 : 1, nx = -by * sg, ny = bx * sg, pen = bt + r - ap;
          rx += nx * pen; ry += ny * pen;
          const vbx = -w * ry, vby = w * rx;
          const vrn = (vx[i] - vbx) * nx + (vy[i] - vby) * ny;
          if (vrn < 0) {
            const dvx = -vrn * nx, dvy = -vrn * ny;
            vx[i] += dvx; vy[i] += dvy;
            L -= rx * dvy - ry * dvx;
          }
        }
        px[i] = mx + rx; py[i] = my + ry;
      }
      m.om += L / (CFG.millMass * R * R);
      m.om *= Math.exp(-CFG.millFriction * dt);
      m.om = clamp(m.om, -30, 30);
      m.th += m.om * dt;
    }
  }

  /* ---- sinks: sewers + dissolving foam ---- */
  drain(dt) {
    const { px, py, vx, vy, pt, pl } = this;
    if (this.sewers.length) {
      const U = this.U, R = CFG.sewerRadius * U, R2 = R * R, P2 = 9 * R2, pull = CFG.sewerPull * U * dt;
      for (const s of this.sewers) {
        for (let i = this.N - 1; i >= 0; i--) {
          const dx = s.x - px[i], dy = s.y - py[i], d2 = dx * dx + dy * dy;
          if (d2 < R2) { this.removeAt(i); continue; }
          if (d2 < P2) { const k = pull / Math.sqrt(d2); vx[i] += dx * k; vy[i] += dy * k; }
        }
      }
    }
    for (let i = this.N - 1; i >= 0; i--) {
      const t = pt[i];
      if ((t === 2 && pl[i] <= 0) || (t === 1 && pl[i] < 0)) this.removeAt(i);
    }
    if (this.evapAny) {                  // water boiled away by fire
      const evap = this.evap;
      for (let i = this.N - 1; i >= 0; i--) {
        if (pt[i] !== 0) continue;
        const c = this.cellOf(px[i], py[i]);
        if (evap[c] > 0) { evap[c]--; this.removeAt(i); }
      }
      evap.fill(0); this.evapAny = false;
    }
  }

  /* ---- particles -> grid ---- */
  p2g() {
    const { NX, NY, h, inv, u, v, du, dv, type, solid, fixU, fixV, validU, validV, px, py, vx, vy, pt } = this;
    const N = this.N, n = NX * NY, h2 = h * 0.5;
    u.fill(0); v.fill(0); du.fill(0); dv.fill(0);
    for (let c = 0; c < n; c++) type[c] = solid[c] ? SOLID : AIR;
    for (let i = 0; i < N; i++) {
      if (pt[i] === 3) continue;
      const xi = clamp((px[i] * inv) | 0, 0, NX - 1), yi = clamp((py[i] * inv) | 0, 0, NY - 1);
      const c = yi * NX + xi;
      if (type[c] === AIR) type[c] = FLUID;
    }
    const lo = h, hx = (NX - 1) * h, hy = (NY - 1) * h;
    for (let i = 0; i < N; i++) {
      if (pt[i] === 3) continue;
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      let fx = x * inv, fy = (y - h2) * inv;
      let x0 = Math.min(fx | 0, NX - 2), y0 = Math.min(fy | 0, NY - 2);
      let tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      let c = y0 * NX + x0, w;
      const pu = vx[i];
      w = sx * sy; u[c] += pu * w; du[c] += w;
      w = tx * sy; u[c + 1] += pu * w; du[c + 1] += w;
      w = sx * ty; u[c + NX] += pu * w; du[c + NX] += w;
      w = tx * ty; u[c + NX + 1] += pu * w; du[c + NX + 1] += w;
      fx = (x - h2) * inv; fy = y * inv;
      x0 = Math.min(fx | 0, NX - 2); y0 = Math.min(fy | 0, NY - 2);
      tx = fx - x0; ty = fy - y0; sx = 1 - tx; sy = 1 - ty;
      c = y0 * NX + x0;
      const pv = vy[i];
      w = sx * sy; v[c] += pv * w; dv[c] += w;
      w = tx * sy; v[c + 1] += pv * w; dv[c + 1] += w;
      w = sx * ty; v[c + NX] += pv * w; dv[c + NX] += w;
      w = tx * ty; v[c + NX + 1] += pv * w; dv[c + NX + 1] += w;
    }
    for (let c = 0; c < n; c++) {
      u[c] = (fixU[c] || du[c] === 0) ? 0 : u[c] / du[c];
      v[c] = (fixV[c] || dv[c] === 0) ? 0 : v[c] / dv[c];
      const x = c % NX;
      validU[c] = (type[c] === FLUID || (x > 0 && type[c - 1] === FLUID)) ? 1 : 0;
      validV[c] = (type[c] === FLUID || (c >= NX && type[c - NX] === FLUID)) ? 1 : 0;
    }
  }

  computeDensity() {
    const { NX, h, inv, density, denW, denO, denF, denS, px, py, pt } = this, N = this.N, h2 = h * 0.5;
    let oil = 0, sand = 0;
    denS.fill(0);
    density.fill(0); denW.fill(0); denO.fill(0); denF.fill(0);
    const lo = h, hx = (NX - 1) * h, hy = (this.NY - 1) * h;
    for (let i = 0; i < N; i++) {
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      const fx = (x - h2) * inv, fy = (y - h2) * inv;
      const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      const c = y0 * NX + x0;
      const w0 = sx * sy, w1 = tx * sy, w2 = sx * ty, w3 = tx * ty;
      if (pt[i] === 3) { denS[c] += w0; denS[c + 1] += w1; denS[c + NX] += w2; denS[c + NX + 1] += w3; sand++; continue; }
      density[c] += w0; density[c + 1] += w1; density[c + NX] += w2; density[c + NX + 1] += w3;
      const t = pt[i];
      const d = t === 0 ? denW : (t === 1 ? denO : denF);
      { d[c] += w0; d[c + 1] += w1; d[c + NX] += w2; d[c + NX + 1] += w3; }
      if (t === 1) oil++;
    }
    this.oilCount = oil; this.sandN = sand;
  }

  /* ---- pressure projection (Gauss-Seidel + SOR, drift compensation) ---- */
  project(dt) {
    const { NX, type, s, u, v, density, fluidList } = this, n = NX * this.NY;
    if (!this.pK || this.pK.length !== n) { this.pK = new Float32Array(n); this.pB = new Float32Array(n); }
    const pK = this.pK, pB = this.pB;
    const rest = this.restDensity, kd = CFG.driftK * this.h / dt, omega = 1.9;
    // per fluid cell constants (hoisted out of the iterations): 1/neighbors and drift bias
    let nf = 0;
    for (let c = 0; c < n; c++) {
      if (type[c] !== FLUID) continue;
      const ss = s[c - 1] + s[c + 1] + s[c - NX] + s[c + NX];
      if (ss === 0) continue;
      fluidList[nf] = c; pK[nf] = omega / ss;
      const comp = density[c] - rest; pB[nf] = comp > 0 ? kd * comp : 0;
      nf++;
    }
    this.prevU.set(u); this.prevV.set(v);
    const iters = CFG.pressureIters;
    for (let it = 0; it < iters; it++) {
      for (let f = 0; f < nf; f++) {
        const c = fluidList[f], cr = c + 1, cd = c + NX;
        const p = (pB[f] - (u[cr] - u[c] + v[cd] - v[c])) * pK[f];
        u[c] -= s[c - 1] * p; u[cr] += s[cr] * p;
        v[c] -= s[c - NX] * p; v[cd] += s[cd] * p;
      }
    }
  }

  /* ---- grid -> particles (PIC/FLIP blend per liquid type) ---- */
  g2p() {
    const { NX, NY, h, inv, u, v, prevU, prevV, validU, validV, px, py, vx, vy, pt } = this;
    const N = this.N, h2 = h * 0.5;
    const FL = [CFG.flipRatio, CFG.oilFlip, 0.4, -1];
    const lo = h, hx = (NX - 1) * h, hy = (NY - 1) * h;
    for (let i = 0; i < N; i++) {
      const flip = FL[pt[i]], pic = 1 - flip;
      if (flip < 0) continue;              // sand is not part of the fluid
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      let fx = x * inv, fy = (y - h2) * inv;
      let x0 = Math.min(fx | 0, NX - 2), y0 = Math.min(fy | 0, NY - 2);
      let tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      let c0 = y0 * NX + x0, c1 = c0 + 1, c2 = c0 + NX, c3 = c2 + 1;
      let w0 = validU[c0] * sx * sy, w1 = validU[c1] * tx * sy, w2 = validU[c2] * sx * ty, w3 = validU[c3] * tx * ty;
      let d = w0 + w1 + w2 + w3;
      if (d > 0) {
        const picV = (w0 * u[c0] + w1 * u[c1] + w2 * u[c2] + w3 * u[c3]) / d;
        const corr = (w0 * (u[c0] - prevU[c0]) + w1 * (u[c1] - prevU[c1]) + w2 * (u[c2] - prevU[c2]) + w3 * (u[c3] - prevU[c3])) / d;
        vx[i] = pic * picV + flip * (vx[i] + corr);
      }
      fx = (x - h2) * inv; fy = y * inv;
      x0 = Math.min(fx | 0, NX - 2); y0 = Math.min(fy | 0, NY - 2);
      tx = fx - x0; ty = fy - y0; sx = 1 - tx; sy = 1 - ty;
      c0 = y0 * NX + x0; c1 = c0 + 1; c2 = c0 + NX; c3 = c2 + 1;
      w0 = validV[c0] * sx * sy; w1 = validV[c1] * tx * sy; w2 = validV[c2] * sx * ty; w3 = validV[c3] * tx * ty;
      d = w0 + w1 + w2 + w3;
      if (d > 0) {
        const picV = (w0 * v[c0] + w1 * v[c1] + w2 * v[c2] + w3 * v[c3]) / d;
        const corr = (w0 * (v[c0] - prevV[c0]) + w1 * (v[c1] - prevV[c1]) + w2 * (v[c2] - prevV[c2]) + w3 * (v[c3] - prevV[c3])) / d;
        vy[i] = pic * picV + flip * (vy[i] + corr);
      }
    }
  }

  /* ---- creatures ---- */
  creatureSize(c) { return CFG.creatureSize * this.U * CREATURES[c.kind].scale * c.mul; }
  spawnCreature(x, y, kind) {
    if (this.creatures.length >= CFG.maxCreatures) return false;
    if (kind === -1) kind = ANIMAL_KINDS[(Math.random() * ANIMAL_KINDS.length) | 0];
    if (kind === -2) kind = (Math.random() * 3) | 0;
    const c = { kind, x, y, vx: 0, vy: 0, heading: this.upAng + (Math.random() < 0.5 ? 0 : Math.PI), turn: 0,
      phase: Math.random() * 6, mul: 0.85 + Math.random() * 0.3, wet: 0, angle: 0, tilt: 0, face: 1, dry: 0, scared: 0 };
    if (this.sdfAt(x, y) < this.creatureSize(c) * 0.3) return false;
    c.angle = c.heading;
    this.creatures.push(c);
    return true;
  }
  poof(x, y, size) {
    for (let k = 0; k < 14; k++) {
      const a = Math.random() * Math.PI * 2, sp = (20 + Math.random() * 60) * this.U;
      this.spawnEmber(x + Math.cos(a) * size * 0.2, y + Math.sin(a) * size * 0.2, Math.cos(a) * sp, Math.sin(a) * sp, 0.5 + Math.random() * 0.5, 1);
    }
  }
  updateCreatures(dt, gx, gy) {
    if (!this.creatures.length) return;
    const gl = Math.hypot(gx, gy), upx = gl > 1 ? -gx / gl : 0, upy = gl > 1 ? -gy / gl : -1;
    const rest = this.restDensity, MW = this.MW, MH = this.MH, f = this.frame, U = this.U;
    const rx = Math.cos(this.upAng), ry = Math.sin(this.upAng);        // "right" in the physical frame
    const bombR = CFG.bombRadius * U;
    const wSpeed = CFG.windSpeed * U * CFG.windOnAnimals, wAcc = CFG.windAccel * U * CFG.windOnAnimals * dt;
    for (let ci = this.creatures.length - 1; ci >= 0; ci--) {
      const c = this.creatures[ci];
      const T = CREATURES[c.kind], size = this.creatureSize(c), rad = size * 0.3;
      const cell = this.cellOf(c.x, c.y), den = this.density[cell];
      c.wet += ((den > rest * 0.35 ? 1 : 0) - c.wet) * Math.min(1, dt * 6);
      // out of water too long -> poof
      const dryNow = T.duck ? den < rest * 0.08 : c.wet < 0.5;
      c.dry = dryNow ? c.dry + dt : 0;
      if (c.dry > CFG.dryTime) { this.poof(c.x, c.y, size); this.creatures.splice(ci, 1); continue; }
      // run away from burning fuses
      let fleeX = 0, fleeY = 0;
      for (const b of this.bombs) {
        if (!b.lit) continue;
        const dx = c.x - b.x, dy = c.y - b.y, d = Math.hypot(dx, dy) + 1;
        if (d < bombR * 5) { const w = 1 - d / (bombR * 5); fleeX += dx / d * w; fleeY += dy / d * w; }
      }
      const fleeing = fleeX !== 0 || fleeY !== 0;
      if (c.scared > 0) c.scared -= dt;
      const wv = this.gridVel(c.x, c.y);
      if (T.duck) {
        const sub = Math.min(1.3, den / rest), k = 1 - 2.2 * sub;
        c.vx += gx * k * dt; c.vy += gy * k * dt;
        if (sub > 0.05) {
          const a = Math.min(1, 2 * dt) * sub;
          if (wv) { c.vx += (wv[0] - c.vx) * a; c.vy += (wv[1] - c.vy) * a; }
          c.vx *= 1 - 1.2 * dt; c.vy *= 1 - 1.2 * dt;
          if (fleeing) { c.vx += fleeX * 300 * U * dt; c.vy += fleeY * 300 * U * dt; }
        }
      } else if (c.wet > 0.5) {
        c.turn = clamp((c.turn + (Math.random() - 0.5) * dt * 12) * (1 - dt), -2, 2);
        c.heading += c.turn * dt;
        if (fleeing) {
          let da = Math.atan2(fleeY, fleeX) - c.heading; da = Math.atan2(Math.sin(da), Math.cos(da));
          c.heading += da * Math.min(1, 6 * dt);
        } else if (this.densityAt(c.x + upx * size * 0.6, c.y + upy * size * 0.6) < rest * 0.3) {
          const want = Math.atan2(-upy, -upx);
          let da = want - c.heading; da = Math.atan2(Math.sin(da), Math.cos(da));
          c.heading += da * Math.min(1, 3 * dt);
        }
        const sw = CFG.creatureSwim * U * T.swim * (fleeing || c.scared > 0 ? 2.6 : 1);
        let tx = wv ? wv[0] : 0, ty = wv ? wv[1] : 0;
        if (T.jelly) {
          const p = Math.max(0, Math.sin(c.phase * 0.5)) + (fleeing ? 0.8 : 0);
          tx += (upx * 0.7 + Math.cos(c.heading) * 0.3) * p * sw * 1.6;
          ty += (upy * 0.7 + Math.sin(c.heading) * 0.3) * p * sw * 1.6;
        } else { tx += Math.cos(c.heading) * sw; ty += Math.sin(c.heading) * sw; }
        const a = Math.min(1, 2.5 * dt);
        c.vx += (tx - c.vx) * a; c.vy += (ty - c.vy) * a;
      } else {                                   // out of water: fall & flop
        c.vx += gx * dt; c.vy += gy * dt; c.vx *= 0.997;
      }
      // wind carries animals partially
      const wx = this.windX[cell], wy = this.windY[cell];
      if ((wx !== 0 || wy !== 0) && wSpeed > 0) {
        const fw = Math.hypot(wx, wy), dx = wx / fw, dy = wy / fw, vt = c.vx * dx + c.vy * dy, target = wSpeed * fw;
        if (vt < target) { const inc = Math.min(wAcc * fw, target - vt); c.vx += dx * inc; c.vy += dy * inc; }
      }
      let sp = Math.hypot(c.vx, c.vy);
      const vmax = CFG.vmax * U;
      if (sp > vmax) { c.vx *= vmax / sp; c.vy *= vmax / sp; sp = vmax; }
      const dx = c.vx * dt, dy = c.vy * dt, steps = Math.max(1, Math.ceil(Math.abs(dx) + Math.abs(dy)));
      for (let k = 0; k < steps; k++) {
        const nx = c.x + dx / steps, ny = c.y + dy / steps;
        if (this.sdf[(ny | 0) * MW + (nx | 0)] < 1) break;
        c.x = nx; c.y = ny;
      }
      const d = this.sdfAt(c.x, c.y);
      if (d < rad) {
        const [nx, ny] = this.sdfGrad(c.x, c.y);
        c.x += nx * (rad - d); c.y += ny * (rad - d);
        const vn = c.vx * nx + c.vy * ny;
        if (vn < 0) { const b = c.wet > 0.5 ? 1 : 1.35; c.vx -= b * vn * nx; c.vy -= b * vn * ny; }
        const hx = Math.cos(c.heading), hy = Math.sin(c.heading), hn = hx * nx + hy * ny;
        if (hn < 0) c.heading = Math.atan2(hy - 2 * hn * ny, hx - 2 * hn * nx);
      }
      for (const b of this.bodies) {
        const db = sampleBody(b, c.x, c.y);
        if (db < rad) { c.x += SB_NX * (rad - db); c.y += SB_NY * (rad - db); const vn = c.vx * SB_NX + c.vy * SB_NY; if (vn < 0) { c.vx -= vn * SB_NX; c.vy -= vn * SB_NY; } }
      }
      c.x = clamp(c.x, f + 1, MW - f - 1); c.y = clamp(c.y, f + 1, MH - f - 1);
      c.phase += dt * (c.wet > 0.5 || T.duck ? 5 + sp / (25 * U) : 18);
      const along = c.vx * rx + c.vy * ry;
      if (T.upright) {
        if (Math.abs(along) > 8 * U) c.face = along > 0 ? 1 : -1;
        const want = T.duck ? Math.sin(c.phase * 0.4) * 0.12 + clamp(along * 0.0006, -0.3, 0.3) : clamp(along * 0.002, -0.5, 0.5);
        c.tilt += (want - c.tilt) * Math.min(1, 5 * dt);
      } else if (c.wet > 0.5) {
        const want = sp > 12 * U ? Math.atan2(c.vy, c.vx) : c.heading;
        let da = want - c.angle; da = Math.atan2(Math.sin(da), Math.cos(da));
        c.angle += da * Math.min(1, 6 * dt);
      } else c.angle += Math.sin(c.phase) * 0.06;
    }
  }

  /* ---- embers (visual particles): kind 0 fire, 1 puff, 2 spark ---- */
  spawnEmber(x, y, vx, vy, life, kind) {
    if (this.nEmb >= MAX_EMBERS) return;
    const j = this.nEmb++ * 7, e = this.emb;
    e[j] = x; e[j + 1] = y; e[j + 2] = vx; e[j + 3] = vy; e[j + 4] = life; e[j + 5] = life; e[j + 6] = kind;
  }
  updateEmbers(dt) {
    const e = this.emb, U = this.U, ux = this.upX, uy = this.upY, drag = Math.max(0, 1 - 1.8 * dt);

      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= NX || ny >= NY) continue;
      const nc = ny * NX + nx;
      if (plastCnt[nc] > 0 && !this.detMark[nc]) { this.detMark[nc] = 1; this.detQ.push({ c: nc, t: h / (CFG.plastSpeed * U) }); }
    }
    for (const bb of this.bombs) if (!bb.dead && Math.hypot(bb.x - x, bb.y - y) < R * 1.6) { bb.lit = true; bb.chain = true; bb.left = Math.min(bb.left, 0.08); }
    if (this.onBg) this.onBg([cx * h - 1, cy * h - 1, (cx + 1) * h + 1, (cy + 1) * h + 1]);
  }

  /* ---- rope fuses: burn along their length, light what is at the end ---- */
  addRope(pts) {
    const sp = 4 * this.U, out = [pts[0], pts[1]];
    for (let i = 2; i < pts.length; i += 2) {
      let lx = out[out.length - 2], ly = out[out.length - 1];
      const tx = pts[i], ty = pts[i + 1];
      let d = Math.hypot(tx - lx, ty - ly);
      while (d >= sp) { lx += (tx - lx) * sp / d; ly += (ty - ly) * sp / d; out.push(lx, ly); d = Math.hypot(tx - lx, ty - ly); }
    }
    if (out.length < 6) return false;
    this.ropes.push({ pts: new Float32Array(out), st: new Float32Array(out.length / 2) });
    return true;
  }
  stepRopes(dt) {
    let nb = 0;
    const rest = this.restDensity, U = this.U, stepT = (4 * U) / (CFG.ropeSpeed * U), h = this.h;
    for (let r = this.ropes.length - 1; r >= 0; r--) {
      const rp = this.ropes[r], p = rp.pts, st = rp.st, n = st.length;
      let alive = false;
      for (let k = 0; k < n; k++) {
        const s = st[k];
        if (s < 0) continue;
        alive = true;
        const x = p[2 * k], y = p[2 * k + 1], cell = this.cellOf(x, y);
        const wet = this.denW[cell] > rest * 0.3;
        if (s === 0) { if (!wet && this.heat[cell] > 0.45) st[k] = 1e-6; continue; }
        if (wet) { st[k] = 0; continue; }
        nb++;
        const a = s + dt; st[k] = a;
        this.stampHeat(x, y, h * 1.3, 1.0, 0.85);
        this.igniteAt(x, y, h * 1.4);
        if (a > stepT) { if (k > 0 && st[k - 1] === 0) st[k - 1] = 1e-6; if (k < n - 1 && st[k + 1] === 0) st[k + 1] = 1e-6; }
        if (a > stepT * 3) st[k] = -1;
        if (Math.random() < 6 * dt) this.spawnEmber(x, y, (Math.random() - 0.5) * 80 * U, (Math.random() - 0.5) * 80 * U, 0.2 + Math.random() * 0.3, 2);
      }
      if (!alive) this.ropes.splice(r, 1);
    }
    this.ropeBurning = nb;
  }

  step(dt, gx, gy) {
    this.gx = gx; this.gy = gy;
    this.emit(dt);
    this.integrate(dt, gx, gy);
    this.separate();
    this.collide();
    this.stepMills(dt);
    this.stepBodies(dt);
    this.sandVel(dt);
    this.stepFire(dt);
    this.stepPlast(dt);
    this.updateBombs(dt);
    this.drain(dt);
    this.p2g();
    this.computeDensity();
    this.project(dt);
    this.g2p();
    this.updateCreatures(dt, gx, gy);
    this.stepCount++;
  }

  fillRender(out) {
    const { px, py, vx, vy, pt } = this, N = this.N, inv = 1 / (650 * this.U);
    for (let i = 0, j = 0; i < N; i++, j += 4) {
      out[j] = px[i]; out[j + 1] = py[i];
      const s = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) * inv;
      out[j + 2] = s > 1 ? 1 : s; out[j + 3] = pt[i];
    }
    return N;
  }
}

precision highp float;

vec2 hash2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }

  vec3 tint = mix(uShallow, uDeep, thick);

const FS_F_VEL = `#version 300 es

out vec4 o;
void main(){
  vec2 v = texture(uVel, vUv).xy;

const VS_EMB = `#version 300 es
in vec4 aE; uniform vec2 uInvDomain; uniform float uScale; out vec2 vLK;
void main(){
  vec2 c = aE.xy * uInvDomain;
  gl_Position = vec4(c.x * 2.0 - 1.0, 1.0 - c.y * 2.0, 0.0, 1.0);
  float l = aE.z, k = aE.w;

const FS_EMB = `#version 300 es
precision mediump float; in vec2 vLK; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float r2 = dot(q, q);
  if (r2 > 1.0) discard;

    float a = step(r2, 0.75) * min(1.0, l * 3.0);

class FireFX {
  constructor(R) {

    this.pProj = P(FS_F_PROJ); this.pScal = P(FS_F_SCAL); this.pDraw = P(FS_FIRE);
    this.pEmb = R.program(VS_EMB, FS_EMB);

    this.w = 0; this.h = 0; this.world = null; this.solidVer = -1;
    this.eVao = gl.createVertexArray(); gl.bindVertexArray(this.eVao);
    this.eVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.eVbo);
    gl.bufferData(gl.ARRAY_BUFFER, MAX_EMBERS * 16, gl.DYNAMIC_DRAW);

    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 16, 0);

    for (const c of world.creatures) {

      const L = world.creatureSize(c);

function onWorldBurn(x, y, rad, box) {

function rebuildWorld(cap, mask, keep) {   // keep: 'all' | 'creatures' | null

  const A = { wall: new Uint8Array(mask), mat: new Uint8Array(N), burnt: new Uint8Array(N), photoWall: mask };
  for (const s of userStrokes) applyStrokeAll(A, MW, MH, s, 0);
  const nw = new World(MW, MH, A);

  if (old) { nw.upAng = old.upAng; nw.upX = old.upX; nw.upY = old.upY; }

        if (nw.add(old.px[i] * sx, old.py[i] * sy, old.vx[i] * sx, old.vy[i] * sy, old.pt[i])) nw.pl[nw.N - 1] = old.pl[i];

      nw.bombs = old.bombs.filter(b => !b.dead).map(sc);
      nw.winds = old.winds.map(w => ({ ...w, pts: w.pts.map((v, i) => v * (i & 1 ? sy : sx)) }));
      nw.rebuildWind();
      nw.ropes = old.ropes.map(r => ({ pts: r.pts.map((v, i) => v * (i & 1 ? sy : sx)), st: r.st.slice() }));
      for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
        const o = Math.min(old.MH - 1, (y / sy) | 0) * old.MW + Math.min(old.MW - 1, (x / sx) | 0), i = y * MW + x;
        if (old.plast[o] && !nw.wall[i]) { nw.plast[i] = 1; nw.plastCnt[nw.cellOf(x, y)]++; }
      }
      if (old.MW === nw.MW && old.MH === nw.MH) nw.bodies = old.bodies;
    }
    for (const c of old.creatures) {
      const n = { ...c, x: c.x * sx, y: c.y * sy, vx: 0, vy: 0 };
      if (nw.sdfAt(n.x, n.y) < 2) {
        for (let t = 0; t < 60; t++) {
          const x = Math.random() * nw.MW, y = Math.random() * nw.MH;
          if (nw.sdfAt(x, y) > 10 * nw.U) { n.x = x; n.y = y; break; }
        }

      nw.creatures.push(n);
    }
  }
  world = nw;
  initBG(cap, mask);
  renderBG(0, 0, MW, MH);
  renderer.setBackgroundImage();

}

/* ---------------------------------------------------------------------
   Camera
   --------------------------------------------------------------------- */
let stream = null;
const video = $('video');
async function openCamera() {
  $('camera').classList.remove('hidden');
  $('camMsg').textContent = 'Point the camera at your drawing';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('camMsg').textContent = 'Live camera not available here – tap 🖼️ to take or pick a photo';
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false });
    video.srcObject = stream;
    await video.play().catch(() => {});
  } catch (err) {
    $('camMsg').textContent = 'Camera blocked (needs HTTPS + permission) – tap 🖼️ to take or pick a photo';
  }
}
function closeCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  $('camera').classList.add('hidden');
}
function toSourceCanvas(img, w, h) {        // downscale huge photos once
  const k = Math.min(1, 2600 / Math.max(w, h));
  const c = makeCanvas(w * k, h * k), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
$('bPhoto').addEventListener('click', openCamera);
$('camCancel').addEventListener('click', closeCamera);
$('camGallery').addEventListener('click', () => $('fileInput').click());
$('shutter').addEventListener('click', () => {
  if (!stream || !video.videoWidth) { $('fileInput').click(); return; }
  const src = toSourceCanvas(video, video.videoWidth, video.videoHeight);
  closeCamera();
  newPhoto(src, true);
});
$('fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const img = new Image();
  img.onload = () => { closeCamera(); newPhoto(toSourceCanvas(img, img.naturalWidth, img.naturalHeight), true); URL.revokeObjectURL(img.src); };
  img.onerror = () => hint('Could not open that picture');
  img.src = URL.createObjectURL(f);
});

/* ---------------------------------------------------------------------
   Photo editor: crop / rotate (90° + straighten) / stretch width & height
   --------------------------------------------------------------------- */
function defaultPhoto(src) {
  const cc = coverCrop(src.width, src.height, screenAspect());
  return { src, rot: 0, angle: 0, crop: { x: cc.x / src.width, y: cc.y / src.height, w: cc.w / src.width, h: cc.h / src.height },
           sx: 1, sy: 1, sens: 55, thick: 1, dots: 40, edited: null };
}
function paperColor(src) {
  const c = makeCanvas(24, 24), x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0, 24, 24);
  const d = x.getImageData(0, 0, 24, 24).data, px = [];
  for (let i = 0; i < d.length; i += 4) px.push([d[i] + d[i + 1] + d[i + 2], d[i], d[i + 1], d[i + 2]]);
  px.sort((a, b) => b[0] - a[0]);
  let r = 0, g = 0, b = 0; const n = px.length >> 2;
  for (let i = 0; i < n; i++) { r += px[i][1]; g += px[i][2]; b += px[i][3]; }
  return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
}
function rotatedCanvas(ph, maxLong) {
  const src = ph.src, th = (ph.rot * 90 + ph.angle) * Math.PI / 180;
  const c = Math.abs(Math.cos(th)), s = Math.abs(Math.sin(th));
  const W = src.width * c + src.height * s, H = src.width * s + src.height * c;
  const k = Math.min(1, maxLong / Math.max(W, H));
  const out = makeCanvas(W * k, H * k), x = out.getContext('2d');
  if (!ph.paper) ph.paper = paperColor(src);
  x.fillStyle = ph.paper; x.fillRect(0, 0, out.width, out.height);
  x.imageSmoothingQuality = 'high';
  x.translate(out.width / 2, out.height / 2); x.rotate(th); x.scale(k, k);
  x.drawImage(src, -src.width / 2, -src.height / 2);
  return out;
}
function makeEdited(ph) {
  const R = rotatedCanvas(ph, 2600);
  const cx = ph.crop.x * R.width, cy = ph.crop.y * R.height, cw = ph.crop.w * R.width, ch = ph.crop.h * R.height;
  let W = cw * ph.sx, H = ch * ph.sy;
  const k = Math.min(1, 2048 / Math.max(W, H)); W *= k; H *= k;
  const out = makeCanvas(Math.max(64, W), Math.max(64, H)), x = out.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(R, cx, cy, cw, ch, 0, 0, out.width, out.height);
  return out;
}

const ED = { rot: null, fit: null, drag: null, fromNew: false, snapshot: null, prevPhoto: null };
const edCanvas = $('edCanvas'), edCtx = edCanvas.getContext('2d');
function snapshotPhoto(p) { return { rot: p.rot, angle: p.angle, crop: { ...p.crop }, sx: p.sx, sy: p.sy, sens: p.sens, thick: p.thick, dots: p.dots }; }

function newPhoto(src, fromNew) {
  ED.prevPhoto = photo;
  photo = defaultPhoto(src);
  openEditor(fromNew);
}
function openEditor(fromNew) {
  ED.fromNew = fromNew;
  ED.snapshot = snapshotPhoto(photo);

}
function edSyncControls() {
  $('edAngle').value = photo.angle; $('edAngleV').textContent = photo.angle + '°';
  $('edW').value = Math.round(photo.sx * 100); $('edWV').textContent = Math.round(photo.sx * 100) + '%';
  $('edH').value = Math.round(photo.sy * 100); $('edHV').textContent = Math.round(photo.sy * 100) + '%';
}
function edRebuild() { ED.rot = rotatedCanvas(photo, 1400); edLayout(); }
function edLayout() {
  const wrap = $('edWrap'), cw = wrap.clientWidth, ch = wrap.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  edCanvas.width = cw * dpr; edCanvas.height = ch * dpr;
  edCanvas.style.width = cw + 'px'; edCanvas.style.height = ch + 'px';
  const m = 34, s = Math.min((cw - 2 * m) / ED.rot.width, (ch - 2 * m) / ED.rot.height);
  const w = ED.rot.width * s, h = ED.rot.height * s;
  ED.fit = { x: (cw - w) / 2, y: (ch - h) / 2, w, h, dpr };
  edDraw();
}
function edDraw() {
  const f = ED.fit, c = edCtx, cr = photo.crop;
  c.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
  c.clearRect(0, 0, edCanvas.width, edCanvas.height);
  c.drawImage(ED.rot, f.x, f.y, f.w, f.h);
  const x = f.x + cr.x * f.w, y = f.y + cr.y * f.h, w = cr.w * f.w, h = cr.h * f.h;
  c.fillStyle = 'rgba(0,0,0,.55)';
  c.beginPath(); c.rect(f.x, f.y, f.w, f.h); c.rect(x, y, w, h); c.fill('evenodd');
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    c.beginPath(); c.moveTo(x + w * i / 3, y); c.lineTo(x + w * i / 3, y + h); c.stroke();
    c.beginPath(); c.moveTo(x, y + h * i / 3); c.lineTo(x + w, y + h * i / 3); c.stroke();
  }
  c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.strokeRect(x, y, w, h);
  for (const [hx, hy] of edHandles()) {
    c.beginPath(); c.arc(hx, hy, 10, 0, 7); c.fillStyle = '#ffd23f'; c.fill(); c.strokeStyle = '#333'; c.lineWidth = 2; c.stroke();
  }

}
function edHandles() {
  const f = ED.fit, cr = photo.crop;
  const x0 = f.x + cr.x * f.w, y0 = f.y + cr.y * f.h, x1 = x0 + cr.w * f.w, y1 = y0 + cr.h * f.h, xm = (x0 + x1) / 2, ym = (y0 + y1) / 2;
  return [[x0, y0, 'nw'], [x1, y0, 'ne'], [x0, y1, 'sw'], [x1, y1, 'se'], [xm, y0, 'n'], [xm, y1, 's'], [x0, ym, 'w'], [x1, ym, 'e']];
}
function edPreview() {
  const pc = $('edPreview'), dpr = 2, BW = 120, BH = 80;
  pc.width = BW * dpr; pc.height = BH * dpr;
  const x = pc.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#111'; x.fillRect(0, 0, BW, BH);
  const R = ED.rot, cr = photo.crop;
  const ow = cr.w * R.width * photo.sx, oh = cr.h * R.height * photo.sy;
  const s = Math.min(BW / ow, BH / oh), w = ow * s, h = oh * s;
  x.drawImage(R, cr.x * R.width, cr.y * R.height, cr.w * R.width, cr.h * R.height, (BW - w) / 2, (BH - h) / 2, w, h);
  // screen-shape outline for comparison
  const A = screenAspect(), ss = Math.min(BW / A, BH), sw2 = A * ss;
  x.strokeStyle = 'rgba(255,210,63,.9)'; x.setLineDash([3, 3]); x.strokeRect((BW - sw2) / 2 + 0.5, (BH - ss) / 2 + 0.5, sw2 - 1, ss - 1);

edCanvas.addEventListener('pointerdown', e => {
  const r = edCanvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let hit = null;
  for (const [hx, hy, id] of edHandles()) if (Math.hypot(hx - mx, hy - my) < 30) { hit = id; break; }
  const f = ED.fit, cr = photo.crop;
  if (!hit) {
    const x = f.x + cr.x * f.w, y = f.y + cr.y * f.h;
    if (mx > x && mx < x + cr.w * f.w && my > y && my < y + cr.h * f.h) hit = 'move';
  }
  if (!hit) return;
  try { edCanvas.setPointerCapture(e.pointerId); } catch (_) {}
  ED.drag = { id: hit, mx, my, crop: { ...cr } };
});
edCanvas.addEventListener('pointermove', e => {
  const d = ED.drag; if (!d) return;
  const r = edCanvas.getBoundingClientRect(), f = ED.fit;
  const dx = (e.clientX - r.left - d.mx) / f.w, dy = (e.clientY - r.top - d.my) / f.h;
  const o = d.crop, MIN = 0.08;
  let x0 = o.x, y0 = o.y, x1 = o.x + o.w, y1 = o.y + o.h;
  if (d.id === 'move') {
    const nx = clamp(o.x + dx, 0, 1 - o.w), ny = clamp(o.y + dy, 0, 1 - o.h);
    x0 = nx; y0 = ny; x1 = nx + o.w; y1 = ny + o.h;
  } else {
    if (d.id.includes('w')) x0 = clamp(o.x + dx, 0, x1 - MIN);
    if (d.id.includes('e')) x1 = clamp(o.x + o.w + dx, x0 + MIN, 1);
    if (d.id.includes('n')) y0 = clamp(o.y + dy, 0, y1 - MIN);
    if (d.id.includes('s')) y1 = clamp(o.y + o.h + dy, y0 + MIN, 1);
  }
  photo.crop = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  edDraw();
});
edCanvas.addEventListener('pointerup', () => ED.drag = null);
edCanvas.addEventListener('pointercancel', () => ED.drag = null);

function rotateCrop(cw) {

   --------------------------------------------------------------------- */
let setPending = 0, setLayout = false, setWind = false;
function fmt(v, step) { return step < 1 ? (+v).toFixed(step < 0.1 ? 2 : 1) : String(Math.round(v)); }
function buildSettings() {
  const box = $('setList'); box.innerHTML = '';
  for (const s of SETTINGS) {
    if (s.g) { const h = document.createElement('h3'); h.textContent = s.g; box.appendChild(h); continue; }
    const row = document.createElement('div'); row.className = 'srow';
    const lab = document.createElement('label'); lab.textContent = s.l; row.appendChild(lab);
    const rst = document.createElement('button'); rst.className = 'rst'; rst.textContent = '↺'; rst.title = 'Reset to default';
    if (s.toggle) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!CFG[s.k];
      cb.addEventListener('change', () => { CFG[s.k] = cb.checked ? 1 : 0; applyLive(); });
      rst.addEventListener('click', () => { CFG[s.k] = DEFAULTS[s.k]; cb.checked = !!CFG[s.k]; applyLive(); });
      row.appendChild(cb); row.appendChild(rst);
    } else {
      const val = document.createElement('span'); val.textContent = fmt(CFG[s.k], s.step); row.appendChild(val);
      row.appendChild(rst);
      const inp = document.createElement('input'); inp.type = 'range';
      inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = CFG[s.k];
      const changed = () => {
        val.textContent = fmt(CFG[s.k], s.step);
        if (s.rebuild) setPending = Math.max(setPending, s.rebuild);
        if (s.layout) setLayout = true;
        if (s.wind) setWind = true;
        applyLive();
      };
      inp.addEventListener('input', () => { CFG[s.k] = +inp.value; changed(); });
      rst.addEventListener('click', () => { if (CFG[s.k] === DEFAULTS[s.k]) return; CFG[s.k] = DEFAULTS[s.k]; inp.value = CFG[s.k]; changed(); });
      row.appendChild(inp);
      if (s.rebuild) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'applied when you press Done'; row.appendChild(n); }
    }
    box.appendChild(row);
  }
  const btns = document.createElement('div'); btns.className = 'setBtns';
  const mk = (t, fn) => { const b = document.createElement('button'); b.className = 'pill'; b.textContent = t; b.addEventListener('click', fn); btns.appendChild(b); };
  mk('🧪 Test: 100 000 drops', () => {
    CFG.maxParticles = 100000; CFG.maskLong = 1200; CFG.separateIters = 1;
    setPending = 2; buildSettings(); hint('Press Done, then pour lots of water 💧', 2500);
  });
  mk('🧽 Undo drawn walls & burns', () => { userStrokes = []; rebuildWorld(curCap, curMask, 'all'); hint('Walls restored', 1400); });
  mk('🗑️ Remove pipes, mills, bombs, wind, objects', () => {
    world.pipes = []; world.sewers = []; world.mills = []; world.bombs = []; world.winds = []; world.bodies = []; world.ropes = [];
    world.plast.fill(0); world.plastCnt.fill(0); world.rebuildWind(); renderBG(0, 0, world.MW, world.MH); hint('All tools removed', 1400);
  });
  mk('🐟 Remove animals', () => { world.creatures = []; });
  box.appendChild(btns);
}
function applyLive() { $('stats').style.display = CFG.showStats ? '' : 'none'; }
$('bSettings').addEventListener('click', () => { setPending = 0; setLayout = false; setWind = false; buildSettings(); $('settings').classList.remove('hidden'); });
$('setResetAll').addEventListener('click', () => {
  const changedRes = CFG.maskLong !== DEFAULTS.maskLong, changedGrid = CFG.cell !== DEFAULTS.cell || CFG.maxParticles !== DEFAULTS.maxParticles;
  Object.assign(CFG, DEFAULTS);
  setPending = Math.max(setPending, changedRes ? 2 : (changedGrid ? 1 : 0)); setLayout = true; setWind = true;
  applyLive(); buildSettings(); hint('All settings reset', 1200);
});
$('setClose').addEventListener('click', () => {
  $('settings').classList.add('hidden');
  saveCfg();
  if (setPending === 2) {           // new simulation resolution -> redo wall detection
    curCap = prepareCapture(photo.edited);

/* ---------------------------------------------------------------------
   Demo drawing (procedural "pencil on paper" photo)
   --------------------------------------------------------------------- */
function makeDemoPhoto(aspect) {
  const W = 1600, H = Math.round(W / aspect);
  const c = makeCanvas(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W * 0.35, H * 0.3, 50, W * 0.5, H * 0.5, W * 0.85);
  g.addColorStop(0, '#f6f1e7'); g.addColorStop(1, '#a9a092');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pencil = (pts, wdt = 4.2) => {
    for (let pass = 0; pass < 2; pass++) {
      x.beginPath();
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
        const segs = Math.ceil(Math.hypot((bx - ax) * W, (by - ay) * H) / 12);
        for (let s = 0; s <= segs; s++) {
          const t = s / segs, jx = (rnd() - 0.5) * 2.2, jy = (rnd() - 0.5) * 2.2;
          const X = (ax + (bx - ax) * t) * W + jx, Y = (ay + (by - ay) * t) * H + jy;
          if (i === 0 && s === 0) x.moveTo(X, Y); else x.lineTo(X, Y);
        }
      }
      x.strokeStyle = pass ? 'rgba(70,70,80,.55)' : 'rgba(60,60,70,.75)';
      x.lineWidth = wdt * (pass ? 0.6 : 1); x.lineCap = 'round'; x.lineJoin = 'round';
      x.stroke();
    }
  };
  const circle = (cx, cy, r) => {
    const pts = []; for (let a = 0; a <= 24; a++) pts.push([cx + Math.cos(a / 24 * 6.283) * r / aspect, cy + Math.sin(a / 24 * 6.283) * r]);
    pencil(pts);
  };
  pencil([[0.12, 0.13], [0.19, 0.28]]); pencil([[0.31, 0.13], [0.24, 0.28]]);          // funnel
  pencil([[0.10, 0.40], [0.52, 0.52]]);                                               // ramp 1
  pencil([[0.88, 0.50], [0.50, 0.64]]);                                               // ramp 2
  pencil([[0.06, 0.66], [0.06, 0.93], [0.38, 0.93], [0.38, 0.68]]);                   // pond
  pencil([[0.62, 0.12], [0.62, 0.30], [0.80, 0.30]]);                                 // L-tube
  pencil([[0.68, 0.12], [0.68, 0.245], [0.80, 0.245]]);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) circle(0.60 + i * 0.07 + j * 0.035, 0.74 + j * 0.08, 0.022);
  pencil([[0.6, 0.97], [0.96, 0.78]]);                                                // ramp to drain
  return c;
}
function demoScene() {
  const W = world.MW, H = world.MH;
  world.pipes.push({ x: W * 0.215, y: H * 0.08, a: Math.PI / 2, acc: 0, row: 0, type: 0 });

/* ---------------------------------------------------------------------
   Main loop
   --------------------------------------------------------------------- */
let last = performance.now(), acc = 0, fpsT = 0, frames = 0, simMs = 0;

  requestAnimationFrame(frame);

  if (NET.role === 'guest') { guestFrame(t); return; }
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.1) dt = 0.1;
  const G = CFG.gravity * world.U;
  if (tiltOn) { grav.x += (gravTarget.x * G - grav.x) * 0.25; grav.y += (gravTarget.y * G - grav.y) * 0.25; }
  else { grav.x += (0 - grav.x) * 0.2; grav.y += (G - grav.y) * 0.2; }
  // "up" for fire/embers follows gravity; animals & fuses follow the physical iPad orientation
  const gL = Math.hypot(grav.x, grav.y);
  world.upX = gL > 30 ? -grav.x / gL : 0; world.upY = gL > 30 ? -grav.y / gL : -1;
  const wantUp = tiltOn && gL > 0.3 * G ? Math.atan2(-grav.x, grav.y) : uiRot * Math.PI / 180;
  let dU = wantUp - world.upAng; dU = Math.atan2(Math.sin(dU), Math.cos(dU));

  let ticks = 0;
  const t0 = performance.now();
  while (acc >= base && ticks < 2) {

  if (acc > base) acc = 0;
  if (ticks) simMs = simMs * 0.9 + 0.1 * (performance.now() - t0) / ticks;

    world.charList.length = 0;

  if (NET.role === 'host') netHostFrame(t);
  frames++;

}

    octx.lineWidth = 3 * s; octx.strokeStyle = 'rgba(255,255,255,.85)';
    octx.beginPath(); octx.arc(g.x * ov.width, g.y * ov.height, 12 * s, 0, 7); octx.stroke();
    octx.lineWidth = 2 * s; octx.strokeStyle = NET_COL[NET.myC | 0];
    octx.beginPath(); octx.arc(g.x * ov.width, g.y * ov.height, 12 * s, 0, 7); octx.stroke();
  }
  const v = $('netVideo');
  if (!v.srcObject || v.readyState < 2) {
    octx.fillStyle = 'rgba(255,255,255,.7)'; octx.font = `700 ${Math.round(18 * s)}px -apple-system, system-ui, sans-serif`;
    octx.textAlign = 'center'; octx.fillText('Waiting for the picture…', ov.width / 2, ov.height / 2);
  } else if (v.videoWidth && Math.abs(v.videoWidth / v.videoHeight - NET.aspect) > 0.02) { NET.aspect = v.videoWidth / v.videoHeight; layout(); }
}

/* ---------------- shared ---------------- */
function netLeave() {
  const p = NET.peer, wasHost = NET.role === 'host';
  if (wasHost) {
    for (const pl of NET.players) { for (const i of [...pl.ptrs.keys()]) if (pl.n) netRemoteUp(pl, i); try { pl.call && pl.call.close(); } catch (_) {} }
  }
  NET.role = null; NET.peer = null; NET.hostConn = null; NET.call = null; NET.conns.clear(); NET.players = []; NET.list = [];
  NET.gptr.clear(); NET.gmoves = []; NET.windView = false; NET.paused = false; NET.perm = { clear: true, paused: false };
  if (NET.mstream) { for (const tr of NET.mstream.getTracks()) tr.stop(); NET.mstream = null; NET.scv = null; NET.sctx = null; }
  const v = $('netVideo'); v.srcObject = null;
  document.body.classList.remove('guest');
  if (p) { try { p.destroy(); } catch (_) {} }
  last = performance.now();
  layout(); netUI();
}
function netStats() {
  if (NET.role === 'host' && NET.scv) return ` · 📡 ${NET.scv.width}×${NET.scv.height}@${STREAM_Q[NET.q].fps}`;
  return '';
}
function netUI() {
  const role = NET.role, inRoom = role === 'host' || role === 'guest';
  $('netMenu').classList.toggle('hidden', inRoom);
  $('netRoom').classList.toggle('hidden', !inRoom);
  $('bNet').classList.toggle('live', inRoom);
  const badge = $('netBadge');
  badge.classList.toggle('hidden', !inRoom);
  if (!inRoom) return;
  const host = role === 'host';
  const list = host ? NET.players.map(p => ({ n: p.n, name: p.name, c: p.c })) : NET.list;
  badge.textContent = host ? `📡 ${NET.code} · ${list.length - 1} friend${list.length === 2 ? '' : 's'}` : `📡 ${NET.code}${NET.perm.paused ? ' · paused ✋' : ''}`;
  $('netRoomLab').textContent = host ? 'Room code – friends tap 👥 and enter it' : 'You are in room';
  $('netCodeBig').textContent = NET.code || '···';
  const canLink = /^https?:/.test(location.protocol);
  $('netLink').textContent = host && canLink ? 'Or open: ' + location.origin + location.pathname + '?join=' + NET.code : '';
  $('netList').innerHTML = list.map(p => `<li><span class="pc" style="background:${NET_COL[p.c] || '#fff'}"></span>${netEsc(p.name)}` +
    (p.n === 0 ? '<span class="tag">HOST</span>' : '') + (host ? '' : (p.n === NET.myN ? '<span class="tag">YOU</span>' : '')) +
    (host && p.n !== 0 ? `<button class="kick" data-n="${p.n}" aria-label="Remove ${netEsc(p.name)}">✕</button>` : '') + '</li>').join('');
  $('netList').querySelectorAll('.kick').forEach(b => b.onclick = () => netKick(+b.dataset.n));
  $('netHostCtl').classList.toggle('hidden', !host);
  $('netLeave').textContent = host ? 'Stop sharing' : 'Leave';
  if (host) {
    const qs = $('netQ'); qs.innerHTML = '';
    STREAM_Q.forEach((Q, i) => { const b = document.createElement('button'); b.textContent = Q.name; b.classList.toggle('on', i === NET.q); b.onclick = () => netSetQuality(i); qs.appendChild(b); });
    const Q = STREAM_Q[NET.q];
    $('netQNote').textContent = `${Q.res}px · ${Q.fps} fps · up to ${(Q.kbps / 1000).toFixed(1)} Mbit/s per friend. ${Q.note}`;
    const ms = $('netMax'); ms.innerHTML = '';
    for (let n = 2; n <= 8; n++) { const b = document.createElement('button'); b.textContent = n; b.classList.toggle('on', n === NET.max);
      b.onclick = () => { NET.max = n; netSavePrefs(); netBroadcastPlayers(); }; ms.appendChild(b); }
    $('netAllowClear').checked = NET.allowClear; $('netPause').checked = NET.paused;
  }
}
function netOpen() { $('netName').value = NET.name; netUI(); $('netScr').classList.remove('hidden'); }
$('bNet').addEventListener('click', netOpen);
$('netClose').addEventListener('click', () => $('netScr').classList.add('hidden'));
$('netName').addEventListener('change', () => { NET.name = netClean($('netName').value); netSavePrefs(); });
$('netHost').addEventListener('click', () => { NET.name = netClean($('netName').value); netSavePrefs(); netHost(); });
$('netJoin').addEventListener('click', () => { NET.name = netClean($('netName').value); netSavePrefs(); netJoin($('netCode').value); });
$('netCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('netJoin').click(); });
$('netLeave').addEventListener('click', () => { netLeave(); netErr(''); });
$('netAllowClear').addEventListener('change', e => { NET.allowClear = e.target.checked; netSavePrefs(); netSendPerm(); });
$('netPause').addEventListener('change', e => {
  NET.paused = e.target.checked; netSendPerm(); netUI();
  if (NET.paused) for (const pl of NET.players) if (pl.n) for (const i of [...pl.ptrs.keys()]) netRemoteUp(pl, i);
});
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && NET.role) keepAwake(); });

function init() {
  try { renderer = new Renderer(glc); }
  catch (e) {
    document.body.innerHTML = '<div id="nogl">Sorry, this device needs WebGL2 to run Paper Splash.<br><small>' + e.message + '</small></div>';
    return;
  }
  photo = defaultPhoto(makeDemoPhoto(screenAspect()));
  photo.edited = makeEdited(photo);
  curCap = prepareCapture(photo.edited);
  curMask = computeWalls(curCap, photo.sens, photo.thick, photo.dots);
  const wr = 7 / 800;
  userStrokes = [
    { mode: 'toWood', rN: wr, pts: [0.62, 0.12, 0.62, 0.30, 0.80, 0.30] },
    { mode: 'toWood', rN: wr, pts: [0.68, 0.12, 0.68, 0.245, 0.80, 0.245] },
  ];
  rebuildWorld(curCap, curMask, null);
  demoScene();
  applyLive();
  buildFlyout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  hint('Take a 📷 photo of your drawing, or play with this one!', 4000);
  requestAnimationFrame(frame);
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) { $('netCode').value = jc.toUpperCase().slice(0, 3); netOpen(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeCamera(); last = performance.now(); });
init();
</script>
