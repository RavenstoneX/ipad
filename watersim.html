void main(){ o = vec4(texture(uTex, vec2(vUv.x, 1.0 - vUv.y)).rgb, 1.0); }`;
const VS_SPRITE = `#version 300 es
in vec4 aV; out vec2 vT;
void main(){ gl_Position = vec4(aV.xy, 0.0, 1.0); vT = aV.zw; }`;
const FS_SPRITE = `#version 300 es
precision mediump float;
in vec2 vT; uniform sampler2D uTex; uniform float uAlpha; out vec4 o;
void main(){ o = texture(uTex, vT) * uAlpha; }`;
const FS_WATER = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uBg, uDen;
uniform vec2 uTexel;
uniform float uTime, uAspect, uFlipBg;
uniform vec3 uShallow, uDeep;
out vec4 o;
const float T = 0.22;
float caustic(vec2 p, float t){
  p *= 7.0;
  vec2 q = p + vec2(sin(p.y * 1.3 + t * 0.9), cos(p.x * 1.1 - t * 0.7)) * 0.7;
  float v = sin(q.x * 2.0 + t) * sin(q.y * 2.0 - t * 1.2);
  v += 0.5 * sin((q.x + q.y) * 3.1 + t * 1.7);
  return pow(clamp(1.0 - abs(v), 0.0, 1.0), 7.0);
}
vec2 hash2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float cells(vec2 p){
  vec2 i = floor(p), f = fract(p); float m = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 r = g + hash2(i + g) * 0.8 + 0.1 - f; m = min(m, dot(r, r));
  }
  return sqrt(m);
}
uniform float uBgB;
vec3 bgAt(vec2 uv){ return texture(uBg, vec2(uv.x, mix(uv.y, 1.0 - uv.y, uFlipBg))).rgb * uBgB; }
void main(){
  vec4 D = texture(uDen, vUv);
  float d = D.r;
  vec3 bg = bgAt(vUv);
  float sh = texture(uDen, vUv + vec2(-uTexel.x * 3.0, uTexel.y * 4.0)).r;
  float shadow = smoothstep(0.05, 0.5, sh) * 0.22;
  if (d < T - 0.06) { o = vec4(bg * (1.0 - shadow), 1.0); return; }

  vec2 o1 = uTexel * 2.5, o2 = vec2(uTexel.x, -uTexel.y) * 2.5;
  float a1 = texture(uDen, vUv + o1).r, b1 = texture(uDen, vUv - o1).r;
  float a2 = texture(uDen, vUv + o2).r, b2 = texture(uDen, vUv - o2).r;
  vec2 g = vec2((a1 - b1) + (a2 - b2), (a1 - b1) - (a2 - b2)) * 0.5;
  float a = smoothstep(T - 0.05, T + 0.03, d);
  float thick = clamp((d - T) * 1.4, 0.0, 1.0);
  float oilF = clamp(D.b / d, 0.0, 1.0), foamF = clamp(D.a / d, 0.0, 1.0);
  vec3 n = normalize(vec3(-g * mix(2.2, 0.45, thick) * (1.0 - oilF * 0.55), 1.0));

  vec2 off = n.xy * (0.006 + 0.01 * thick);
  vec3 refr = bgAt(vUv + off);
  // water
  vec3 tint = mix(uShallow, uDeep, thick);
  vec3 wcol = refr * mix(vec3(1.0), tint, 0.55 + 0.35 * thick);
  wcol = mix(wcol, tint, 0.18 + 0.32 * thick);
  wcol += caustic(vec2((vUv.x + off.x) * uAspect, vUv.y + off.y), uTime) * 0.22 * (1.0 - thick * 0.5);
  // oil: dark amber body with a thin-film rainbow sheen
  vec3 oilT = mix(vec3(0.85, 0.58, 0.14), vec3(0.32, 0.17, 0.03), thick);
  vec3 ocol = mix(refr * vec3(0.85, 0.7, 0.35), oilT, 0.6 + 0.35 * thick);
  vec3 film = 0.5 + 0.5 * cos(6.2832 * (vec3(0.0, 0.33, 0.67) + dot(n.xy, vec2(1.6, 1.2)) + d * 0.8 + uTime * 0.05));
  ocol = mix(ocol, film, 0.32 * (1.0 - smoothstep(0.0, 0.5, thick)));
  vec3 col = mix(wcol, ocol, oilF);

  vec3 L = normalize(vec3(-0.45, 0.55, 0.75));
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, H), 0.0), mix(70.0, 120.0, oilF));
  float fres = pow(1.0 - n.z, 2.0);
  col += spec * mix(0.85, 1.3, oilF) + fres * 0.35;

  float rim = smoothstep(T - 0.05, T + 0.02, d) * (1.0 - smoothstep(T + 0.02, T + 0.13, d));
  col = mix(col, mix(uDeep, vec3(0.08, 0.05, 0.0), oilF) * 0.75, rim * 0.45);

  float sp = D.g / d;
  col = mix(col, vec3(1.0), smoothstep(0.5, 0.95, sp) * 0.65 * (1.0 - oilF));

  if (foamF > 0.02) {   // foam: soft creamy white, gently shaded by the surface normal
    float shade = clamp(0.86 + 0.14 * dot(n, normalize(vec3(-0.4, 0.5, 0.75))), 0.0, 1.0);
    vec3 fc = mix(vec3(0.86, 0.9, 0.97), vec3(1.0), shade) * (0.97 + 0.03 * sin(uTime * 0.7 + vUv.x * 9.0));
    fc = mix(fc, mix(uShallow, vec3(1.0), 0.7), 0.2 * thick * (1.0 - foamF));
    fc += spec * 0.2;
    col = mix(col, fc, smoothstep(0.12, 0.6, foamF));
  }
  o = vec4(mix(bg * (1.0 - shadow), col, a), 1.0);
}`;

/* ---- fire / smoke fluid (visual only), textures: v = 0 is the domain top ---- */
const FS_F_CURL = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uVel; uniform vec2 uTexel; out vec4 o;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x, 0.)).y, R = texture(uVel, vUv + vec2(uTexel.x, 0.)).y;
  float B = texture(uVel, vUv - vec2(0., uTexel.y)).x, T = texture(uVel, vUv + vec2(0., uTexel.y)).x;
  o = vec4(0.5 * ((R - L) - (T - B)), 0., 0., 1.);
}`;
const FS_F_VEL = `#version 300 es
precision highp float; in vec2 vUv;
uniform sampler2D uVel, uScal, uCurl, uSolid;
uniform vec2 uTexel, uInvDomain, uUp; uniform float uDt, uBuoy, uVort, uVmax;
out vec4 o;
void main(){
  vec2 v = texture(uVel, vUv).xy;
  vec2 nv = texture(uVel, vUv - v * uDt * uInvDomain).xy * 0.985;
  vec4 s = texture(uScal, vUv);
  nv += uUp * (s.r + s.a * 0.8 + s.b * 0.5 - s.g * 0.06) * uBuoy * uDt;
  float c = texture(uCurl, vUv).x;
  float cL = abs(texture(uCurl, vUv - vec2(uTexel.x, 0.)).x), cR = abs(texture(uCurl, vUv + vec2(uTexel.x, 0.)).x);
  float cB = abs(texture(uCurl, vUv - vec2(0., uTexel.y)).x), cT = abs(texture(uCurl, vUv + vec2(0., uTexel.y)).x);
  vec2 g = vec2(cR - cL, cT - cB); g /= length(g) + 1e-4;
  nv += vec2(g.y, -g.x) * c * uVort * uDt;
  float l = length(nv); if (l > uVmax) nv *= uVmax / l;
  nv *= 1.0 - texture(uSolid, vUv).r;
  o = vec4(nv, 0., 1.);
}`;
const FS_F_DIV = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uVel; uniform vec2 uTexel; out vec4 o;
void main(){
  float L = texture(uVel, vUv - vec2(uTexel.x, 0.)).x, R = texture(uVel, vUv + vec2(uTexel.x, 0.)).x;
  float B = texture(uVel, vUv - vec2(0., uTexel.y)).y, T = texture(uVel, vUv + vec2(0., uTexel.y)).y;
  o = vec4(0.5 * ((R - L) + (T - B)), 0., 0., 1.);
}`;
const FS_F_JAC = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uP, uDiv; uniform vec2 uTexel; out vec4 o;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x, 0.)).x, R = texture(uP, vUv + vec2(uTexel.x, 0.)).x;
  float B = texture(uP, vUv - vec2(0., uTexel.y)).x, T = texture(uP, vUv + vec2(0., uTexel.y)).x;
  o = vec4((L + R + B + T - texture(uDiv, vUv).x) * 0.25, 0., 0., 1.);
}`;
const FS_F_PROJ = `#version 300 es
precision highp float; in vec2 vUv; uniform sampler2D uVel, uP, uSolid; uniform vec2 uTexel; out vec4 o;
void main(){
  float L = texture(uP, vUv - vec2(uTexel.x, 0.)).x, R = texture(uP, vUv + vec2(uTexel.x, 0.)).x;
  float B = texture(uP, vUv - vec2(0., uTexel.y)).x, T = texture(uP, vUv + vec2(0., uTexel.y)).x;
  vec2 v = texture(uVel, vUv).xy - 0.5 * vec2(R - L, T - B);
  o = vec4(v * (1.0 - texture(uSolid, vUv).r), 0., 1.);
}`;
const FS_F_SCAL = `#version 300 es
precision highp float; in vec2 vUv;
uniform sampler2D uVel, uScal, uSrc, uSolid; uniform vec2 uInvDomain; uniform float uDt, uTime;
out vec4 o;
void main(){
  vec2 v = texture(uVel, vUv).xy;
  vec4 s = texture(uScal, vUv - v * uDt * uInvDomain);
  vec4 src = texture(uSrc, vUv);
  float n = fract(sin(dot(floor(vUv * vec2(211.0, 157.0)) + floor(uTime * 24.0), vec2(12.9898, 78.233))) * 43758.5453);
  s.r = s.r * exp(-4.2 * uDt) + src.r * (0.4 + 1.2 * n) * uDt * 6.5;
  s.a = s.a * exp(-3.5 * uDt) + src.a * uDt * 14.0;
  s.g = s.g * exp(-0.9 * uDt) + max(src.g, src.a * 0.6) * uDt * 1.1;
  s.b = s.b * exp(-1.2 * uDt) + src.b * uDt * 5.0;
  o = clamp(s, 0., 3.) * (1.0 - texture(uSolid, vUv).r);
}`;
const FS_FIRE = `#version 300 es
precision highp float; in vec2 vUv;
uniform sampler2D uScal; uniform vec2 uTexel, uUp; uniform float uTime, uAspect;
out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
void main(){
  vec2 fu = vec2(vUv.x, 1.0 - vUv.y);
  vec2 q = fu * vec2(uAspect, 1.0) * 26.0 - uUp * uTime * 4.0;
  float n = vn(q) * 0.6 + vn(q * 2.3 + 7.1) * 0.4;
  vec4 s = texture(uScal, fu + (n - 0.5) * uTexel * 2.5);
  float T = min(s.r + s.a, 1.35) * (0.6 + 0.8 * n);
  float I = smoothstep(0.12, 0.8, T);
  vec3 ramp = vec3(1.0, 0.22, 0.03) * smoothstep(0.1, 0.5, T) + vec3(0.0, 0.5, 0.16) * smoothstep(0.45, 1.05, T)
            + vec3(0.0, 0.22, 0.6) * smoothstep(1.0, 1.8, T);
  vec3 fire = ramp * I * 0.95;
  float g = 0.0;
  for (int k = 0; k < 4; k++) { float a = float(k) * 1.5708 + 0.4; g += texture(uScal, fu + vec2(cos(a), sin(a)) * uTexel * 8.0).r; }
  vec3 glow = vec3(1.0, 0.5, 0.15) * smoothstep(0.1, 1.5, g * 0.25) * 0.22;
  float smokeA = clamp(s.g * 0.45, 0.0, 0.5) * (0.75 + 0.5 * n) * (1.0 - I);
  float steamA = clamp(s.b * 0.45, 0.0, 0.6) * (0.75 + 0.5 * n) * (1.0 - I);
  vec3 rgb = fire + glow + vec3(0.13, 0.12, 0.12) * smokeA * (1.0 - steamA) + vec3(0.95) * steamA;
  o = vec4(rgb, 1.0 - (1.0 - smokeA) * (1.0 - steamA));
}`;
const VS_EMB = `#version 300 es
in vec4 aE; uniform vec2 uInvDomain; uniform float uScale; out vec2 vLK;
void main(){
  vec2 c = aE.xy * uInvDomain;
  gl_Position = vec4(c.x * 2.0 - 1.0, 1.0 - c.y * 2.0, 0.0, 1.0);
  float l = aE.z, k = aE.w;
  gl_PointSize = k < 0.5 ? uScale * (1.2 + l * 1.6) : (k < 1.5 ? uScale * (5.0 + (1.0 - l) * 7.0) : (k < 2.5 ? uScale * (1.4 + l) : uScale * 2.4));
  vLK = aE.zw;
}`;
const FS_EMB = `#version 300 es
precision mediump float; in vec2 vLK; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float r2 = dot(q, q);
  if (r2 > 1.0) discard;
  float l = vLK.x, k = vLK.y;
  if (k > 2.5) {                     // bomb shell piece (opaque chip)
    float a = step(r2, 0.75) * min(1.0, l * 3.0);
    vec3 c = k > 3.5 ? vec3(0.7, 0.14, 0.06) : vec3(0.16, 0.17, 0.2);
    o = vec4(c * a, a);
  } else if (k > 0.5 && k < 1.5) {          // puff (alpha)
    float a = smoothstep(1.0, 0.35, r2) * l * 0.75;
    vec3 c = mix(vec3(0.6, 0.65, 0.75), vec3(0.97), smoothstep(0.95, 0.2, r2));
    o = vec4(c * a, a);
  } else {                           // fire ember / spark (mostly additive)
    float a = (1.0 - r2) * l;
    vec3 c = k < 0.5 ? mix(vec3(1.0, 0.25, 0.04), vec3(1.0, 0.85, 0.35), l) : mix(vec3(1.0, 0.5, 0.1), vec3(1.0, 1.0, 0.8), l);
    o = vec4(c * a * 1.5, a * 0.25);
  }
}`;

class FireFX {
  constructor(R) {
    this.R = R; const gl = this.gl = R.gl;
    this.ok = R.floatFB;
    const P = fs => R.program(VS_FULL, fs);
    this.pCurl = P(FS_F_CURL); this.pVel = P(FS_F_VEL); this.pDiv = P(FS_F_DIV); this.pJac = P(FS_F_JAC);
    this.pProj = P(FS_F_PROJ); this.pScal = P(FS_F_SCAL); this.pDraw = P(FS_FIRE);
    this.pEmb = R.program(VS_EMB, FS_EMB);
    this.srcTex = R.tex(); this.solidTex = R.tex();
    this.w = 0; this.h = 0; this.world = null; this.solidVer = -1;
    this.eVao = gl.createVertexArray(); gl.bindVertexArray(this.eVao);
    this.eVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.eVbo);
    gl.bufferData(gl.ARRAY_BUFFER, MAX_EMBERS * 16, gl.DYNAMIC_DRAW);
    const loc = gl.getAttribLocation(this.pEmb, 'aE');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 16, 0);
    gl.bindVertexArray(null);
    this.eBuf = new Float32Array(MAX_EMBERS * 4);
  }
  loc(p, n) { const c = p.__u || (p.__u = {}); return n in c ? c[n] : (c[n] = this.gl.getUniformLocation(p, n)); }
  ensure(world) {
    const gl = this.gl;
    const fw = Math.max(32, Math.round(world.MW / CFG.fireRes)), fh = Math.max(32, Math.round(world.MH / CFG.fireRes));
    if (this.ok && (fw !== this.w || fh !== this.h)) {
      const del = t => { if (t) { gl.deleteTexture(t[0]); gl.deleteFramebuffer(t[1]); } };
      if (this.vel) { this.vel.forEach(del); this.scal.forEach(del); this.prs.forEach(del); del(this.curl); del(this.div); }
      this.w = fw; this.h = fh;
      const T = () => this.R.makeTarget(fw, fh, true);
      this.vel = [T(), T()]; this.scal = [T(), T()]; this.prs = [T(), T()]; this.curl = T(); this.div = T();
      if (!this.vel[0]) { this.ok = false; }
      else this.clear();
    }
    if (world !== this.world) {
      this.world = world; this.solidVer = -1;
      this.srcBuf = new Uint8Array(world.NX * world.NY * 4); this.solBuf = new Uint8Array(world.NX * world.NY * 4);
      for (const t of [this.srcTex, this.solidTex]) {
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, world.NX, world.NY, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      }
      if (this.ok) this.clear();
    }
  }
  clear() {
    const gl = this.gl;
    gl.clearColor(0, 0, 0, 0);
    for (const t of [...this.vel, ...this.scal, ...this.prs, this.curl, this.div]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t[1]); gl.clear(gl.COLOR_BUFFER_BIT); }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  upload(world) {
    const gl = this.gl, NX = world.NX, NY = world.NY, n = NX * NY, b = this.srcBuf;
    const f = world.fireSrc, sm = world.smokeSrc, st = world.steamSrc, fl = world.flashSrc;
    for (let c = 0, j = 0; c < n; c++, j += 4) {
      b[j] = Math.min(255, f[c] * 255); b[j + 1] = Math.min(255, sm[c] * 255);
      b[j + 2] = Math.min(255, st[c] * 255); b[j + 3] = Math.min(255, fl[c] * 212);
    }
    gl.bindTexture(gl.TEXTURE_2D, this.srcTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NX, NY, gl.RGBA, gl.UNSIGNED_BYTE, b);
    if (world.wallsVersion !== this.solidVer) {
      this.solidVer = world.wallsVersion;
      const s = this.solBuf, so = world.solid, fu = world.fuel;
      for (let c = 0; c < n; c++) s[c * 4] = (so[c] && fu[c] <= 0.02) ? 255 : 0;
      gl.bindTexture(gl.TEXTURE_2D, this.solidTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, NX, NY, gl.RGBA, gl.UNSIGNED_BYTE, s);
    }
  }
  run(p, target, texs, set) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target[1] : null);
    gl.useProgram(p);
    let unit = 0;
    for (const k in texs) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, texs[k]); gl.uniform1i(this.loc(p, k), unit); unit++; }
    if (set) set(n => this.loc(p, n));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  step(world, dt, time) {
    this.ensure(world);
    this.upload(world);
    if (!this.ok) return;
    const gl = this.gl, tx = 1 / this.w, ty = 1 / this.h, U = world.U;
    gl.disable(gl.BLEND); gl.bindVertexArray(this.R.emptyVao); gl.viewport(0, 0, this.w, this.h);
    dt = Math.min(dt, 1 / 30);
    const swap = k => { const t = this[k][0]; this[k][0] = this[k][1]; this[k][1] = t; };
    const texel = L => gl.uniform2f(L('uTexel'), tx, ty);
    this.run(this.pCurl, this.curl, { uVel: this.vel[0][0] }, texel);
    this.run(this.pVel, this.vel[1], { uVel: this.vel[0][0], uScal: this.scal[0][0], uCurl: this.curl[0], uSolid: this.solidTex }, L => {
      texel(L); gl.uniform2f(L('uInvDomain'), 1 / world.MW, 1 / world.MH); gl.uniform2f(L('uUp'), world.upX, world.upY);
      gl.uniform1f(L('uDt'), dt); gl.uniform1f(L('uBuoy'), 650 * U); gl.uniform1f(L('uVort'), 5.0); gl.uniform1f(L('uVmax'), 900 * U);
    });
    swap('vel');
    this.run(this.pDiv, this.div, { uVel: this.vel[0][0] }, texel);
    for (let k = 0; k < 14; k++) { this.run(this.pJac, this.prs[1], { uP: this.prs[0][0], uDiv: this.div[0] }, texel); swap('prs'); }
    this.run(this.pProj, this.vel[1], { uVel: this.vel[0][0], uP: this.prs[0][0], uSolid: this.solidTex }, texel);
    swap('vel');
    this.run(this.pScal, this.scal[1], { uVel: this.vel[0][0], uScal: this.scal[0][0], uSrc: this.srcTex, uSolid: this.solidTex }, L => {
      gl.uniform2f(L('uInvDomain'), 1 / world.MW, 1 / world.MH); gl.uniform1f(L('uDt'), dt); gl.uniform1f(L('uTime'), time);
    });
    swap('scal');
  }
  draw(world, time) {
    const gl = this.gl, cv = this.R.canvas;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cv.width, cv.height);
    gl.bindVertexArray(this.R.emptyVao);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    const tex = this.ok ? this.scal[0][0] : this.srcTex;
    const tw = this.ok ? this.w : world.NX, th = this.ok ? this.h : world.NY;
    this.run(this.pDraw, null, { uScal: tex }, L => {
      gl.uniform2f(L('uTexel'), 1 / tw, 1 / th); gl.uniform2f(L('uUp'), world.upX, world.upY);
      gl.uniform1f(L('uTime'), time); gl.uniform1f(L('uAspect'), world.MW / world.MH);
    });
    gl.disable(gl.BLEND);
  }
  drawEmbers(world) {
    const n = world.nEmb; if (!n) return;
    const gl = this.gl, e = world.emb, b = this.eBuf;
    for (let i = 0; i < n; i++) { const j = i * 7, k = i * 4; b[k] = e[j]; b[k + 1] = e[j + 1]; b[k + 2] = e[j + 4] / e[j + 5]; b[k + 3] = e[j + 6]; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.R.canvas.width, this.R.canvas.height);
    gl.useProgram(this.pEmb);
    gl.uniform2f(this.loc(this.pEmb, 'uInvDomain'), 1 / world.MW, 1 / world.MH);
    gl.uniform1f(this.loc(this.pEmb, 'uScale'), this.R.canvas.width / world.MW * world.U * 1.3);
    gl.bindVertexArray(this.eVao); gl.bindBuffer(gl.ARRAY_BUFFER, this.eVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, b, 0, n * 4);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.POINTS, 0, n);
    gl.disable(gl.BLEND);
  }
}

const PALETTES = [
  { name: 'Blue',   shallow: [0.55, 0.85, 1.0],  deep: [0.07, 0.38, 0.85] },
  { name: 'Green',  shallow: [0.70, 1.0, 0.55],  deep: [0.12, 0.62, 0.20] },
  { name: 'Pink',   shallow: [1.0, 0.72, 0.90],  deep: [0.88, 0.20, 0.58] },
  { name: 'Lava',   shallow: [1.0, 0.88, 0.40],  deep: [0.95, 0.30, 0.05] },
  { name: 'Purple', shallow: [0.85, 0.75, 1.0],  deep: [0.45, 0.20, 0.85] },
];
const MAX_SPRITE_FLOATS = 120 * 72;

class Renderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, powerPreference: 'high-performance' });
    if (!gl) throw new Error('WebGL2 not available');
    this.gl = gl; this.canvas = canvas;
    this.floatFB = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
    this.pPoints = this.program(VS_POINTS, FS_POINTS);
    this.pWater = this.program(VS_FULL, FS_WATER);
    this.pBlit = this.program(VS_FULL, FS_BLIT);
    this.pSprite = this.program(VS_SPRITE, FS_SPRITE);
    this.uP = this.uniforms(this.pPoints, ['uInvDomain', 'uSize', 'uW']);
    this.uW = this.uniforms(this.pWater, ['uBg', 'uDen', 'uTexel', 'uTime', 'uAspect', 'uShallow', 'uDeep', 'uFlipBg', 'uBgB']);
    this.uB = this.uniforms(this.pBlit, ['uTex']);
    this.uS = this.uniforms(this.pSprite, ['uTex', 'uAlpha']);
    this.allocParticles(CFG.maxParticles);
    // sprites
    this.sVao = gl.createVertexArray(); gl.bindVertexArray(this.sVao);
    this.sVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.sVbo);
    gl.bufferData(gl.ARRAY_BUFFER, MAX_SPRITE_FLOATS * 4, gl.DYNAMIC_DRAW);
    const sl = gl.getAttribLocation(this.pSprite, 'aV');
    gl.enableVertexAttribArray(sl); gl.vertexAttribPointer(sl, 4, gl.FLOAT, false, 16, 0);
    gl.bindVertexArray(null);
    this.sBuf = new Float32Array(MAX_SPRITE_FLOATS);
    this.emptyVao = gl.createVertexArray();
    this.bgTex = this.tex(); this.atlasTex = this.tex();
    gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, makeAtlas());
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    this.denTex = null; this.fbo = null; this.dw = 0; this.dh = 0;
    this.sceneTex = null; this.sceneFbo = null; this.sw = 0; this.sh = 0;
    this.palette = 0;
    this.fire = new FireFX(this);
  }
  allocParticles(P) {
    const gl = this.gl;
    if (this.vbo) { gl.deleteBuffer(this.vbo); gl.deleteVertexArray(this.vao); }
    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    this.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, P * 16, gl.DYNAMIC_DRAW);
    const loc = gl.getAttribLocation(this.pPoints, 'aP');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 16, 0);
    gl.bindVertexArray(null);
    this.buf = new Float32Array(P * 4); this.capP = P;
  }
  tex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  program(vs, fs) {
    const gl = this.gl;
    const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  uniforms(p, names) { const o = {}; for (const n of names) o[n] = this.gl.getUniformLocation(p, n); return o; }
  setBackgroundImage() {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.bgTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, BG.W, BG.H, 0, gl.RGBA, gl.UNSIGNED_BYTE, BG.img);
    BG.dirty = null;
  }
  uploadBgDirty() {
    const d = BG.dirty; if (!d) return;
    BG.dirty = null;
    const x = d[0], y = d[1], w = d[2] - d[0], h = d[3] - d[1];
    if (w <= 0 || h <= 0) return;
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.bgTex);
    gl.pixelStorei(gl.UNPACK_ROW_LENGTH, BG.W); gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, x); gl.pixelStorei(gl.UNPACK_SKIP_ROWS, y);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, BG.img);
    gl.pixelStorei(gl.UNPACK_ROW_LENGTH, 0); gl.pixelStorei(gl.UNPACK_SKIP_PIXELS, 0); gl.pixelStorei(gl.UNPACK_SKIP_ROWS, 0);
  }
  makeTarget(w, h, float) {
    const gl = this.gl, t = this.tex();
    if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) { gl.deleteTexture(t); gl.deleteFramebuffer(f); return null; }
    return [t, f];
  }
  resize(dw, dh) {
    const gl = this.gl;
    if (dw !== this.dw || dh !== this.dh) {
      if (this.denTex) { gl.deleteTexture(this.denTex); gl.deleteFramebuffer(this.fbo); }
      const r = (this.floatFB && this.makeTarget(dw, dh, true)) || this.makeTarget(dw, dh, false);
      [this.denTex, this.fbo] = r; this.dw = dw; this.dh = dh;
    }
    const cw = this.canvas.width, ch = this.canvas.height;
    if (cw !== this.sw || ch !== this.sh) {
      if (this.sceneTex) { gl.deleteTexture(this.sceneTex); gl.deleteFramebuffer(this.sceneFbo); }
      [this.sceneTex, this.sceneFbo] = this.makeTarget(cw, ch, false);
      this.sw = cw; this.sh = ch;
    }
  }
  buildSprites(world, over) {
    const out = this.sBuf, MW = world.MW, MH = world.MH;
    let k = 0;
    const put = (x, y, u, v) => { out[k++] = x / MW * 2 - 1; out[k++] = 1 - y / MH * 2; out[k++] = u; out[k++] = v; };
    for (const c of world.creatures) {
      const T = CREATURES[c.kind];
      if (!!T.over !== over) continue;
      if (k + 72 > out.length) break;
      const L = world.creatureSize(c);
      const u0 = (T.cell % 4) * 0.25, v0 = ((T.cell / 4) | 0) * 0.5;
      let ang, mirV = false, mirH = false;
      if (T.upright) { ang = world.upAng + c.tilt; mirH = c.face < 0; } else { ang = c.angle; mirV = Math.cos(ang - world.upAng) < 0; }
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const amp = (T.wiggle || 0) * L * (c.wet > 0.5 ? 0.1 : 0.18);
      const sq = T.jelly ? 1 + 0.09 * Math.sin(c.phase) : 1;
      const W = [];
      for (let j = 0; j < 4; j++) {
        const s = j / 3, tail = 1 - s;
        let lx = (s - 0.5) * L / sq;
        if (mirH) lx = -lx;
        const wig = amp * Math.sin(c.phase - tail * 2.2) * tail * tail;
        for (let row = 0; row < 2; row++) {
          let ly = (row - 0.5) * L * sq + wig;
          if (mirV) ly = -ly;
          const wx = c.x + lx * ca - ly * sa, wy = c.y + lx * sa + ly * ca;
          W.push(wx, wy);
        }
      }
      for (let j = 0; j < 3; j++) {
        const a = j * 4, b = (j + 1) * 4;
        const su = u0 + (j / 3) * 0.25, eu = u0 + ((j + 1) / 3) * 0.25, tv = v0 + 0.004, bv = v0 + 0.496;
        put(W[a], W[a + 1], su, tv); put(W[b], W[b + 1], eu, tv); put(W[b + 2], W[b + 3], eu, bv);
        put(W[a], W[a + 1], su, tv); put(W[b + 2], W[b + 3], eu, bv); put(W[a + 2], W[a + 3], su, bv);
      }
    }
    return k / 4;
  }
  drawSprites(n, alpha) {
    const gl = this.gl;
    gl.useProgram(this.pSprite);
    gl.bindVertexArray(this.sVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.sVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.sBuf, 0, n * 4);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.uniform1i(this.uS.uTex, 0); gl.uniform1f(this.uS.uAlpha, alpha);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.TRIANGLES, 0, n);
    gl.disable(gl.BLEND);
  }
  render(world, time, dt) {
    const gl = this.gl, cw = this.canvas.width, ch = this.canvas.height;
    this.uploadBgDirty();
    if (this.capP < world.maxP) this.allocParticles(world.maxP);
    const N = world.fillRender(this.buf);
    // 0) creatures under the surface -> scene = background + sprites
    let bgTex = this.bgTex, flip = 1;
    const nUnder = this.buildSprites(world, false);
    if (nUnder > 0 && this.sceneFbo) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.sceneFbo);
      gl.viewport(0, 0, cw, ch);
      gl.useProgram(this.pBlit); gl.bindVertexArray(this.emptyVao);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.bgTex); gl.uniform1i(this.uB.uTex, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      this.drawSprites(nUnder, 1);
      bgTex = this.sceneTex; flip = 0;
    }
    // 1) liquid density splats
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.fbo);
    gl.viewport(0, 0, this.dw, this.dh);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    if (N > 0) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(this.pPoints);
      gl.uniform2f(this.uP.uInvDomain, 1 / world.MW, 1 / world.MH);
      gl.uniform1f(this.uP.uSize, 2 * CFG.blobSize * world.r * this.dw / world.MW);
      gl.uniform1f(this.uP.uW, 0.28 * (3.9 / CFG.blobSize) * (3.9 / CFG.blobSize));
      gl.bindVertexArray(this.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.buf, 0, N * 4);
      gl.drawArrays(gl.POINTS, 0, N);
      gl.disable(gl.BLEND);
    }
    // 2) composite
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cw, ch);
    gl.useProgram(this.pWater);
    gl.bindVertexArray(this.emptyVao);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bgTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.denTex);
    gl.uniform1i(this.uW.uBg, 0); gl.uniform1i(this.uW.uDen, 1);
    gl.uniform2f(this.uW.uTexel, 1 / this.dw, 1 / this.dh);
    gl.uniform1f(this.uW.uTime, time);
    gl.uniform1f(this.uW.uAspect, world.MW / world.MH);
    gl.uniform1f(this.uW.uFlipBg, flip);
    gl.uniform1f(this.uW.uBgB, CFG.bgBright);
    const pal = PALETTES[this.palette];
    gl.uniform3fv(this.uW.uShallow, pal.shallow); gl.uniform3fv(this.uW.uDeep, pal.deep);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 3) submerged creatures again at partial strength (keeps colors vivid under tint), floaters on top
    if (nUnder > 0) this.drawSprites(nUnder, 0.55);
    const nOver = this.buildSprites(world, true);
    if (nOver > 0) this.drawSprites(nOver, 1);
    // 4) fire & smoke, embers
    if (world.fxLinger > 0 && CFG.fireFx) { this.fire.step(world, dt, time); this.fire.draw(world, time); }
    this.fire.drawEmbers(world);
  }
}

/* ---------------------------------------------------------------------
   App state
   --------------------------------------------------------------------- */
let world = null, renderer = null;
let photo = null;          // { src, rot, angle, crop{x,y,w,h}, sx, sy, sens, thick, dots, edited }
let curCap = null, curMask = null;
let userStrokes = [];      // { mode: stone|wood|erase|toWood|toStone|burn, rN, pts:[nx,ny,...] } normalized
let mode = 'pour', liquid = 0;
const tool = { pour: 1, wall: 1, wallMode: 'stone', wind: 1, mill: 1, fish: -1, fire: 1, bomb: 0 };
let tiltOn = false;
const grav = { x: 0, y: CFG.gravity }, gravTarget = { x: 0, y: 1 };
const stage = $('stage'), glc = $('gl'), ov = $('ov'), octx = ov.getContext('2d');
let view = { x: 0, y: 0, w: 1, h: 1, dpr: 1 };
let uiRot = 0;             // degrees, physical orientation of the iPad relative to the (locked) screen

function stageArea() {
  const ww = window.innerWidth, wh = window.innerHeight, land = ww >= wh;
  document.body.classList.toggle('land', land); document.body.classList.toggle('port', !land);
  const r = $('ui').getBoundingClientRect(), m = 8;
  return land ? { x: r.right + m, y: m, w: ww - r.right - 2 * m, h: wh - 2 * m }
              : { x: m, y: m, w: ww - 2 * m, h: r.top - 2 * m };
}
function screenAspect() { const a = stageArea(); return a.w / a.h; }
function layout() {
  const a = stageArea();
  const hn = $('hint'); hn.style.left = (a.x + a.w / 2) + 'px'; hn.style.top = (a.y + a.h / 2) + 'px';
  if (!world) return;
  const A = world.MW / world.MH;
  let w, h;
  if (a.w / a.h > A) { h = a.h; w = a.h * A; } else { w = a.w; h = a.w / A; }
  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);
  view = { x: a.x + (a.w - w) / 2, y: a.y + (a.h - h) / 2, w, h, dpr };
  Object.assign(stage.style, { left: view.x + 'px', top: view.y + 'px', width: w + 'px', height: h + 'px' });
  glc.width = Math.round(w * dpr); glc.height = Math.round(h * dpr);
  ov.width = glc.width; ov.height = glc.height;
  renderer.resize(Math.max(16, Math.round(w * CFG.denScale)), Math.max(16, Math.round(h * CFG.denScale)));
}

/* ---- build / rebuild the world, carrying over the scene ---- */
function onWorldBurn(x, y, rad, box) {
  userStrokes.push({ mode: 'burn', rN: rad / world.MW, pts: [x / world.MW, y / world.MH] });
  renderBG(box[0], box[1], box[2], box[3]);
}
function rebuildWorld(cap, mask, keep) {   // keep: 'all' | 'creatures' | null
  const old = world, MW = cap.MW, MH = cap.MH, N = MW * MH;
  const A = { wall: new Uint8Array(mask), mat: new Uint8Array(N), burnt: new Uint8Array(N), photoWall: mask };
  for (const s of userStrokes) applyStrokeAll(A, MW, MH, s, 0);
  const nw = new World(MW, MH, A);
  nw.onBurn = onWorldBurn;
  if (old) { nw.upAng = old.upAng; nw.upX = old.upX; nw.upY = old.upY; }
  if (old && keep) {
    const sx = nw.MW / old.MW, sy = nw.MH / old.MH;
    if (keep === 'all') {
      for (let i = 0; i < old.N && nw.N < nw.maxP; i++) {
        if (nw.add(old.px[i] * sx, old.py[i] * sy, old.vx[i] * sx, old.vy[i] * sy, old.pt[i])) nw.pl[nw.N - 1] = old.pl[i];
      }
      const sc = o => ({ ...o, x: o.x * sx, y: o.y * sy });
      nw.pipes = old.pipes.map(sc); nw.sewers = old.sewers.map(sc); nw.mills = old.mills.map(sc);
      nw.bombs = old.bombs.filter(b => !b.dead).map(sc);
      nw.winds = old.winds.map(w => ({ ...w, pts: w.pts.map((v, i) => v * (i & 1 ? sy : sx)) }));
      nw.rebuildWind();
    }
    for (const c of old.creatures) {
      const n = { ...c, x: c.x * sx, y: c.y * sy, vx: 0, vy: 0 };
      if (nw.sdfAt(n.x, n.y) < 2) {
        for (let t = 0; t < 60; t++) {
          const x = Math.random() * nw.MW, y = Math.random() * nw.MH;
          if (nw.sdfAt(x, y) > 10 * nw.U) { n.x = x; n.y = y; break; }
        }
      }
      nw.creatures.push(n);
    }
  }
  world = nw;
  initBG(cap, mask);
  renderBG(0, 0, MW, MH);
  renderer.setBackgroundImage();
  layout();
}

/* ---------------------------------------------------------------------
   Overlay (pipes, sewers, mills, bombs, wind, shock rings)
   --------------------------------------------------------------------- */
const drawingWinds = new Set();
function drawOverlay(time) {
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, ov.width, ov.height);
  if (!world) return;
  const k = ov.width / world.MW;
  octx.setTransform(k, 0, 0, k, 0, 0);
  if (mode === 'wind' || mode === 'erase') for (const w of world.winds) drawWind(w, time);
  for (const w of drawingWinds) drawWind(w, time);
  for (const s of world.sewers) drawSewer(s);
  for (const m of world.mills) drawMill(m);
  for (const p of world.pipes) drawPipe(p);
  for (const b of world.bombs) drawBomb(b, time);
  const now = performance.now();
  world.rings = world.rings.filter(r => now - r.t0 < 400);
  for (const r of world.rings) {
    const q = (now - r.t0) / 400;
    octx.beginPath(); octx.arc(r.x, r.y, r.R * (0.2 + 0.8 * q), 0, 7);
    octx.strokeStyle = r.fire ? `rgba(255,150,40,${1 - q})` : `rgba(255,255,255,${0.9 * (1 - q)})`;
    octx.lineWidth = 6 * world.U * (1 - q) + 1; octx.stroke();
  }
}
function drawWind(w, time) {
  const c = octx, p = w.pts, U = world.U;
  if (p.length < 4) return;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]);
  c.setLineDash([7 * U, 11 * U]); c.lineDashOffset = -time * 60 * U;
  c.strokeStyle = 'rgba(30,70,120,.45)'; c.lineWidth = 5 * U; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 2.6 * U; c.stroke();
  c.restore();
}
function drawSewer(s) {
  const R = CFG.sewerRadius * world.U + 2, c = octx;
  c.save(); c.translate(s.x, s.y);
  c.beginPath(); c.arc(0, 1.5, R + 2.5, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.25)'; c.fill();
  c.beginPath(); c.arc(0, 0, R + 2.5, 0, Math.PI * 2); c.fillStyle = '#8b95a5'; c.fill();
  c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fillStyle = '#1f2430'; c.fill();
  c.save(); c.clip();
  c.strokeStyle = '#6c7686'; c.lineWidth = R * 0.14;
  for (let x = -R; x <= R; x += R * 0.36) { c.beginPath(); c.moveTo(x, -R); c.lineTo(x, R); c.stroke(); }
  c.restore();
  c.beginPath(); c.arc(0, 0, R + 2.5, 0, Math.PI * 2); c.strokeStyle = '#555f6f'; c.lineWidth = 1.2; c.stroke();
  c.restore();
}
function drawPipe(p) {
  const c = octx, U = world.U, W = CFG.pipeWidth * U + 4, L = 24 * U, rim = 6.5 * U;
  c.save(); c.translate(p.x, p.y); c.rotate(p.a);
  c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(-L + 2, -W / 2 + 2, L, W);
  const g = c.createLinearGradient(0, -W / 2, 0, W / 2);
  g.addColorStop(0, '#ffb15a'); g.addColorStop(0.35, '#ffd9a8'); g.addColorStop(1, '#c4621c');
  c.fillStyle = g; c.fillRect(-L, -W / 2, L, W);
  c.fillStyle = LIQUIDS[p.type].color; c.fillRect(-L * 0.62, -W / 2, L * 0.16, W);
  const g2 = c.createLinearGradient(0, -W / 2 - 3, 0, W / 2 + 3);
  g2.addColorStop(0, '#ff9a3a'); g2.addColorStop(0.35, '#ffe0b8'); g2.addColorStop(1, '#a94e12');
  c.fillStyle = g2; c.fillRect(-rim, -W / 2 - 3, rim, W + 6);
  c.strokeStyle = '#7a3608'; c.lineWidth = 1.1;
  c.strokeRect(-L, -W / 2, L - rim, W); c.strokeRect(-rim, -W / 2 - 3, rim, W + 6);
  c.restore();
}
const MILL_COLORS = ['#ff5a5a', '#ffd23f', '#3fa9ff', '#5be37d'];
function drawMill(m) {
  const c = octx, U = world.U, R = CFG.millSize * U * m.mul, hub = R * 0.18;
  const bt0 = Math.max(1.4, 1.2 * U), bt1 = R * 0.16;
  c.save(); c.translate(m.x, m.y);

function findNear(list, p, R) {

  i = findNear(world.pipes, p, 22 * U); if (i >= 0) { world.pipes.splice(i, 1); return true; }
  i = findNear(world.sewers, p, 22 * U); if (i >= 0) { world.sewers.splice(i, 1); return true; }

function makeEdited(ph) {
  const R = rotatedCanvas(ph, 2600);
  const cx = ph.crop.x * R.width, cy = ph.crop.y * R.height, cw = ph.crop.w * R.width, ch = ph.crop.h * R.height;
  let W = cw * ph.sx, H = ch * ph.sy;
  const k = Math.min(1, 2048 / Math.max(W, H)); W *= k; H *= k;
  const out = makeCanvas(Math.max(64, W), Math.max(64, H)), x = out.getContext('2d');
  x.imageSmoothingQuality = 'high';
  x.drawImage(R, cx, cy, cw, ch, 0, 0, out.width, out.height);
  return out;
}

const ED = { rot: null, fit: null, drag: null, fromNew: false, snapshot: null, prevPhoto: null };
const edCanvas = $('edCanvas'), edCtx = edCanvas.getContext('2d');
function snapshotPhoto(p) { return { rot: p.rot, angle: p.angle, crop: { ...p.crop }, sx: p.sx, sy: p.sy, sens: p.sens, thick: p.thick, dots: p.dots }; }

function newPhoto(src, fromNew) {
  ED.prevPhoto = photo;
  photo = defaultPhoto(src);
  openEditor(fromNew);
}
function openEditor(fromNew) {
  ED.fromNew = fromNew;
  ED.snapshot = snapshotPhoto(photo);
  $('editor').classList.remove('hidden');
  edSyncControls();
  edRebuild();
}
function edSyncControls() {
  $('edAngle').value = photo.angle; $('edAngleV').textContent = photo.angle + '°';
  $('edW').value = Math.round(photo.sx * 100); $('edWV').textContent = Math.round(photo.sx * 100) + '%';
  $('edH').value = Math.round(photo.sy * 100); $('edHV').textContent = Math.round(photo.sy * 100) + '%';
}
function edRebuild() { ED.rot = rotatedCanvas(photo, 1400); edLayout(); }
function edLayout() {
  const wrap = $('edWrap'), cw = wrap.clientWidth, ch = wrap.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  edCanvas.width = cw * dpr; edCanvas.height = ch * dpr;
  edCanvas.style.width = cw + 'px'; edCanvas.style.height = ch + 'px';
  const m = 34, s = Math.min((cw - 2 * m) / ED.rot.width, (ch - 2 * m) / ED.rot.height);
  const w = ED.rot.width * s, h = ED.rot.height * s;
  ED.fit = { x: (cw - w) / 2, y: (ch - h) / 2, w, h, dpr };
  edDraw();
}
function edDraw() {
  const f = ED.fit, c = edCtx, cr = photo.crop;
  c.setTransform(f.dpr, 0, 0, f.dpr, 0, 0);
  c.clearRect(0, 0, edCanvas.width, edCanvas.height);
  c.drawImage(ED.rot, f.x, f.y, f.w, f.h);
  const x = f.x + cr.x * f.w, y = f.y + cr.y * f.h, w = cr.w * f.w, h = cr.h * f.h;
  c.fillStyle = 'rgba(0,0,0,.55)';
  c.beginPath(); c.rect(f.x, f.y, f.w, f.h); c.rect(x, y, w, h); c.fill('evenodd');
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    c.beginPath(); c.moveTo(x + w * i / 3, y); c.lineTo(x + w * i / 3, y + h); c.stroke();
    c.beginPath(); c.moveTo(x, y + h * i / 3); c.lineTo(x + w, y + h * i / 3); c.stroke();
  }
  c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.strokeRect(x, y, w, h);
  for (const [hx, hy] of edHandles()) {
    c.beginPath(); c.arc(hx, hy, 10, 0, 7); c.fillStyle = '#ffd23f'; c.fill(); c.strokeStyle = '#333'; c.lineWidth = 2; c.stroke();
  }
  edPreview();
}
function edHandles() {
  const f = ED.fit, cr = photo.crop;
  const x0 = f.x + cr.x * f.w, y0 = f.y + cr.y * f.h, x1 = x0 + cr.w * f.w, y1 = y0 + cr.h * f.h, xm = (x0 + x1) / 2, ym = (y0 + y1) / 2;
  return [[x0, y0, 'nw'], [x1, y0, 'ne'], [x0, y1, 'sw'], [x1, y1, 'se'], [xm, y0, 'n'], [xm, y1, 's'], [x0, ym, 'w'], [x1, ym, 'e']];
}
function edPreview() {
  const pc = $('edPreview'), dpr = 2, BW = 120, BH = 80;
  pc.width = BW * dpr; pc.height = BH * dpr;
  const x = pc.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#111'; x.fillRect(0, 0, BW, BH);
  const R = ED.rot, cr = photo.crop;
  const ow = cr.w * R.width * photo.sx, oh = cr.h * R.height * photo.sy;
  const s = Math.min(BW / ow, BH / oh), w = ow * s, h = oh * s;
  x.drawImage(R, cr.x * R.width, cr.y * R.height, cr.w * R.width, cr.h * R.height, (BW - w) / 2, (BH - h) / 2, w, h);
  // screen-shape outline for comparison
  const A = screenAspect(), ss = Math.min(BW / A, BH), sw2 = A * ss;
  x.strokeStyle = 'rgba(255,210,63,.9)'; x.setLineDash([3, 3]); x.strokeRect((BW - sw2) / 2 + 0.5, (BH - ss) / 2 + 0.5, sw2 - 1, ss - 1);
}
edCanvas.addEventListener('pointerdown', e => {
  const r = edCanvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  let hit = null;
  for (const [hx, hy, id] of edHandles()) if (Math.hypot(hx - mx, hy - my) < 30) { hit = id; break; }
  const f = ED.fit, cr = photo.crop;
  if (!hit) {
    const x = f.x + cr.x * f.w, y = f.y + cr.y * f.h;
    if (mx > x && mx < x + cr.w * f.w && my > y && my < y + cr.h * f.h) hit = 'move';
  }
  if (!hit) return;
  try { edCanvas.setPointerCapture(e.pointerId); } catch (_) {}
  ED.drag = { id: hit, mx, my, crop: { ...cr } };
});
edCanvas.addEventListener('pointermove', e => {
  const d = ED.drag; if (!d) return;
  const r = edCanvas.getBoundingClientRect(), f = ED.fit;
  const dx = (e.clientX - r.left - d.mx) / f.w, dy = (e.clientY - r.top - d.my) / f.h;
  const o = d.crop, MIN = 0.08;
  let x0 = o.x, y0 = o.y, x1 = o.x + o.w, y1 = o.y + o.h;
  if (d.id === 'move') {
    const nx = clamp(o.x + dx, 0, 1 - o.w), ny = clamp(o.y + dy, 0, 1 - o.h);
    x0 = nx; y0 = ny; x1 = nx + o.w; y1 = ny + o.h;
  } else {
    if (d.id.includes('w')) x0 = clamp(o.x + dx, 0, x1 - MIN);
    if (d.id.includes('e')) x1 = clamp(o.x + o.w + dx, x0 + MIN, 1);
    if (d.id.includes('n')) y0 = clamp(o.y + dy, 0, y1 - MIN);
    if (d.id.includes('s')) y1 = clamp(o.y + o.h + dy, y0 + MIN, 1);
  }
  photo.crop = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  edDraw();
});
edCanvas.addEventListener('pointerup', () => ED.drag = null);
edCanvas.addEventListener('pointercancel', () => ED.drag = null);

function rotateCrop(cw) {
  const c = photo.crop;
  photo.crop = cw ? { x: 1 - c.y - c.h, y: c.x, w: c.h, h: c.w } : { x: c.y, y: 1 - c.x - c.w, w: c.h, h: c.w };
  const t = photo.sx; photo.sx = photo.sy; photo.sy = t;
}
$('edRotR').addEventListener('click', () => { photo.rot = (photo.rot + 1) % 4; rotateCrop(true); edSyncControls(); edRebuild(); });
$('edRotL').addEventListener('click', () => { photo.rot = (photo.rot + 3) % 4; rotateCrop(false); edSyncControls(); edRebuild(); });
let edAngleRaf = 0;
$('edAngle').addEventListener('input', e => {
  photo.angle = +e.target.value; $('edAngleV').textContent = photo.angle + '°';
  cancelAnimationFrame(edAngleRaf); edAngleRaf = requestAnimationFrame(edRebuild);
});
$('edW').addEventListener('input', e => { photo.sx = e.target.value / 100; edSyncControls(); edPreview(); });
$('edH').addEventListener('input', e => { photo.sy = e.target.value / 100; edSyncControls(); edPreview(); });
$('edFill').addEventListener('click', () => {
  const R = ED.rot, a0 = (photo.crop.w * R.width) / (photo.crop.h * R.height), A = screenAspect();
  let sx = A / a0, sy = 1;
  if (sx > 3) { sy = sx / 3; sx = 3; } else if (sx < 0.25) { sy = 0.25 / sx; sx = 0.25; }
  photo.sx = sx; photo.sy = clamp(sy, 0.25, 3);
  edSyncControls(); edPreview();
});
$('edReset').addEventListener('click', () => {
  const keep = { sens: photo.sens, thick: photo.thick, dots: photo.dots };
  photo = Object.assign(defaultPhoto(photo.src), keep);
  edSyncControls(); edRebuild();
});
$('edCancel').addEventListener('click', () => {
  $('editor').classList.add('hidden');
  if (ED.fromNew && ED.prevPhoto) photo = ED.prevPhoto;
  else Object.assign(photo, ED.snapshot);
});
$('edNext').addEventListener('click', () => {
  photo.edited = makeEdited(photo);
  reviewCap = prepareCapture(photo.edited);
  $('editor').classList.add('hidden');
  openReview();
});
window.addEventListener('resize', () => { if (!$('editor').classList.contains('hidden')) edLayout(); });

/* ---------------------------------------------------------------------
   Wall-detection review
   --------------------------------------------------------------------- */
let reviewCap = null, reviewMask = null, reviewRaf = 0;
function openReview() {
  $('sSens').value = photo.sens; $('sThick').value = photo.thick; $('sDots').value = photo.dots;
  $('review').classList.remove('hidden');
  updateReview();
}
function updateReview() {
  photo.sens = +$('sSens').value; photo.thick = +$('sThick').value; photo.dots = +$('sDots').value;
  $('sSensV').textContent = photo.sens; $('sThickV').textContent = photo.thick; $('sDotsV').textContent = photo.dots;
  reviewMask = computeWalls(reviewCap, photo.sens, photo.thick, photo.dots);
  const rc = $('reviewCanvas');
  rc.width = reviewCap.bg.width; rc.height = reviewCap.bg.height;
  const x = rc.getContext('2d');
  x.drawImage(reviewCap.bg, 0, 0);
  x.globalAlpha = 0.75; x.imageSmoothingEnabled = false;
  x.drawImage(maskCanvas(reviewMask, reviewCap.MW, reviewCap.MH, 255, 50, 50, 255), 0, 0, rc.width, rc.height);
  x.globalAlpha = 1;
}
['sSens', 'sThick', 'sDots'].forEach(id => $(id).addEventListener('input', () => {
  cancelAnimationFrame(reviewRaf); reviewRaf = requestAnimationFrame(updateReview);
}));
$('rvBack').addEventListener('click', () => { $('review').classList.add('hidden'); $('editor').classList.remove('hidden'); edLayout(); });
$('rvRetake').addEventListener('click', () => {
  $('review').classList.add('hidden');
  if (ED.fromNew && ED.prevPhoto) photo = ED.prevPhoto; else if (ED.snapshot) Object.assign(photo, ED.snapshot);
  openCamera();
});
$('rvPlay').addEventListener('click', () => {
  $('review').classList.add('hidden');
  curCap = reviewCap; curMask = reviewMask;
  if (ED.fromNew) { userStrokes = []; rebuildWorld(curCap, curMask, 'creatures'); hint('Have fun! 💧', 1500); }
  else rebuildWorld(curCap, curMask, 'all');
});
$('bEdit').addEventListener('click', () => { if (photo) openEditor(false); });

/* ---------------------------------------------------------------------
   Settings panel
   --------------------------------------------------------------------- */
let setPending = 0, setLayout = false, setWind = false;
function fmt(v, step) { return step < 1 ? (+v).toFixed(step < 0.1 ? 2 : 1) : String(Math.round(v)); }
function buildSettings() {
  const box = $('setList'); box.innerHTML = '';
  for (const s of SETTINGS) {
    if (s.g) { const h = document.createElement('h3'); h.textContent = s.g; box.appendChild(h); continue; }
    const row = document.createElement('div'); row.className = 'srow';
    const lab = document.createElement('label'); lab.textContent = s.l; row.appendChild(lab);
    if (s.toggle) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!CFG[s.k];
      cb.addEventListener('change', () => { CFG[s.k] = cb.checked ? 1 : 0; applyLive(); });
      row.appendChild(cb);
    } else {
      const val = document.createElement('span'); val.textContent = fmt(CFG[s.k], s.step); row.appendChild(val);
      const inp = document.createElement('input'); inp.type = 'range';
      inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = CFG[s.k];
      inp.addEventListener('input', () => {
        CFG[s.k] = +inp.value; val.textContent = fmt(CFG[s.k], s.step);
        if (s.rebuild) setPending = Math.max(setPending, s.rebuild);
        if (s.layout) setLayout = true;
        if (s.wind) setWind = true;
        applyLive();
      });
      row.appendChild(inp);
      if (s.rebuild) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'applied when you press Done'; row.appendChild(n); }
    }
    box.appendChild(row);
  }
  const btns = document.createElement('div'); btns.className = 'setBtns';
  const mk = (t, fn) => { const b = document.createElement('button'); b.className = 'pill'; b.textContent = t; b.addEventListener('click', fn); btns.appendChild(b); };
  mk('↺ Default settings', () => {
    const changedRes = CFG.maskLong !== DEFAULTS.maskLong, changedGrid = CFG.cell !== DEFAULTS.cell || CFG.maxParticles !== DEFAULTS.maxParticles;
    Object.assign(CFG, DEFAULTS);
    setPending = Math.max(setPending, changedRes ? 2 : (changedGrid ? 1 : 0)); setLayout = true; setWind = true;
    applyLive(); buildSettings();
  });
  mk('🧪 Test: 100 000 drops', () => {
    CFG.maxParticles = 100000; CFG.maskLong = 1200; CFG.separateIters = 1;
    setPending = 2; buildSettings(); hint('Press Done, then pour lots of water 💧', 2500);
  });
  mk('🧽 Undo drawn walls & burns', () => { userStrokes = []; rebuildWorld(curCap, curMask, 'all'); hint('Walls restored', 1400); });
  mk('🗑️ Remove pipes, mills, bombs, wind', () => { world.pipes = []; world.sewers = []; world.mills = []; world.bombs = []; world.winds = []; world.rebuildWind(); hint('All tools removed', 1400); });
  mk('🐟 Remove animals', () => { world.creatures = []; });
  box.appendChild(btns);
}
function applyLive() { $('stats').style.display = CFG.showStats ? '' : 'none'; }
$('bSettings').addEventListener('click', () => { setPending = 0; setLayout = false; setWind = false; buildSettings(); $('settings').classList.remove('hidden'); });
$('setClose').addEventListener('click', () => {
  $('settings').classList.add('hidden');
  saveCfg();
  if (setPending === 2) {           // new simulation resolution -> redo wall detection
    curCap = prepareCapture(photo.edited);
    curMask = computeWalls(curCap, photo.sens, photo.thick, photo.dots);
    rebuildWorld(curCap, curMask, 'all');
  } else if (setPending === 1) rebuildWorld(curCap, curMask, 'all');
  else if (setLayout) layout();
  if (setWind && world) world.rebuildWind();
  while (world.creatures.length > CFG.maxCreatures) world.creatures.pop();
  setPending = 0;
});

/* ---------------------------------------------------------------------
   Demo drawing (procedural "pencil on paper" photo)
   --------------------------------------------------------------------- */
function makeDemoPhoto(aspect) {
  const W = 1600, H = Math.round(W / aspect);
  const c = makeCanvas(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W * 0.35, H * 0.3, 50, W * 0.5, H * 0.5, W * 0.85);
  g.addColorStop(0, '#f6f1e7'); g.addColorStop(1, '#a9a092');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pencil = (pts, wdt = 4.2) => {
    for (let pass = 0; pass < 2; pass++) {
      x.beginPath();
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
        const segs = Math.ceil(Math.hypot((bx - ax) * W, (by - ay) * H) / 12);
        for (let s = 0; s <= segs; s++) {
          const t = s / segs, jx = (rnd() - 0.5) * 2.2, jy = (rnd() - 0.5) * 2.2;
          const X = (ax + (bx - ax) * t) * W + jx, Y = (ay + (by - ay) * t) * H + jy;
          if (i === 0 && s === 0) x.moveTo(X, Y); else x.lineTo(X, Y);
        }
      }
      x.strokeStyle = pass ? 'rgba(70,70,80,.55)' : 'rgba(60,60,70,.75)';
      x.lineWidth = wdt * (pass ? 0.6 : 1); x.lineCap = 'round'; x.lineJoin = 'round';
      x.stroke();
    }
  };
  const circle = (cx, cy, r) => {
    const pts = []; for (let a = 0; a <= 24; a++) pts.push([cx + Math.cos(a / 24 * 6.283) * r / aspect, cy + Math.sin(a / 24 * 6.283) * r]);
    pencil(pts);
  };
  pencil([[0.12, 0.13], [0.19, 0.28]]); pencil([[0.31, 0.13], [0.24, 0.28]]);          // funnel
  pencil([[0.10, 0.40], [0.52, 0.52]]);                                               // ramp 1
  pencil([[0.88, 0.50], [0.50, 0.64]]);                                               // ramp 2
  pencil([[0.06, 0.66], [0.06, 0.93], [0.38, 0.93], [0.38, 0.68]]);                   // pond
  pencil([[0.62, 0.12], [0.62, 0.30], [0.80, 0.30]]);                                 // L-tube
  pencil([[0.68, 0.12], [0.68, 0.245], [0.80, 0.245]]);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) circle(0.60 + i * 0.07 + j * 0.035, 0.74 + j * 0.08, 0.022);
  pencil([[0.6, 0.97], [0.96, 0.78]]);                                                // ramp to drain
  return c;
}
function demoScene() {
  const W = world.MW, H = world.MH;
  world.pipes.push({ x: W * 0.215, y: H * 0.08, a: Math.PI / 2, acc: 0, row: 0, type: 0 });
  world.sewers.push({ x: W * 0.9, y: H * 0.88 });
  world.mills.push({ x: W * 0.47, y: H * 0.75, th: 0, om: 0, mul: 1 });
  // pre-filled pond with fish & a duck
  const r = world.r, sp = 2 * r, rowH = Math.sqrt(3) * r;
  let row = 0;
  for (let y = H * 0.75; y < H * 0.92; y += rowH, row++)
    for (let x = W * 0.07 + (row & 1 ? r : 0); x < W * 0.37; x += sp) world.add(x, y, 0, 0, 0);
  world.bombs.push({ x: W * 0.65, y: H * 0.19, kind: 0, lit: false, left: CFG.fuseTime });
  world.bombs.push({ x: W * 0.865, y: H * 0.255, kind: 1, lit: false, left: CFG.fuseTime });
  for (let i = 0; i < 20; i++) world.step(1 / 60, 0, CFG.gravity * world.U);
}

/* ---------------------------------------------------------------------
   Main loop
   --------------------------------------------------------------------- */
let last = performance.now(), acc = 0, fpsT = 0, frames = 0, simMs = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!world) return;
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.1) dt = 0.1;
  const G = CFG.gravity * world.U;
  if (tiltOn) { grav.x += (gravTarget.x * G - grav.x) * 0.25; grav.y += (gravTarget.y * G - grav.y) * 0.25; }
  else { grav.x += (0 - grav.x) * 0.2; grav.y += (G - grav.y) * 0.2; }
  // "up" for fire/embers follows gravity; animals & fuses follow the physical iPad orientation
  const gL = Math.hypot(grav.x, grav.y);
  world.upX = gL > 30 ? -grav.x / gL : 0; world.upY = gL > 30 ? -grav.y / gL : -1;
  const wantUp = tiltOn && gL > 0.3 * G ? Math.atan2(-grav.x, grav.y) : uiRot * Math.PI / 180;
  let dU = wantUp - world.upAng; dU = Math.atan2(Math.sin(dU), Math.cos(dU));
  world.upAng += dU * Math.min(1, dt * 8);
  acc += dt;
  const base = 1 / 60, ts = CFG.timeScale, sub = Math.ceil(ts), sdt = base * ts / sub;
  let ticks = 0;
  const t0 = performance.now();
  while (acc >= base && ticks < 2) {
    for (let k = 0; k < sub; k++) world.step(sdt, grav.x, grav.y);
    acc -= base; ticks++;
  }
  if (acc > base) acc = 0;
  if (ticks) simMs = simMs * 0.9 + 0.1 * (performance.now() - t0) / ticks;
  if (world.charList.length) {           // re-render blackening wood
    const h = world.h, NX = world.NX;
    for (const c of world.charList) { const x = (c % NX) * h, y = ((c / NX) | 0) * h; renderBG(x - 1, y - 1, x + h + 1, y + h + 1); }
    world.charList.length = 0;
  }
  renderer.render(world, t / 1000, dt * CFG.timeScale);
  drawOverlay(t / 1000);
  frames++;
  if (t - fpsT > 500) {
    if (CFG.showStats) $('stats').textContent = `${Math.round(frames * 1000 / (t - fpsT))} fps · sim ${simMs.toFixed(1)} ms · ${world.N} drops · ${world.creatures.length} 🐟`;
    fpsT = t; frames = 0;
  }
}

function init() {
  try { renderer = new Renderer(glc); }
  catch (e) {
    document.body.innerHTML = '<div id="nogl">Sorry, this device needs WebGL2 to run Paper Splash.<br><small>' + e.message + '</small></div>';
    return;
  }
  photo = defaultPhoto(makeDemoPhoto(screenAspect()));
  photo.edited = makeEdited(photo);
  curCap = prepareCapture(photo.edited);
  curMask = computeWalls(curCap, photo.sens, photo.thick, photo.dots);
  const wr = 7 / 800;
  userStrokes = [
    { mode: 'toWood', rN: wr, pts: [0.62, 0.12, 0.62, 0.30, 0.80, 0.30] },
    { mode: 'toWood', rN: wr, pts: [0.68, 0.12, 0.68, 0.245, 0.80, 0.245] },
  ];
  rebuildWorld(curCap, curMask, null);
  demoScene();
  applyLive();
  buildFlyout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  hint('Take a 📷 photo of your drawing, or play with this one!', 4000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeCamera(); last = performance.now(); });
init();
</script>
