<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paper Splash">
<title>Paper Splash</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #1d2230;
    font-family: -apple-system, "SF Pro Rounded", system-ui, sans-serif; color: #fff;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; }
  #stage { position: fixed; left: 0; top: 0; }
  #gl, #ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; }

  /* ---------- toolbar ---------- */
  .glass {
    background: rgba(25, 30, 45, .58); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.3);
  }
  #toolbar { position: fixed; z-index: 10; display: grid; gap: 8px; padding: 9px; }
  @media (orientation: landscape) {
    #toolbar { left: calc(env(safe-area-inset-left) + 10px); top: 50%; transform: translateY(-50%); grid-template-columns: repeat(2, 56px); }
  }
  @media (orientation: portrait) {
    #toolbar { bottom: calc(env(safe-area-inset-bottom) + 10px); left: 50%; transform: translateX(-50%); grid-auto-flow: column; grid-template-rows: repeat(2, 56px); }
  }
  .tb {
    width: 56px; height: 56px; border-radius: 17px; border: none; padding: 0;
    background: rgba(255,255,255,.93); color: #223; font-size: 25px; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: transform .08s, background .15s;
  }
  .tb small { font-size: 8.5px; font-weight: 800; margin-top: 3px; letter-spacing: .2px; text-transform: uppercase; color: #556; }
  .tb svg { width: 27px; height: 27px; }
  .tb:active, .chip:active { transform: scale(.92); }
  .tb.on { background: #ffd23f; box-shadow: 0 3px 0 #b8901a, 0 0 0 3px #fff; }
  .tb.on small { color: #6a4c00; }
  .tb.toggle.on { background: #5be37d; box-shadow: 0 3px 0 #2b9a48, 0 0 0 3px #fff; }
  .tb.toggle.on small { color: #10551f; }

  #flyout { position: fixed; z-index: 10; display: flex; gap: 10px; padding: 9px; }
  #flyout:empty { display: none; }
  @media (orientation: landscape) { #flyout { flex-direction: column; } }
  .fgroup { display: flex; gap: 7px; flex-wrap: wrap; max-width: 300px; }
  .chip {
    min-width: 52px; height: 52px; border-radius: 15px; border: none; padding: 0 6px;
    background: rgba(255,255,255,.9); color: #223; font-size: 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .chip small { font-size: 8.5px; font-weight: 800; text-transform: uppercase; color: #556; margin-top: 2px; }
  .chip.on { background: #7fd3ff; box-shadow: 0 2px 0 #3a8fbd, 0 0 0 2.5px #fff; }
  .dot { border-radius: 50%; background: #334; }

  #hint {
    position: fixed; z-index: 11; top: calc(env(safe-area-inset-top) + 36px); left: 50%;
    transform: translateX(-50%); padding: 10px 20px; border-radius: 22px;
    background: rgba(25,30,45,.82); font-size: 17px; font-weight: 600; pointer-events: none;
    opacity: 0; transition: opacity .35s; white-space: nowrap;
  }
  #hint.show { opacity: 1; }
  #stats {
    position: fixed; z-index: 11; right: calc(env(safe-area-inset-right) + 10px); top: calc(env(safe-area-inset-top) + 8px);
    font: 11px ui-monospace, Menlo, monospace; color: rgba(0,0,0,.5); pointer-events: none;
    background: rgba(255,255,255,.55); padding: 3px 7px; border-radius: 8px;
  }

  /* ---------- full screens ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; background: #000; }
  .hidden { display: none !important; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #camFrame { position: absolute; inset: 18px; border: 3px dashed rgba(255,255,255,.7); border-radius: 18px; pointer-events: none; }
  #camMsg {
    position: absolute; top: calc(env(safe-area-inset-top) + 20px); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); padding: 10px 18px; border-radius: 18px; font-size: 17px; font-weight: 600; text-align: center; max-width: 80%;
  }
  .camBar { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 24px); display: flex; justify-content: center; align-items: center; gap: 40px; }
  #shutter { width: 88px; height: 88px; border-radius: 50%; border: 6px solid #fff; background: #ff5a5a; box-shadow: 0 0 0 4px rgba(0,0,0,.35); }
  #shutter:active { transform: scale(.92); }
  .pill {
    min-width: 56px; height: 52px; border-radius: 26px; border: none; padding: 0 18px;
    background: rgba(255,255,255,.92); color: #223; font-size: 17px; font-weight: 700;
    box-shadow: 0 3px 0 rgba(0,0,0,.3); white-space: nowrap;
  }
  .pill:active { transform: scale(.94); }
  .pill.go { background: #5be37d; color: #0c3d18; font-size: 20px; padding: 0 26px; }
  .pill.big { font-size: 24px; padding: 0 14px; }

  .editScreen { background: #1d2230; display: flex; flex-direction: column; }
  .canvasWrap { flex: 1; min-height: 0; width: 100%; position: relative; }
  .canvasWrap canvas { position: absolute; left: 0; top: 0; }
  #reviewWrap { display: flex; align-items: center; justify-content: center; padding: 14px; padding-top: calc(env(safe-area-inset-top) + 14px); }
  #reviewCanvas { position: static !important; max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .panel {
    width: 100%; display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: center;
    padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px); background: rgba(0,0,0,.28);
  }
  .slider { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: #cfd6ea; }
  .slider input { width: 170px; height: 30px; accent-color: #ffd23f; }
  .slider b { color: #fff; font-weight: 800; }
  .legend { font-size: 13px; color: #cfd6ea; }
  .legend b { color: #ff6b6b; }
  .title { font-size: 15px; font-weight: 800; color: #fff; opacity: .85; }
  #edPreview { width: 120px; height: 80px; border-radius: 6px; background: #000; }

  /* ---------- settings ---------- */
  #settings { background: rgba(10,14,24,.82); display: flex; align-items: center; justify-content: center; }
  #setBox {
    width: min(680px, 94vw); max-height: 88vh; display: flex; flex-direction: column;
    background: #252b3d; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); overflow: hidden;
  }
  #setHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: #2e3550; }
  #setHead h2 { margin: 0; font-size: 20px; }
  #setList { overflow-y: auto; padding: 6px 20px 20px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #setList h3 { margin: 18px 0 6px; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: #ffd23f; }
  .srow { display: grid; grid-template-columns: 1fr 64px; align-items: center; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
  .srow label { font-size: 14px; color: #dfe5f5; }
  .srow span { text-align: right; font: 13px ui-monospace, Menlo, monospace; color: #9fb0d8; }
  .srow input[type=range] { grid-column: 1 / 3; width: 100%; height: 28px; accent-color: #7fd3ff; touch-action: pan-x; }
  .srow input[type=checkbox] { width: 26px; height: 26px; justify-self: end; accent-color: #5be37d; }
  .srow .note { grid-column: 1 / 3; font-size: 11px; color: #8a93ad; }
  .setBtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .setBtns .pill { height: 44px; font-size: 15px; }
  #nogl { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 20px; }
</style>
</head>
<body>

<div id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>

<div id="toolbar" class="glass">
  <button class="tb" id="bPhoto"><span>📷</span><small>Photo</small></button>
  <button class="tb" id="bEdit"><span>🖼️</span><small>Edit</small></button>
  <button class="tb mode on" data-mode="pour"><span>💧</span><small>Pour</small></button>
  <button class="tb mode" data-mode="pipe"><span>🚰</span><small>Pipe</small></button>
  <button class="tb mode" data-mode="sewer"><span>🕳️</span><small>Sewer</small></button>
  <button class="tb mode" data-mode="mill">
    <svg viewBox="-16 -16 32 32"><g stroke="#333" stroke-width="1">
      <path d="M0 0L0-14A8 8 0 0 1 8-7Z" fill="#ff5a5a"/><path d="M0 0L14 0A8 8 0 0 1 7 8Z" fill="#ffd23f"/>
      <path d="M0 0L0 14A8 8 0 0 1-8 7Z" fill="#3fa9ff"/><path d="M0 0L-14 0A8 8 0 0 1-7-8Z" fill="#5be37d"/></g>
      <circle r="2.6" fill="#fff" stroke="#333"/></svg><small>Mill</small></button>
  <button class="tb mode" data-mode="wall"><span>✏️</span><small>Wall</small></button>
  <button class="tb mode" data-mode="wind"><span>🌬️</span><small>Wind</small></button>
  <button class="tb mode" data-mode="fish"><span>🐠</span><small>Fish</small></button>
  <button class="tb mode" data-mode="erase"><span>🧽</span><small>Erase</small></button>
  <button class="tb toggle" id="bTilt"><span>📱</span><small>Tilt</small></button>
  <button class="tb" id="bColor"><span>🎨</span><small>Color</small></button>
  <button class="tb" id="bClear"><span>🧹</span><small>Clear</small></button>
  <button class="tb" id="bSettings"><span>⚙️</span><small>Setup</small></button>
</div>
<div id="flyout" class="glass"></div>
<div id="hint"></div>
<div id="stats"></div>

<!-- camera -->
<div id="camera" class="screen hidden">
  <video id="video" playsinline muted autoplay></video>
  <div id="camFrame"></div>
  <div id="camMsg">Point the camera at your drawing</div>
  <div class="camBar">
    <button class="pill" id="camCancel">✕</button>
    <button id="shutter" aria-label="Take picture"></button>
    <button class="pill" id="camGallery">🖼️</button>
  </div>
</div>

<!-- photo editor: crop / rotate / stretch -->
<div id="editor" class="screen editScreen hidden">
  <div class="canvasWrap" id="edWrap"><canvas id="edCanvas"></canvas></div>
  <div class="panel">
    <button class="pill" id="edCancel">✕</button>
    <span class="title">Drag the corners to crop</span>
    <button class="pill big" id="edRotL">↺</button>
    <button class="pill big" id="edRotR">↻</button>
    <label class="slider">Straighten <b id="edAngleV">0°</b><input type="range" id="edAngle" min="-30" max="30" step="0.5" value="0"></label>
    <label class="slider">Width <b id="edWV">100%</b><input type="range" id="edW" min="25" max="300" value="100"></label>
    <label class="slider">Height <b id="edHV">100%</b><input type="range" id="edH" min="25" max="300" value="100"></label>
    <button class="pill" id="edFill">⤢ Fill screen</button>
    <button class="pill" id="edReset">Reset</button>
    <canvas id="edPreview"></canvas>
    <button class="pill go" id="edNext">Next ›</button>
  </div>
</div>

<!-- wall detection review -->
<div id="review" class="screen editScreen hidden">
  <div class="canvasWrap" id="reviewWrap"><canvas id="reviewCanvas"></canvas></div>
  <div class="panel">
    <button class="pill" id="rvBack">‹ Back</button>
    <button class="pill" id="rvRetake">📷 Retake</button>
    <div class="legend"><b>Red</b> = walls for the water</div>
    <label class="slider">Pencil sensitivity <b id="sSensV"></b><input type="range" id="sSens" min="0" max="100" value="55"></label>
    <label class="slider">Wall thickness <b id="sThickV"></b><input type="range" id="sThick" min="0" max="5" value="1"></label>
    <label class="slider">Ignore small dots <b id="sDotsV"></b><input type="range" id="sDots" min="0" max="300" value="40"></label>
    <button class="pill go" id="rvPlay">✓ Play!</button>
  </div>
</div>

<!-- settings -->
<div id="settings" class="screen hidden">
  <div id="setBox">
    <div id="setHead"><h2>⚙️ Setup</h2><button class="pill go" id="setClose">Done</button></div>
    <div id="setList"></div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">

<script>
'use strict';
/* =====================================================================
   Paper Splash — photograph a pencil drawing, play with particle water.
   - Walls: Sauvola local threshold (integral images), cleanup, dilation
   - Liquids: FLIP on a MAC grid; water / oil / foam particle types
   - Sub-pixel SDF collisions; local SDF + grid updates for drawn walls
   - Wind lines (velocity field), water mills (two-way coupled rotors)
   - Creatures swimming in the flow, rendered under the water surface
   - WebGL2: metaball splats -> refractive water / oil / foam shader
   ===================================================================== */

/* ---------------------------------------------------------------------
   Settings (persisted). Lengths & speeds are in "800-px units": they are
   scaled by world.U so changing the sim resolution keeps the feel.
   --------------------------------------------------------------------- */
const DEFAULTS = {
  maskLong: 800, cell: 5, maxParticles: 20000,
  pressureIters: 32, separateIters: 2, flipRatio: 0.9, driftK: 0.35,
  gravity: 1100, vmax: 1500, timeScale: 1,
  oilLift: 1.8, oilFlip: 0.6, foamLift: 2.6, foamLife: 12,
  brushRadius: 24, pipeSpeed: 280, pipeWidth: 15, sewerRadius: 17, sewerPull: 2200,
  wallS: 2, wallM: 4, wallL: 8,
  windSpeed: 420, windAccel: 3000, windWidth: 20,
  millSize: 34, millFriction: 0.6, millMass: 2500,
  maxCreatures: 40, creatureSize: 28, creatureSwim: 60,
  dprCap: 2, denScale: 1, blobSize: 3.9, showStats: 1,
};
const CFG = Object.assign({}, DEFAULTS);
try {
  const saved = JSON.parse(localStorage.getItem('paperSplash.cfg') || '{}');
  for (const k in saved) if (k in DEFAULTS && typeof saved[k] === 'number') CFG[k] = saved[k];
} catch (e) {}
function saveCfg() { try { localStorage.setItem('paperSplash.cfg', JSON.stringify(CFG)); } catch (e) {} }

const SETTINGS = [
  { g: 'Water simulation' },
  { k: 'maxParticles', l: 'Max drops', min: 2000, max: 40000, step: 1000, rebuild: 1 },
  { k: 'cell', l: 'Grid cell size (px) – smaller is finer but slower', min: 3, max: 8, step: 1, rebuild: 1 },
  { k: 'maskLong', l: 'Simulation resolution (px)', min: 400, max: 1200, step: 50, rebuild: 2 },
  { k: 'pressureIters', l: 'Pressure iterations', min: 5, max: 100, step: 1 },
  { k: 'separateIters', l: 'Drop separation iterations', min: 0, max: 4, step: 1 },
  { k: 'flipRatio', l: 'Splashiness (FLIP ratio)', min: 0.5, max: 0.99, step: 0.01 },
  { k: 'driftK', l: 'Volume keeping', min: 0, max: 1, step: 0.05 },
  { k: 'gravity', l: 'Gravity', min: 100, max: 3000, step: 50 },
  { k: 'vmax', l: 'Max speed', min: 300, max: 3000, step: 50 },
  { k: 'timeScale', l: 'Simulation speed (slow motion < 1)', min: 0.2, max: 2, step: 0.05 },
  { g: 'Oil & foam' },
  { k: 'oilLift', l: 'Oil floats up (buoyancy)', min: 0, max: 4, step: 0.1 },
  { k: 'oilFlip', l: 'Oil runniness', min: 0.2, max: 0.99, step: 0.01 },
  { k: 'foamLift', l: 'Foam floats up', min: 0, max: 5, step: 0.1 },
  { k: 'foamLife', l: 'Foam lifetime (s)', min: 1, max: 60, step: 1 },
  { g: 'Tools' },
  { k: 'brushRadius', l: 'Pour / erase brush size', min: 8, max: 60, step: 1 },
  { k: 'pipeSpeed', l: 'Pipe flow speed', min: 40, max: 900, step: 10 },
  { k: 'pipeWidth', l: 'Pipe width', min: 5, max: 45, step: 1 },
  { k: 'sewerRadius', l: 'Sewer size', min: 6, max: 50, step: 1 },
  { k: 'sewerPull', l: 'Sewer suction', min: 0, max: 8000, step: 100 },
  { k: 'wallS', l: 'Wall pen: small radius', min: 1, max: 12, step: 0.5 },
  { k: 'wallM', l: 'Wall pen: medium radius', min: 1.5, max: 20, step: 0.5 },
  { k: 'wallL', l: 'Wall pen: large radius', min: 2, max: 40, step: 0.5 },
  { k: 'windSpeed', l: 'Wind speed', min: 50, max: 1500, step: 10, wind: 1 },
  { k: 'windAccel', l: 'Wind strength', min: 200, max: 10000, step: 100, wind: 1 },
  { k: 'windWidth', l: 'Wind width', min: 5, max: 60, step: 1, wind: 1 },
  { k: 'millSize', l: 'Mill size', min: 14, max: 80, step: 1 },
  { k: 'millFriction', l: 'Mill friction', min: 0, max: 5, step: 0.05 },
  { k: 'millMass', l: 'Mill heaviness', min: 200, max: 15000, step: 100 },
  { g: 'Creatures' },
  { k: 'maxCreatures', l: 'Max creatures', min: 0, max: 100, step: 1 },
  { k: 'creatureSize', l: 'Creature size', min: 12, max: 70, step: 1 },
  { k: 'creatureSwim', l: 'Swimming speed', min: 0, max: 250, step: 5 },
  { g: 'Display' },
  { k: 'dprCap', l: 'Screen sharpness (pixel ratio)', min: 1, max: 3, step: 0.5, layout: 1 },
  { k: 'denScale', l: 'Liquid render resolution', min: 0.3, max: 1.5, step: 0.05, layout: 1 },
  { k: 'blobSize', l: 'Drop render size (blobbiness)', min: 2.5, max: 6, step: 0.1 },
  { k: 'showStats', l: 'Show FPS', toggle: 1 },
];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const SIZE_MUL = [0.55, 1, 1.8];
const LIQUIDS = [
  { name: 'Water', icon: '💧', color: '#3fa9ff' },
  { name: 'Oil',   icon: '🛢️', color: '#7a4a10' },
  { name: 'Foam',  icon: '🫧', color: '#ffffff' },
];
const SDF_CLAMP = 12;

/* ---------------------------------------------------------------------
   Distance transforms (Felzenszwalb–Huttenlocher, exact Euclidean)
   --------------------------------------------------------------------- */
const EDT_INF = 1e20;
function edt1d(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -EDT_INF; z[1] = EDT_INF;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = EDT_INF;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    const dq = q - v[k];
    d[q] = dq * dq + f[v[k]];
  }
}
// squared distance to the nearest pixel where mask[i] === val
function edtSq(W, H, mask, val) {
  const out = new Float32Array(W * H);
  const n = Math.max(W, H);
  const f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  for (let x = 0; x < W; x++) {
    for (let y = 0; y < H; y++) f[y] = mask[y * W + x] === val ? 0 : EDT_INF;
    edt1d(f, H, d, v, z);
    for (let y = 0; y < H; y++) out[y * W + x] = d[y];
  }
  for (let y = 0; y < H; y++) {
    const row = y * W;
    for (let x = 0; x < W; x++) f[x] = out[row + x];
    edt1d(f, W, d, v, z);
    for (let x = 0; x < W; x++) out[row + x] = d[x];
  }
  return out;
}
// (re)compute clamped signed distance in a region: >0 free, <0 inside wall
function sdfRegion(sdf, wall, MW, MH, x0, y0, x1, y1) {
  const C = SDF_CLAMP;
  x0 = Math.max(0, x0); y0 = Math.max(0, y0); x1 = Math.min(MW, x1); y1 = Math.min(MH, y1);
  if (x1 <= x0 || y1 <= y0) return;
  const rx0 = Math.max(0, x0 - C), ry0 = Math.max(0, y0 - C), rx1 = Math.min(MW, x1 + C), ry1 = Math.min(MH, y1 + C);
  const RW = rx1 - rx0, RH = ry1 - ry0;
  const sub = new Uint8Array(RW * RH);
  for (let y = ry0; y < ry1; y++) {
    const so = (y - ry0) * RW - rx0, wo = y * MW;
    for (let x = rx0; x < rx1; x++) sub[so + x] = wall[wo + x];
  }
  const dOut = edtSq(RW, RH, sub, 1), dIn = edtSq(RW, RH, sub, 0);
  for (let y = y0; y < y1; y++) {
    const so = (y - ry0) * RW - rx0, wo = y * MW;
    for (let x = x0; x < x1; x++) {
      const j = so + x;
      let v = sub[j] ? -(Math.sqrt(dIn[j]) - 0.5) : (Math.sqrt(dOut[j]) - 0.5);
      sdf[wo + x] = v > C ? C : (v < -C ? -C : v);
    }
  }
}
// stamp a capsule (thick line segment) into a mask; returns dirty box [x0,y0,x1,y1)
function paintCapsule(mask, MW, MH, ax, ay, bx, by, rad, val, frame) {
  const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - rad - 1)), x1 = Math.min(MW - 1, Math.ceil(Math.max(ax, bx) + rad + 1));
  const y0 = Math.max(0, Math.floor(Math.min(ay, by) - rad - 1)), y1 = Math.min(MH - 1, Math.ceil(Math.max(ay, by) + rad + 1));
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, r2 = rad * rad;
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      if (frame && (x < frame || y < frame || x >= MW - frame || y >= MH - frame)) continue;
      const px = x + 0.5, py = y + 0.5;
      let t = L2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0;
      t = t < 0 ? 0 : (t > 1 ? 1 : t);
      const qx = ax + dx * t - px, qy = ay + dy * t - py;
      if (qx * qx + qy * qy <= r2) mask[y * MW + x] = val;
    }
  }
  return [x0, y0, x1 + 1, y1 + 1];
}

/* ---------------------------------------------------------------------
   Image pipeline: edited photo -> gray -> Sauvola -> cleanup -> dilate
   --------------------------------------------------------------------- */
function coverCrop(sw, sh, aspect) {
  if (sw / sh > aspect) { const w = sh * aspect; return { x: (sw - w) / 2, y: 0, w, h: sh }; }
  const h = sw / aspect; return { x: 0, y: (sh - h) / 2, w: sw, h };
}
function domainSize(aspect) {
  const L = CFG.maskLong, c = CFG.cell;
  let W, H;
  if (aspect >= 1) { W = L; H = L / aspect; } else { H = L; W = L * aspect; }
  return { W: Math.max(c * 12, Math.round(W / c) * c), H: Math.max(c * 12, Math.round(H / c) * c) };
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }

// src: an already edited canvas; domain shape = its aspect
function prepareCapture(src) {
  const aspect = src.width / src.height;
  const { W: MW, H: MH } = domainSize(aspect);
  const c1 = makeCanvas(MW, MH);
  const x1 = c1.getContext('2d', { willReadFrequently: true });
  x1.imageSmoothingQuality = 'high';
  x1.drawImage(src, 0, 0, MW, MH);
  const px = x1.getImageData(0, 0, MW, MH).data;
  const N = MW * MH;
  const gray = new Float32Array(N);
  for (let i = 0, j = 0; i < N; i++, j += 4) gray[i] = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];

  // integral images (sum, sum of squares)
  const IW = MW + 1;
  const S = new Float64Array(IW * (MH + 1)), S2 = new Float64Array(IW * (MH + 1));
  for (let y = 0; y < MH; y++) {
    let rs = 0, rs2 = 0;
    for (let x = 0; x < MW; x++) {
      const g = gray[y * MW + x]; rs += g; rs2 += g * g;
      const o = (y + 1) * IW + x + 1;
      S[o] = S[o - IW] + rs; S2[o] = S2[o - IW] + rs2;
    }
  }
  const rad = Math.max(8, Math.round(Math.max(MW, MH) / 34));
  const mean = new Float32Array(N), std = new Float32Array(N);
  for (let y = 0; y < MH; y++) {
    const y0 = Math.max(0, y - rad), y1 = Math.min(MH, y + rad + 1);
    for (let x = 0; x < MW; x++) {
      const x0 = Math.max(0, x - rad), x1b = Math.min(MW, x + rad + 1);
      const a = y0 * IW + x0, b = y0 * IW + x1b, c = y1 * IW + x0, d = y1 * IW + x1b;
      const cnt = (x1b - x0) * (y1 - y0);
      const m = (S[d] - S[b] - S[c] + S[a]) / cnt;
      const v = (S2[d] - S2[b] - S2[c] + S2[a]) / cnt - m * m;
      mean[y * MW + x] = m; std[y * MW + x] = Math.sqrt(Math.max(0, v));
    }
  }
  // illumination from paper pixels only (ink excluded) -> no halos around lines
  const P = new Float64Array(IW * (MH + 1)), PC = new Float64Array(IW * (MH + 1));
  for (let y = 0; y < MH; y++) {
    let rs = 0, rc = 0;
    for (let x = 0; x < MW; x++) {
      const i = y * MW + x, g = gray[i];
      if (g > mean[i] - 0.5 * std[i] - 4) { rs += g; rc++; }
      const o = (y + 1) * IW + x + 1;
      P[o] = P[o - IW] + rs; PC[o] = PC[o - IW] + rc;
    }
  }
  const prad = rad * 2, paper = new Float32Array(N);
  for (let y = 0; y < MH; y++) {
    const y0 = Math.max(0, y - prad), y1 = Math.min(MH, y + prad + 1);
    for (let x = 0; x < MW; x++) {
      const x0 = Math.max(0, x - prad), x1b = Math.min(MW, x + prad + 1);
      const a = y0 * IW + x0, b = y0 * IW + x1b, c = y1 * IW + x0, d = y1 * IW + x1b;
      const cnt = PC[d] - PC[b] - PC[c] + PC[a];
      paper[y * MW + x] = cnt > 20 ? (P[d] - P[b] - P[c] + P[a]) / cnt : mean[y * MW + x];
    }
  }
  // high-res background with flattened illumination ("scanned paper" look)
  const long = Math.min(2048, Math.max(src.width, src.height));
  const BW = Math.round(aspect >= 1 ? long : long * aspect), BH = Math.round(aspect >= 1 ? long / aspect : long);
  const bg = makeCanvas(BW, BH);
  const bx = bg.getContext('2d', { willReadFrequently: true });
  bx.imageSmoothingQuality = 'high';
  bx.drawImage(src, 0, 0, BW, BH);
  const bimg = bx.getImageData(0, 0, BW, BH), bd = bimg.data;
  const sx = MW / BW, sy = MH / BH;
  for (let y = 0; y < BH; y++) {
    const fy = clamp((y + 0.5) * sy - 0.5, 0, MH - 1.001), iy = fy | 0, ty = fy - iy;
    for (let x = 0; x < BW; x++) {
      const fx = clamp((x + 0.5) * sx - 0.5, 0, MW - 1.001), ix = fx | 0, tx = fx - ix;
      const o = iy * MW + ix;
      const m = (paper[o] * (1 - tx) + paper[o + 1] * tx) * (1 - ty) + (paper[o + MW] * (1 - tx) + paper[o + MW + 1] * tx) * ty;
      const f = 246 / Math.max(m, 25);
      const j = (y * BW + x) * 4;
      for (let k = 0; k < 3; k++) {
        let c = bd[j + k] * f;
        c = 255 - (255 - c) * 1.25;
        bd[j + k] = c < 0 ? 0 : (c > 255 ? 255 : c);
      }
    }
  }
  bx.putImageData(bimg, 0, 0);
  return { MW, MH, gray, mean, std, bg };
}

function computeWalls(cap, sens, thick, dots) {
  const { MW, MH, gray, mean, std } = cap, N = MW * MH;
  const k = 0.42 - (sens / 100) * 0.38;        // Sauvola k: lower = more sensitive
  const R = 128, minDiff = 14 - sens * 0.1;
  let m = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const mu = mean[i];
    const T = mu * (1 + k * (std[i] / R - 1));
    m[i] = (gray[i] < T && gray[i] < mu - minDiff) ? 1 : 0;
  }
  if (dots > 0) {   // remove small specks (8-connected components)
    const lab = new Int32Array(N), stack = new Int32Array(N), members = new Int32Array(N);
    let id = 0;
    for (let s = 0; s < N; s++) {
      if (!m[s] || lab[s]) continue;
      id++; let sp = 0, cnt = 0; stack[sp++] = s; lab[s] = id;
      while (sp) {
        const p = stack[--sp]; members[cnt++] = p;
        const x = p % MW, y = (p / MW) | 0;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = y + dy; if (yy < 0 || yy >= MH) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx; if (xx < 0 || xx >= MW) continue;
            const q = yy * MW + xx;
            if (m[q] && !lab[q]) { lab[q] = id; stack[sp++] = q; }
          }
        }
      }
      if (cnt < dots) for (let i = 0; i < cnt; i++) m[members[i]] = 0;
    }
  }
  if (thick > 0) {  // circular dilation via distance transform
    const d = edtSq(MW, MH, m, 1);
    const t2 = (thick + 0.5) * (thick + 0.5);
    const out = new Uint8Array(N);
    for (let i = 0; i < N; i++) out[i] = d[i] <= t2 ? 1 : 0;
    m = out;
  }
  return m;
}

function maskCanvas(mask, W, H, r, g, b, a) {
  const c = makeCanvas(W, H);
  const x = c.getContext('2d'); const img = x.createImageData(W, H), d = img.data;
  for (let i = 0, j = 0; i < W * H; i++, j += 4) if (mask[i]) { d[j] = r; d[j + 1] = g; d[j + 2] = b; d[j + 3] = a; }
  x.putImageData(img, 0, 0); return c;
}

/* ---------------------------------------------------------------------
   FLIP world
   --------------------------------------------------------------------- */
const FLUID = 0, AIR = 1, SOLID = 2;

class World {
  constructor(MW, MH, wallIn) {
    const h = CFG.cell;
    this.MW = MW; this.MH = MH; this.h = h; this.inv = 1 / h; this.r = 0.3 * h;
    this.U = Math.max(MW, MH) / 800;
    this.frame = h;
    const wall = this.wall = new Uint8Array(wallIn);
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++)
      if (x < h || y < h || x >= MW - h || y >= MH - h) wall[y * MW + x] = 1;
    this.sdf = new Float32Array(MW * MH);
    sdfRegion(this.sdf, wall, MW, MH, 0, 0, MW, MH);

    const NX = this.NX = Math.ceil(MW / h), NY = this.NY = Math.ceil(MH / h), n = NX * NY;
    const F = () => new Float32Array(n);
    this.u = F(); this.v = F(); this.du = F(); this.dv = F(); this.prevU = F(); this.prevV = F();
    this.s = F(); this.density = F(); this.denW = F(); this.denO = F();
    this.windX = F(); this.windY = F();
    this.solid = new Uint8Array(n); this.type = new Uint8Array(n);
    this.validU = new Uint8Array(n); this.validV = new Uint8Array(n);
    this.fixU = new Uint8Array(n); this.fixV = new Uint8Array(n);
    this.fluidList = new Int32Array(n);
    this.restDensity = (h * h) / (2 * Math.sqrt(3) * this.r * this.r);
    this.updateSolidRegion(0, 0, NX - 1, NY - 1);

    const P = this.maxP = CFG.maxParticles;
    this.N = 0;
    this.px = new Float32Array(P); this.py = new Float32Array(P);
    this.vx = new Float32Array(P); this.vy = new Float32Array(P);
    this.pt = new Uint8Array(P); this.pl = new Float32Array(P);
    this.tpx = new Float32Array(P); this.tpy = new Float32Array(P);
    this.tvx = new Float32Array(P); this.tvy = new Float32Array(P);
    this.tpt = new Uint8Array(P); this.tpl = new Float32Array(P);
    this.kill = new Int32Array(P);
    this.pSpacing = 2.2 * this.r; this.pInv = 1 / this.pSpacing;
    this.pNX = Math.ceil(MW * this.pInv) + 1; this.pNY = Math.ceil(MH * this.pInv) + 1;
    this.cellStart = new Int32Array(this.pNX * this.pNY + 1);
    this.cellEntries = new Int32Array(P);

    this.pipes = []; this.sewers = []; this.mills = []; this.winds = []; this.creatures = [];
    this.brushes = [];
    this.stepCount = 0; this.oilCount = 0;
  }

  /* ---- walls ---- */
  updateSolidRegion(cx0, cy0, cx1, cy1) {
    const { NX, NY, h, MW, MH, wall, solid, s, fixU, fixV } = this;
    cx0 = Math.max(0, cx0); cy0 = Math.max(0, cy0); cx1 = Math.min(NX - 1, cx1); cy1 = Math.min(NY - 1, cy1);
    const thr = 0.2 * h * h;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const c = cy * NX + cx;
      let sol = cx === 0 || cy === 0 || cx === NX - 1 || cy === NY - 1;
      if (!sol) {
        let cnt = 0;
        for (let y = cy * h; y < (cy + 1) * h; y++) for (let x = cx * h; x < (cx + 1) * h; x++)
          cnt += (x >= MW || y >= MH) ? 1 : wall[y * MW + x];
        sol = cnt >= thr;
      }
      solid[c] = sol ? 1 : 0; s[c] = sol ? 0 : 1;
    }
    for (let cy = cy0; cy <= Math.min(NY - 1, cy1 + 1); cy++) for (let cx = cx0; cx <= Math.min(NX - 1, cx1 + 1); cx++) {
      const c = cy * NX + cx;
      fixU[c] = (cx === 0 || solid[c] || solid[c - 1]) ? 1 : 0;
      fixV[c] = (cy === 0 || solid[c] || solid[c - NX]) ? 1 : 0;
    }
  }
  paintWall(ax, ay, bx, by, rad, val) {
    return paintCapsule(this.wall, this.MW, this.MH, ax, ay, bx, by, rad, val, this.frame);
  }
  refreshWalls(box) {
    const [x0, y0, x1, y1] = box, C = SDF_CLAMP, h = this.h;
    sdfRegion(this.sdf, this.wall, this.MW, this.MH, x0 - C, y0 - C, x1 + C, y1 + C);
    this.updateSolidRegion(Math.floor(x0 / h), Math.floor(y0 / h), Math.floor((x1 - 1) / h), Math.floor((y1 - 1) / h));
    // drop liquid buried deep inside a freshly drawn wall
    for (let i = this.N - 1; i >= 0; i--) {
      const x = this.px[i], y = this.py[i];
      if (x < x0 - 2 || x > x1 + 2 || y < y0 - 2 || y > y1 + 2) continue;
      if (this.sdfAt(x, y) < -1.5) this.removeAt(i);
    }
  }

  sdfAt(x, y) {
    const MW = this.MW, MH = this.MH;
    const fx = clamp(x - 0.5, 0, MW - 1.001), fy = clamp(y - 0.5, 0, MH - 1.001);
    const ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, o = iy * MW + ix, s = this.sdf;

  sdfGrad(x, y) {
    const MW = this.MW, ix = clamp(x | 0, 1, MW - 2), iy = clamp(y | 0, 1, this.MH - 2), o = iy * MW + ix, s = this.sdf;
    const gx = s[o + 1] - s[o - 1], gy = s[o + MW] - s[o - MW], l = Math.hypot(gx, gy);

  }
  densityAt(x, y) { return this.density[this.cellOf(x, y)]; }
  gridVel(x, y) {
    const c = this.cellOf(x, y);

  /* ---- particles ---- */
  add(x, y, vx, vy, t) {
    if (this.N >= this.maxP) return false;
    if (this.sdfAt(x, y) < this.r) return false;
    const i = this.N++;
    this.px[i] = x; this.py[i] = y; this.vx[i] = vx; this.vy[i] = vy;
    this.pt[i] = t; this.pl[i] = t === 2 ? CFG.foamLife * (0.7 + 0.6 * Math.random()) : 0;

  removeAt(i) {

  clearLiquids() { this.N = 0; this.density.fill(0); this.denW.fill(0); this.denO.fill(0); }

  /* ---- wind field (velocity targets on the grid) ---- */
  rebuildWind() {
    const { NX, NY, h, windX, windY } = this;
    windX.fill(0); windY.fill(0);
    for (const w of this.winds) {
      const W = CFG.windWidth * this.U * w.mul, pts = w.pts;
      for (let k = 0; k + 3 < pts.length; k += 2) {
        const ax = pts[k], ay = pts[k + 1], bx = pts[k + 2], by = pts[k + 3];
        const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy; if (L2 < 1e-6) continue;
        const L = Math.sqrt(L2), ux = dx / L, uy = dy / L;
        const cx0 = Math.max(1, Math.floor((Math.min(ax, bx) - W) / h)), cx1 = Math.min(NX - 2, Math.ceil((Math.max(ax, bx) + W) / h));
        const cy0 = Math.max(1, Math.floor((Math.min(ay, by) - W) / h)), cy1 = Math.min(NY - 2, Math.ceil((Math.max(ay, by) + W) / h));
        for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {

          const qx = ax + dx * t - px, qy = ay + dy * t - py, d = Math.sqrt(qx * qx + qy * qy);

  }

  /* ---- sources ---- */
  emit(dt) {
    const r = this.r, sp = 2 * r, rowH = Math.sqrt(3) * r, U = this.U;
    const speed = CFG.pipeSpeed * U;
    for (const p of this.pipes) {
      const dx = Math.cos(p.a), dy = Math.sin(p.a), nx = -dy, ny = dx;
      p.acc += speed * dt / rowH;
      let guard = 0;
      while (p.acc >= 1 && guard++ < 8) {
        p.acc -= 1; p.row ^= 1;
        const off = p.acc * rowH + 2;
        const half = CFG.pipeWidth * U / 2 - r;
        for (let t = -half + (p.row ? r : 0); t <= half; t += sp) {
          const j = (Math.random() - 0.5) * 0.2;
          this.add(p.x + dx * off + nx * (t + j), p.y + dy * off + ny * (t + j), dx * speed, dy * speed, p.type);
        }
      }
      if (p.acc >= 1) p.acc = 0;
    }
    for (const b of this.brushes) {
      const R = b.R, R2 = R * R;
      if (b.erase) {

          const dx = this.px[i] - b.x, dy = this.py[i] - b.y;

        }

      }
      const ox = Math.random() * sp, oy = Math.random() * rowH, lim = this.restDensity * 0.55;
      let row = 0;
      for (let y = b.y - R + oy; y < b.y + R; y += rowH, row++) {
        for (let x = b.x - R + ox + (row & 1 ? r : 0); x < b.x + R; x += sp) {

          if (this.densityAt(x, y) > lim) continue;
          this.add(x, y, b.vx, b.vy, b.type);
        }
      }
    }
  }

  /* ---- integrate: gravity, buoyancy, wind, foam aging, anti-tunneling ---- */
  integrate(dt, gx, gy) {
    const { px, py, vx, vy, pt, pl, sdf, MW, NX, NY, inv, denW, denO, windX, windY } = this, N = this.N;
    const vmax = CFG.vmax * this.U, vmax2 = vmax * vmax, thr = this.r * 0.5;
    const irest = 1 / this.restDensity, oilLift = CFG.oilLift, foamLift = CFG.foamLift;
    const wSpeed = CFG.windSpeed * this.U, wAcc = CFG.windAccel * this.U * dt;
    const hasWind = this.winds.length > 0, hasOil = this.oilCount > 0, fdamp = Math.max(0, 1 - 1.5 * dt);
    // slip (drift-flux) velocity: lighter liquids move up relative to the mixture
    const gl = Math.sqrt(gx * gx + gy * gy), ux0 = gl > 1 ? -gx / gl : 0, uy0 = gl > 1 ? -gy / gl : 0;
    const oilSlip = CFG.oilLift * 60 * this.U * dt * (gl / (CFG.gravity * this.U) || 0);
    const foamSlip = CFG.foamLift * 45 * this.U * dt * (gl / (CFG.gravity * this.U) || 0);
    for (let i = 0; i < N; i++) {
      let x = px[i], y = py[i], ux = vx[i], uy = vy[i];
      const t = pt[i];
      let ax = gx, ay = gy;
      if (t !== 0 || hasWind || hasOil) {
        let cx = (x * inv) | 0, cy = (y * inv) | 0;
        if (cx < 0) cx = 0; else if (cx >= NX) cx = NX - 1;
        if (cy < 0) cy = 0; else if (cy >= NY) cy = NY - 1;
        const c = cy * NX + cx;
        if (t === 0) {                       // water sinks where oil is mixed in (counter-flow)
          if (hasOil) { let f = denO[c] * irest; if (f > 1) f = 1; x -= ux0 * oilSlip * f; y -= uy0 * oilSlip * f; }
        } else if (t === 1) {                // oil rises through water
          let f = denW[c] * irest; if (f > 1) f = 1;
          const k = 1 - f * oilLift; ax = gx * k; ay = gy * k;
          x += ux0 * oilSlip * f; y += uy0 * oilSlip * f;
        } else if (t === 2) {                // foam rises through any liquid, dies over time
          let f = (denW[c] + denO[c]) * irest; if (f > 1) f = 1;
          const k = f < 0.15 ? 0.45 : 1 - f * foamLift; ax = gx * k; ay = gy * k;

            const vt = ux * dx + uy * dy, target = wSpeed * f;
            if (vt < target) { const inc = Math.min(wAcc * f, target - vt); ux += dx * inc; uy += dy * inc; }

      const len = (dx < 0 ? -dx : dx) + (dy < 0 ? -dy : dy);
      if (len > 1.2) {
        const steps = Math.ceil(len), sx = dx / steps, sy = dy / steps;
        for (let k = 0; k < steps; k++) {
          const nx = x + sx, ny = y + sy;
          if (sdf[(ny | 0) * MW + (nx | 0)] < thr) break;
          x = nx; y = ny;
        }
      } else { x += dx; y += dy; }
      px[i] = x; py[i] = y;
    }
  }

  /* ---- push particles out of the walls (SDF) ---- */
  collide() {
    const { px, py, vx, vy, sdf, MW, MH, kill } = this, N = this.N, r = this.r;
    const xmax = MW - 2, ymax = MH - 2;
    let nk = 0;
    for (let i = 0; i < N; i++) {
      let x = px[i], y = py[i];
      if (x < 1) x = 1; else if (x > xmax) x = xmax;
      if (y < 1) y = 1; else if (y > ymax) y = ymax;
      const fx = x - 0.5, fy = y - 0.5;
      const ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy, o = iy * MW + ix;
      const s00 = sdf[o], s10 = sdf[o + 1], s01 = sdf[o + MW], s11 = sdf[o + MW + 1];
      const d = (s00 * (1 - tx) + s10 * tx) * (1 - ty) + (s01 * (1 - tx) + s11 * tx) * ty;
      if (d < r) {
        let gx = (s10 - s00) * (1 - ty) + (s11 - s01) * ty;
        let gy = (s01 - s00) * (1 - tx) + (s11 - s10) * tx;
        const gl = Math.sqrt(gx * gx + gy * gy);
        if (gl > 1e-5) {
          gx /= gl; gy /= gl;
          const push = r - d;
          x += gx * push; y += gy * push;
          const vn = vx[i] * gx + vy[i] * gy;
          if (vn < 0) { vx[i] -= vn * gx; vy[i] -= vn * gy; }
        } else if (d < -1) kill[nk++] = i;   // stuck deep inside a thick wall
      }
      px[i] = x; py[i] = y;
    }
    for (let k = nk - 1; k >= 0; k--) this.removeAt(kill[k]);
  }

  /* ---- particle separation: half-stencil sweep over a counting-sorted hash ---- */
  separate() {
    const N = this.N; if (!N) return;
    const { pNX, pNY, pInv, cellStart, cellEntries } = this;
    let { px, py } = this;
    const nc = pNX * pNY;
    cellStart.fill(0);
    for (let i = 0; i < N; i++) {
      const xi = clamp((px[i] * pInv) | 0, 0, pNX - 1), yi = clamp((py[i] * pInv) | 0, 0, pNY - 1);
      cellStart[yi * pNX + xi]++;
    }
    let first = 0;
    for (let c = 0; c < nc; c++) { first += cellStart[c]; cellStart[c] = first; }
    cellStart[nc] = first;
    for (let i = 0; i < N; i++) {
      const xi = clamp((px[i] * pInv) | 0, 0, pNX - 1), yi = clamp((py[i] * pInv) | 0, 0, pNY - 1);
      cellEntries[--cellStart[yi * pNX + xi]] = i;
    }
    if ((this.stepCount & 31) === 0) {     // reorder in memory by cell for cache locality
      const { tpx, tpy, tvx, tvy, tpt, tpl, vx, vy, pt, pl } = this;
      for (let k = 0; k < N; k++) {
        const j = cellEntries[k];
        tpx[k] = px[j]; tpy[k] = py[j]; tvx[k] = vx[j]; tvy[k] = vy[j]; tpt[k] = pt[j]; tpl[k] = pl[j];
        cellEntries[k] = k;
      }
      this.tpx = px; this.tpy = py; this.tvx = vx; this.tvy = vy; this.tpt = pt; this.tpl = pl;
      this.px = px = tpx; this.py = py = tpy; this.vx = tvx; this.vy = tvy; this.pt = tpt; this.pl = tpl;
    }
    const minDist = 2 * this.r, minDist2 = minDist * minDist;
    for (let it = 0; it < CFG.separateIters; it++) {
      for (let cy = 0; cy < pNY; cy++) {
        for (let cx = 0; cx < pNX; cx++) {
          const c = cy * pNX + cx, cs = cellStart[c], ce = cellStart[c + 1];
          if (cs === ce) continue;
          const hasR = cx < pNX - 1, hasD = cy < pNY - 1, hasL = cx > 0;
          for (let k = cs; k < ce; k++) {
            const i = cellEntries[k];
            let xi = px[i], yi = py[i];
            for (let nb = 0; nb < 5; nb++) {
              let a, e;
              if (nb === 0) { a = k + 1; e = ce; }
              else if (nb === 1) { if (!hasR) continue; a = cellStart[c + 1]; e = cellStart[c + 2]; }
              else {
                if (!hasD) break;

                const j = cellEntries[q];

                const d2 = dx * dx + dy * dy;
                if (d2 > minDist2 || d2 === 0) continue;
                const d = Math.sqrt(d2), s = 0.5 * (minDist - d) / d;

          }
        }
      }

  }

  /* ---- water mills: blades push liquid, liquid spins the rotor ---- */
  stepMills(dt) {
    if (!this.mills.length) return;
    const { px, py, vx, vy } = this, N = this.N, r = this.r, U = this.U;
    for (const m of this.mills) {
      const R = CFG.millSize * U * m.mul, hub = R * 0.18;
      const bt0 = Math.max(1.4, 1.2 * U), bt1 = R * 0.16;
      const reach = R + bt1 + r, reach2 = reach * reach, hubR2 = (hub + r) * (hub + r);
      const cs = [], sn = [];
      for (let k = 0; k < 4; k++) { cs.push(Math.cos(m.th + k * Math.PI / 2)); sn.push(Math.sin(m.th + k * Math.PI / 2)); }
      const w = m.om, mx = m.x, my = m.y;
      let L = 0;
      for (let i = 0; i < N; i++) {
        let rx = px[i] - mx; if (rx > reach || rx < -reach) continue;
        let ry = py[i] - my; if (ry > reach || ry < -reach) continue;
        const d2 = rx * rx + ry * ry; if (d2 > reach2) continue;
        if (d2 < hubR2 && d2 > 1e-6) {           // hub
          const d = Math.sqrt(d2), nx = rx / d, ny = ry / d, pen = hub + r - d;
          rx += nx * pen; ry += ny * pen;
          const vn = (vx[i] + w * ry) * nx + (vy[i] - w * rx) * ny;
          if (vn < 0) { vx[i] -= vn * nx; vy[i] -= vn * ny; }
        }
        for (let k = 0; k < 4; k++) {
          const bx = cs[k], by = sn[k];
          const along = rx * bx + ry * by;
          if (along < 0 || along > R) continue;
          const perp = bx * ry - by * rx, ap = perp < 0 ? -perp : perp;
          const bt = bt0 + (bt1 - bt0) * (along / R);
          if (ap >= bt + r) continue;
          const sg = perp < 0 ? -1 : 1, nx = -by * sg, ny = bx * sg, pen = bt + r - ap;
          rx += nx * pen; ry += ny * pen;
          const vbx = -w * ry, vby = w * rx;
          const vrn = (vx[i] - vbx) * nx + (vy[i] - vby) * ny;
          if (vrn < 0) {
            const dvx = -vrn * nx, dvy = -vrn * ny;
            vx[i] += dvx; vy[i] += dvy;
            L -= rx * dvy - ry * dvx;
          }
        }
        px[i] = mx + rx; py[i] = my + ry;
      }
      m.om += L / (CFG.millMass * R * R);
      m.om *= Math.exp(-CFG.millFriction * dt);
      m.om = clamp(m.om, -30, 30);
      m.th += m.om * dt;
    }
  }

  /* ---- sinks: sewers + dissolving foam ---- */
  drain(dt) {
    const { px, py, vx, vy, pt, pl } = this;
    if (this.sewers.length) {
      const U = this.U, R = CFG.sewerRadius * U, R2 = R * R, P2 = 9 * R2, pull = CFG.sewerPull * U * dt;
      for (const s of this.sewers) {
        for (let i = this.N - 1; i >= 0; i--) {
          const dx = s.x - px[i], dy = s.y - py[i], d2 = dx * dx + dy * dy;
          if (d2 < R2) { this.removeAt(i); continue; }
          if (d2 < P2) { const k = pull / Math.sqrt(d2); vx[i] += dx * k; vy[i] += dy * k; }
        }
      }
    }
    for (let i = this.N - 1; i >= 0; i--) if (pt[i] === 2 && pl[i] <= 0) this.removeAt(i);
  }

  /* ---- particles -> grid ---- */
  p2g() {
    const { NX, NY, h, inv, u, v, du, dv, type, solid, fixU, fixV, validU, validV, px, py, vx, vy } = this;
    const N = this.N, n = NX * NY, h2 = h * 0.5;
    u.fill(0); v.fill(0); du.fill(0); dv.fill(0);
    for (let c = 0; c < n; c++) type[c] = solid[c] ? SOLID : AIR;
    for (let i = 0; i < N; i++) {
      const xi = clamp((px[i] * inv) | 0, 0, NX - 1), yi = clamp((py[i] * inv) | 0, 0, NY - 1);
      const c = yi * NX + xi;
      if (type[c] === AIR) type[c] = FLUID;
    }
    const lo = h, hx = (NX - 1) * h, hy = (NY - 1) * h;
    for (let i = 0; i < N; i++) {
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      let fx = x * inv, fy = (y - h2) * inv;
      let x0 = Math.min(fx | 0, NX - 2), y0 = Math.min(fy | 0, NY - 2);
      let tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      let c = y0 * NX + x0, w;
      const pu = vx[i];
      w = sx * sy; u[c] += pu * w; du[c] += w;
      w = tx * sy; u[c + 1] += pu * w; du[c + 1] += w;
      w = sx * ty; u[c + NX] += pu * w; du[c + NX] += w;
      w = tx * ty; u[c + NX + 1] += pu * w; du[c + NX + 1] += w;
      fx = (x - h2) * inv; fy = y * inv;
      x0 = Math.min(fx | 0, NX - 2); y0 = Math.min(fy | 0, NY - 2);
      tx = fx - x0; ty = fy - y0; sx = 1 - tx; sy = 1 - ty;
      c = y0 * NX + x0;
      const pv = vy[i];
      w = sx * sy; v[c] += pv * w; dv[c] += w;
      w = tx * sy; v[c + 1] += pv * w; dv[c + 1] += w;
      w = sx * ty; v[c + NX] += pv * w; dv[c + NX] += w;
      w = tx * ty; v[c + NX + 1] += pv * w; dv[c + NX + 1] += w;
    }
    for (let c = 0; c < n; c++) {
      u[c] = (fixU[c] || du[c] === 0) ? 0 : u[c] / du[c];
      v[c] = (fixV[c] || dv[c] === 0) ? 0 : v[c] / dv[c];
      const x = c % NX;
      validU[c] = (type[c] === FLUID || (x > 0 && type[c - 1] === FLUID)) ? 1 : 0;
      validV[c] = (type[c] === FLUID || (c >= NX && type[c - NX] === FLUID)) ? 1 : 0;
    }
  }

  computeDensity() {
    const { NX, h, inv, density, denW, denO, px, py, pt } = this, N = this.N, h2 = h * 0.5;
    let oil = 0;
    density.fill(0); denW.fill(0); denO.fill(0);
    const lo = h, hx = (NX - 1) * h, hy = (this.NY - 1) * h;
    for (let i = 0; i < N; i++) {
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      const fx = (x - h2) * inv, fy = (y - h2) * inv;
      const x0 = fx | 0, y0 = fy | 0, tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      const c = y0 * NX + x0;
      const w0 = sx * sy, w1 = tx * sy, w2 = sx * ty, w3 = tx * ty;
      density[c] += w0; density[c + 1] += w1; density[c + NX] += w2; density[c + NX + 1] += w3;
      const t = pt[i];
      const d = t === 0 ? denW : (t === 1 ? denO : null);
      if (d) { d[c] += w0; d[c + 1] += w1; d[c + NX] += w2; d[c + NX + 1] += w3; }
      if (t === 1) oil++;
    }
    this.oilCount = oil;
  }

  /* ---- pressure projection (Gauss-Seidel + SOR, drift compensation) ---- */
  project(dt) {
    const { NX, type, s, u, v, density, fluidList } = this, n = NX * this.NY;
    let nf = 0;
    for (let c = 0; c < n; c++) if (type[c] === FLUID) fluidList[nf++] = c;
    this.prevU.set(u); this.prevV.set(v);
    const rest = this.restDensity, kd = CFG.driftK * this.h / dt, omega = 1.9;
    const iters = CFG.pressureIters;
    for (let it = 0; it < iters; it++) {
      for (let f = 0; f < nf; f++) {
        const c = fluidList[f];
        const sx0 = s[c - 1], sx1 = s[c + 1], sy0 = s[c - NX], sy1 = s[c + NX];
        const ss = sx0 + sx1 + sy0 + sy1;
        if (ss === 0) continue;
        let div = u[c + 1] - u[c] + v[c + NX] - v[c];
        const comp = density[c] - rest;
        if (comp > 0) div -= kd * comp;
        const p = -div / ss * omega;
        u[c] -= sx0 * p; u[c + 1] += sx1 * p;
        v[c] -= sy0 * p; v[c + NX] += sy1 * p;
      }
    }
  }

  /* ---- grid -> particles (PIC/FLIP blend per liquid type) ---- */
  g2p() {
    const { NX, NY, h, inv, u, v, prevU, prevV, validU, validV, px, py, vx, vy, pt } = this;
    const N = this.N, h2 = h * 0.5;
    const FL = [CFG.flipRatio, CFG.oilFlip, 0.4];
    const lo = h, hx = (NX - 1) * h, hy = (NY - 1) * h;
    for (let i = 0; i < N; i++) {
      const flip = FL[pt[i]], pic = 1 - flip;
      const x = clamp(px[i], lo, hx), y = clamp(py[i], lo, hy);
      let fx = x * inv, fy = (y - h2) * inv;
      let x0 = Math.min(fx | 0, NX - 2), y0 = Math.min(fy | 0, NY - 2);
      let tx = fx - x0, ty = fy - y0, sx = 1 - tx, sy = 1 - ty;
      let c0 = y0 * NX + x0, c1 = c0 + 1, c2 = c0 + NX, c3 = c2 + 1;
      let w0 = validU[c0] * sx * sy, w1 = validU[c1] * tx * sy, w2 = validU[c2] * sx * ty, w3 = validU[c3] * tx * ty;
      let d = w0 + w1 + w2 + w3;
      if (d > 0) {
        const picV = (w0 * u[c0] + w1 * u[c1] + w2 * u[c2] + w3 * u[c3]) / d;
        const corr = (w0 * (u[c0] - prevU[c0]) + w1 * (u[c1] - prevU[c1]) + w2 * (u[c2] - prevU[c2]) + w3 * (u[c3] - prevU[c3])) / d;
        vx[i] = pic * picV + flip * (vx[i] + corr);
      }
      fx = (x - h2) * inv; fy = y * inv;
      x0 = Math.min(fx | 0, NX - 2); y0 = Math.min(fy | 0, NY - 2);
      tx = fx - x0; ty = fy - y0; sx = 1 - tx; sy = 1 - ty;
      c0 = y0 * NX + x0; c1 = c0 + 1; c2 = c0 + NX; c3 = c2 + 1;
      w0 = validV[c0] * sx * sy; w1 = validV[c1] * tx * sy; w2 = validV[c2] * sx * ty; w3 = validV[c3] * tx * ty;
      d = w0 + w1 + w2 + w3;
      if (d > 0) {
        const picV = (w0 * v[c0] + w1 * v[c1] + w2 * v[c2] + w3 * v[c3]) / d;
        const corr = (w0 * (v[c0] - prevV[c0]) + w1 * (v[c1] - prevV[c1]) + w2 * (v[c2] - prevV[c2]) + w3 * (v[c3] - prevV[c3])) / d;
        vy[i] = pic * picV + flip * (vy[i] + corr);
      }
    }
  }

  /* ---- creatures ---- */
  creatureSize(c) { return CFG.creatureSize * this.U * CREATURES[c.kind].scale * c.mul; }
  spawnCreature(x, y, kind) {
    if (this.creatures.length >= CFG.maxCreatures) return false;
    if (kind === -1) kind = (Math.random() * CREATURES.length) | 0;
    else if (kind === -2) kind = (Math.random() * 3) | 0;
    const c = { kind, x, y, vx: 0, vy: 0, heading: Math.random() < 0.5 ? 0 : Math.PI, turn: 0,
      phase: Math.random() * 6, mul: 0.85 + Math.random() * 0.3, wet: 0, angle: 0, tilt: 0, face: 1 };
    if (this.sdfAt(x, y) < this.creatureSize(c) * 0.3) return false;
    c.angle = c.heading;
    this.creatures.push(c);
    return true;
  }
  updateCreatures(dt, gx, gy) {
    if (!this.creatures.length) return;
    const gl = Math.hypot(gx, gy), upx = gl > 1 ? -gx / gl : 0, upy = gl > 1 ? -gy / gl : -1;
    const rest = this.restDensity, MW = this.MW, MH = this.MH, f = this.frame;
    for (const c of this.creatures) {
      const T = CREATURES[c.kind], size = this.creatureSize(c), rad = size * 0.3;
      const den = this.densityAt(c.x, c.y);
      c.wet += ((den > rest * 0.35 ? 1 : 0) - c.wet) * Math.min(1, dt * 6);
      const wv = this.gridVel(c.x, c.y);
      if (T.duck) {
        const sub = Math.min(1.3, den / rest), k = 1 - 2.2 * sub;
        c.vx += gx * k * dt; c.vy += gy * k * dt;
        if (sub > 0.05) {
          const a = Math.min(1, 2 * dt) * sub;
          if (wv) { c.vx += (wv[0] - c.vx) * a; c.vy += (wv[1] - c.vy) * a; }
          c.vx *= 1 - 1.2 * dt; c.vy *= 1 - 1.2 * dt;
        }
      } else if (c.wet > 0.5) {
        c.turn = clamp((c.turn + (Math.random() - 0.5) * dt * 12) * (1 - dt), -2, 2);
        c.heading += c.turn * dt;
        // stay under the surface: if there is no liquid above, steer down
        if (this.densityAt(c.x + upx * size * 0.6, c.y + upy * size * 0.6) < rest * 0.3) {
          const want = Math.atan2(-upy, -upx);
          let da = want - c.heading; da = Math.atan2(Math.sin(da), Math.cos(da));
          c.heading += da * Math.min(1, 3 * dt);
        }
        const sw = CFG.creatureSwim * this.U * T.swim;
        let tx = wv ? wv[0] : 0, ty = wv ? wv[1] : 0;
        if (T.jelly) {
          const p = Math.max(0, Math.sin(c.phase * 0.5));
          tx += (upx * 0.7 + Math.cos(c.heading) * 0.3) * p * sw * 1.6;
          ty += (upy * 0.7 + Math.sin(c.heading) * 0.3) * p * sw * 1.6;
        } else { tx += Math.cos(c.heading) * sw; ty += Math.sin(c.heading) * sw; }
        const a = Math.min(1, 2.5 * dt);
        c.vx += (tx - c.vx) * a; c.vy += (ty - c.vy) * a;
      } else {                                   // out of water: fall & flop
        c.vx += gx * dt; c.vy += gy * dt; c.vx *= 0.997;
      }
      let sp = Math.hypot(c.vx, c.vy);
      const vmax = CFG.vmax * this.U;
      if (sp > vmax) { c.vx *= vmax / sp; c.vy *= vmax / sp; sp = vmax; }
      // move with anti-tunneling
      const dx = c.vx * dt, dy = c.vy * dt, steps = Math.max(1, Math.ceil(Math.abs(dx) + Math.abs(dy)));
      for (let k = 0; k < steps; k++) {
        const nx = c.x + dx / steps, ny = c.y + dy / steps;
        if (this.sdf[(ny | 0) * MW + (nx | 0)] < 1) break;
        c.x = nx; c.y = ny;
      }
      const d = this.sdfAt(c.x, c.y);
      if (d < rad) {
        const [nx, ny] = this.sdfGrad(c.x, c.y);
        c.x += nx * (rad - d); c.y += ny * (rad - d);
        const vn = c.vx * nx + c.vy * ny;
        if (vn < 0) { const b = c.wet > 0.5 ? 1 : 1.35; c.vx -= b * vn * nx; c.vy -= b * vn * ny; }
        const hx = Math.cos(c.heading), hy = Math.sin(c.heading), hn = hx * nx + hy * ny;
        if (hn < 0) c.heading = Math.atan2(hy - 2 * hn * ny, hx - 2 * hn * nx);
      }
      c.x = clamp(c.x, f + 1, MW - f - 1); c.y = clamp(c.y, f + 1, MH - f - 1);
      // looks
      c.phase += dt * (c.wet > 0.5 || T.duck ? 5 + sp / (25 * this.U) : 18);
      if (T.upright) {
        if (Math.abs(c.vx) > 8 * this.U) c.face = c.vx > 0 ? 1 : -1;
        const want = T.duck ? Math.sin(c.phase * 0.4) * 0.12 + clamp(c.vx * 0.0006, -0.3, 0.3) : clamp(c.vx * 0.002, -0.5, 0.5);
        c.tilt += (want - c.tilt) * Math.min(1, 5 * dt);
      } else if (c.wet > 0.5) {
        const want = sp > 12 * this.U ? Math.atan2(c.vy, c.vx) : c.heading;
        let da = want - c.angle; da = Math.atan2(Math.sin(da), Math.cos(da));
        c.angle += da * Math.min(1, 6 * dt);
      } else c.angle += Math.sin(c.phase) * 0.06;  // flop
    }
  }

  step(dt, gx, gy) {
    this.emit(dt);
    this.integrate(dt, gx, gy);
    this.separate();
    this.collide();
    this.stepMills(dt);
    this.drain(dt);
    this.p2g();
    this.computeDensity();
    this.project(dt);
    this.g2p();
    this.updateCreatures(dt, gx, gy);
    this.stepCount++;
  }

  fillRender(out) {
    const { px, py, vx, vy, pt } = this, N = this.N, inv = 1 / (650 * this.U);
    for (let i = 0, j = 0; i < N; i++, j += 4) {
      out[j] = px[i]; out[j + 1] = py[i];
      const s = Math.sqrt(vx[i] * vx[i] + vy[i] * vy[i]) * inv;
      out[j + 2] = s > 1 ? 1 : s; out[j + 3] = pt[i];
    }
    return N;
  }
}

/* ---------------------------------------------------------------------
   WebGL2 renderer
   --------------------------------------------------------------------- */
const VS_POINTS = `#version 300 es
in vec4 aP;
uniform vec2 uInvDomain;
uniform float uSize;
out vec2 vST;
void main(){
  vec2 c = aP.xy * uInvDomain;
  gl_Position = vec4(c.x * 2.0 - 1.0, 1.0 - c.y * 2.0, 0.0, 1.0);
  gl_PointSize = uSize;
  vST = aP.zw;
}`;
const FS_POINTS = `#version 300 es
precision mediump float;
in vec2 vST;
uniform float uW;
out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float r2 = dot(q, q);
  if (r2 > 1.0) discard;
  float w = 1.0 - r2; w = w * w * w * uW;
  float oil = step(0.5, vST.y) * step(vST.y, 1.5), foam = step(1.5, vST.y);
  o = vec4(w, w * vST.x, w * oil, w * foam);
}`;
const VS_FULL = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;
const FS_BLIT = `#version 300 es
precision mediump float;
in vec2 vUv; uniform sampler2D uTex; out vec4 o;
void main(){ o = vec4(texture(uTex, vec2(vUv.x, 1.0 - vUv.y)).rgb, 1.0); }`;
const VS_SPRITE = `#version 300 es
in vec4 aV; out vec2 vT;
void main(){ gl_Position = vec4(aV.xy, 0.0, 1.0); vT = aV.zw; }`;
const FS_SPRITE = `#version 300 es
precision mediump float;
in vec2 vT; uniform sampler2D uTex; uniform float uAlpha; out vec4 o;
void main(){ o = texture(uTex, vT) * uAlpha; }`;
const FS_WATER = `#version 300 es
precision highp float;
in vec2 vUv;
uniform sampler2D uBg, uDen;
uniform vec2 uTexel;
uniform float uTime, uAspect, uFlipBg;
uniform vec3 uShallow, uDeep;
out vec4 o;
const float T = 0.22;
float caustic(vec2 p, float t){
  p *= 7.0;
  vec2 q = p + vec2(sin(p.y * 1.3 + t * 0.9), cos(p.x * 1.1 - t * 0.7)) * 0.7;
  float v = sin(q.x * 2.0 + t) * sin(q.y * 2.0 - t * 1.2);
  v += 0.5 * sin((q.x + q.y) * 3.1 + t * 1.7);
  return pow(clamp(1.0 - abs(v), 0.0, 1.0), 7.0);
}
vec2 hash2(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float cells(vec2 p){
  vec2 i = floor(p), f = fract(p); float m = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 r = g + hash2(i + g) * 0.8 + 0.1 - f; m = min(m, dot(r, r));
  }
  return sqrt(m);
}
vec3 bgAt(vec2 uv){ return texture(uBg, vec2(uv.x, mix(uv.y, 1.0 - uv.y, uFlipBg))).rgb; }
void main(){
  vec4 D = texture(uDen, vUv);
  float d = D.r;
  vec3 bg = bgAt(vUv);
  float sh = texture(uDen, vUv + vec2(-uTexel.x * 3.0, uTexel.y * 4.0)).r;
  float shadow = smoothstep(0.05, 0.5, sh) * 0.22;
  if (d < T - 0.06) { o = vec4(bg * (1.0 - shadow), 1.0); return; }

  vec2 o1 = uTexel * 2.5, o2 = vec2(uTexel.x, -uTexel.y) * 2.5;
  float a1 = texture(uDen, vUv + o1).r, b1 = texture(uDen, vUv - o1).r;
  float a2 = texture(uDen, vUv + o2).r, b2 = texture(uDen, vUv - o2).r;
  vec2 g = vec2((a1 - b1) + (a2 - b2), (a1 - b1) - (a2 - b2)) * 0.5;
  float a = smoothstep(T - 0.05, T + 0.03, d);
  float thick = clamp((d - T) * 1.4, 0.0, 1.0);
  float oilF = clamp(D.b / d, 0.0, 1.0), foamF = clamp(D.a / d, 0.0, 1.0);
  vec3 n = normalize(vec3(-g * mix(2.2, 0.45, thick) * (1.0 - oilF * 0.55), 1.0));

  vec2 off = n.xy * (0.006 + 0.01 * thick);
  vec3 refr = bgAt(vUv + off);
  // water
  vec3 tint = mix(uShallow, uDeep, thick);
  vec3 wcol = refr * mix(vec3(1.0), tint, 0.55 + 0.35 * thick);
  wcol = mix(wcol, tint, 0.18 + 0.32 * thick);
  wcol += caustic(vec2((vUv.x + off.x) * uAspect, vUv.y + off.y), uTime) * 0.22 * (1.0 - thick * 0.5);
  // oil: dark amber body with a thin-film rainbow sheen
  vec3 oilT = mix(vec3(0.85, 0.58, 0.14), vec3(0.32, 0.17, 0.03), thick);
  vec3 ocol = mix(refr * vec3(0.85, 0.7, 0.35), oilT, 0.6 + 0.35 * thick);
  vec3 film = 0.5 + 0.5 * cos(6.2832 * (vec3(0.0, 0.33, 0.67) + dot(n.xy, vec2(1.6, 1.2)) + d * 0.8 + uTime * 0.05));
  ocol = mix(ocol, film, 0.32 * (1.0 - smoothstep(0.0, 0.5, thick)));
  vec3 col = mix(wcol, ocol, oilF);

  vec3 L = normalize(vec3(-0.45, 0.55, 0.75));
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, H), 0.0), mix(70.0, 120.0, oilF));
  float fres = pow(1.0 - n.z, 2.0);
  col += spec * mix(0.85, 1.3, oilF) + fres * 0.35;

  float rim = smoothstep(T - 0.05, T + 0.02, d) * (1.0 - smoothstep(T + 0.02, T + 0.13, d));
  col = mix(col, mix(uDeep, vec3(0.08, 0.05, 0.0), oilF) * 0.75, rim * 0.45);

  float sp = D.g / d;
  col = mix(col, vec3(1.0), smoothstep(0.5, 0.95, sp) * 0.65 * (1.0 - oilF));

  if (foamF > 0.02) {   // foam: bubbly white
    vec2 fp = vec2(vUv.x * uAspect, vUv.y);
    float b1c = cells(fp * 70.0 + vec2(0.0, uTime * 0.15));
    float b2c = cells(fp * 150.0 + 3.7);
    vec3 fc = vec3(0.98, 0.99, 1.0) * (0.88 + 0.12 * smoothstep(0.15, 0.7, b1c));
    fc -= (1.0 - smoothstep(0.0, 0.22, b2c)) * 0.04;
    fc = mix(fc, mix(uShallow, vec3(1.0), 0.6), 0.25 * thick * (1.0 - foamF));
    fc += spec * 0.25;
    col = mix(col, fc, smoothstep(0.12, 0.6, foamF));
  }
  o = vec4(mix(bg * (1.0 - shadow), col, a), 1.0);
}`;

const PALETTES = [
  { name: 'Blue',   shallow: [0.55, 0.85, 1.0],  deep: [0.07, 0.38, 0.85] },
  { name: 'Green',  shallow: [0.70, 1.0, 0.55],  deep: [0.12, 0.62, 0.20] },
  { name: 'Pink',   shallow: [1.0, 0.72, 0.90],  deep: [0.88, 0.20, 0.58] },
  { name: 'Lava',   shallow: [1.0, 0.88, 0.40],  deep: [0.95, 0.30, 0.05] },
  { name: 'Purple', shallow: [0.85, 0.75, 1.0],  deep: [0.45, 0.20, 0.85] },
];
const MAX_SPRITE_FLOATS = 120 * 72;

class Renderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, powerPreference: 'high-performance' });
    if (!gl) throw new Error('WebGL2 not available');
    this.gl = gl; this.canvas = canvas;
    this.floatFB = !!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float');
    this.pPoints = this.program(VS_POINTS, FS_POINTS);
    this.pWater = this.program(VS_FULL, FS_WATER);
    this.pBlit = this.program(VS_FULL, FS_BLIT);
    this.pSprite = this.program(VS_SPRITE, FS_SPRITE);
    this.uP = this.uniforms(this.pPoints, ['uInvDomain', 'uSize', 'uW']);
    this.uW = this.uniforms(this.pWater, ['uBg', 'uDen', 'uTexel', 'uTime', 'uAspect', 'uShallow', 'uDeep', 'uFlipBg']);
    this.uB = this.uniforms(this.pBlit, ['uTex']);
    this.uS = this.uniforms(this.pSprite, ['uTex', 'uAlpha']);
    this.allocParticles(CFG.maxParticles);
    // sprites
    this.sVao = gl.createVertexArray(); gl.bindVertexArray(this.sVao);
    this.sVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.sVbo);
    gl.bufferData(gl.ARRAY_BUFFER, MAX_SPRITE_FLOATS * 4, gl.DYNAMIC_DRAW);
    const sl = gl.getAttribLocation(this.pSprite, 'aV');
    gl.enableVertexAttribArray(sl); gl.vertexAttribPointer(sl, 4, gl.FLOAT, false, 16, 0);
    gl.bindVertexArray(null);
    this.sBuf = new Float32Array(MAX_SPRITE_FLOATS);
    this.emptyVao = gl.createVertexArray();
    this.bgTex = this.tex(); this.atlasTex = this.tex();
    gl.bindTexture(gl.TEXTURE_2D, this.atlasTex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, makeAtlas());
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    this.denTex = null; this.fbo = null; this.dw = 0; this.dh = 0;
    this.sceneTex = null; this.sceneFbo = null; this.sw = 0; this.sh = 0;
    this.palette = 0;
    this.bgW = 1; this.bgH = 1;
  }
  allocParticles(P) {
    const gl = this.gl;
    if (this.vbo) { gl.deleteBuffer(this.vbo); gl.deleteVertexArray(this.vao); }
    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    this.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, P * 16, gl.DYNAMIC_DRAW);
    const loc = gl.getAttribLocation(this.pPoints, 'aP');
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 16, 0);
    gl.bindVertexArray(null);
    this.buf = new Float32Array(P * 4); this.capP = P;
  }
  tex() {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  program(vs, fs) {
    const gl = this.gl;
    const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  uniforms(p, names) { const o = {}; for (const n of names) o[n] = this.gl.getUniformLocation(p, n); return o; }
  setBackground(canvas) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.bgTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
    this.bgW = canvas.width; this.bgH = canvas.height;
  }
  updateBackgroundRect(canvas, x, y, w, h) {
    x = Math.max(0, Math.floor(x)); y = Math.max(0, Math.floor(y));
    w = Math.min(canvas.width - x, Math.ceil(w)); h = Math.min(canvas.height - y, Math.ceil(h));
    if (w <= 0 || h <= 0) return;
    const data = canvas.getContext('2d').getImageData(x, y, w, h).data;
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.bgTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, x, y, w, h, gl.RGBA, gl.UNSIGNED_BYTE, data);
  }
  makeTarget(w, h, float) {
    const gl = this.gl, t = this.tex();
    if (float) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);

  const dpr = Math.min(window.devicePixelRatio || 1, CFG.dprCap);

  Object.assign(stage.style, { left: view.x + 'px', top: view.y + 'px', width: w + 'px', height: h + 'px' });
  glc.width = Math.round(w * dpr); glc.height = Math.round(h * dpr);

/* ---- background baking: flattened photo + inked walls + drawn walls ---- */

  x.globalAlpha = 0.55; x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(maskCanvas(mask, cap.MW, cap.MH, 38, 40, 58, 255), 0, 0, c.width, c.height);

}

    for (let i = 0; i + 3 < p.length; i += 2) paintCapsule(m, MW, MH, p[i], p[i + 1], p[i + 2], p[i + 3], rad, s.erase ? 0 : 1, 0);

/* ---- build / rebuild the world, carrying over the scene ---- */

  bgCanvas = bakeBackground(cap, mask);
  const bctx = bgCanvas.getContext('2d');
  const kx = bgCanvas.width / cap.MW, ky = bgCanvas.height / cap.MH;
  for (const s of userStrokes) inkStroke(bctx, strokePx(s, cap.MW, cap.MH), s.rN * cap.MW, s.erase, kx, ky);
  renderer.setBackground(bgCanvas);
  if (old && keep) {
    const sx = nw.MW / old.MW, sy = nw.MH / old.MH;
    if (keep === 'all') {
      for (let i = 0; i < old.N && nw.N < nw.maxP; i++) {
        if (nw.add(old.px[i] * sx, old.py[i] * sy, old.vx[i] * sx, old.vy[i] * sy, old.pt[i])) nw.pl[nw.N - 1] = old.pl[i];
      }
      nw.pipes = old.pipes.map(p => ({ ...p, x: p.x * sx, y: p.y * sy }));
      nw.sewers = old.sewers.map(p => ({ ...p, x: p.x * sx, y: p.y * sy }));
      nw.mills = old.mills.map(p => ({ ...p, x: p.x * sx, y: p.y * sy }));
      nw.winds = old.winds.map(w => ({ ...w, pts: w.pts.map((v, i) => v * (i & 1 ? sy : sx)) }));
      nw.rebuildWind();
    }
    for (const c of old.creatures) {
      const n = { ...c, x: c.x * sx, y: c.y * sy, vx: 0, vy: 0 };
      if (nw.sdfAt(n.x, n.y) < 2) {          // landed inside a wall -> find free spot
        for (let t = 0; t < 60; t++) {
          const x = Math.random() * nw.MW, y = Math.random() * nw.MH;
          if (nw.sdfAt(x, y) > 10 * nw.U) { n.x = x; n.y = y; break; }

/* ---------------------------------------------------------------------
   Overlay (pipes, sewers, mills, wind) – redrawn every frame
   --------------------------------------------------------------------- */
const drawingWinds = new Set();

  const k = ov.width / world.MW;
  octx.setTransform(k, 0, 0, k, 0, 0);
  for (const w of world.winds) drawWind(w, time, false);
  for (const w of drawingWinds) drawWind(w, time, true);

  c.lineTo(ex + Math.cos(a + 2.5) * s, ey + Math.sin(a + 2.5) * s);
  c.lineTo(ex + Math.cos(a - 2.5) * s, ey + Math.sin(a - 2.5) * s); c.closePath(); c.fill(); c.stroke();
  c.restore();
}

  c.beginPath(); c.arc(0, 2, R + 3, 0, Math.PI * 2); c.fillStyle = 'rgba(0,0,0,.25)'; c.fill();
  c.beginPath(); c.arc(0, 0, R + 3, 0, Math.PI * 2); c.fillStyle = '#8b95a5'; c.fill();
  c.beginPath(); c.arc(0, 0, R, 0, Math.PI * 2); c.fillStyle = '#1f2430'; c.fill();

const MILL_COLORS = ['#ff5a5a', '#ffd23f', '#3fa9ff', '#5be37d'];

  photo.sens = +$('sSens').value; photo.thick = +$('sThick').value; photo.dots = +$('sDots').value;
  $('sSensV').textContent = photo.sens; $('sThickV').textContent = photo.thick; $('sDotsV').textContent = photo.dots;
  reviewMask = computeWalls(reviewCap, photo.sens, photo.thick, photo.dots);
  const rc = $('reviewCanvas');
  rc.width = reviewCap.bg.width; rc.height = reviewCap.bg.height;
  const x = rc.getContext('2d');
  x.drawImage(reviewCap.bg, 0, 0);
  x.globalAlpha = 0.75; x.imageSmoothingEnabled = false;
  x.drawImage(maskCanvas(reviewMask, reviewCap.MW, reviewCap.MH, 255, 50, 50, 255), 0, 0, rc.width, rc.height);
  x.globalAlpha = 1;
}
['sSens', 'sThick', 'sDots'].forEach(id => $(id).addEventListener('input', () => {
  cancelAnimationFrame(reviewRaf); reviewRaf = requestAnimationFrame(updateReview);
}));
$('rvBack').addEventListener('click', () => { $('review').classList.add('hidden'); $('editor').classList.remove('hidden'); edLayout(); });
$('rvRetake').addEventListener('click', () => {
  $('review').classList.add('hidden');
  if (ED.fromNew && ED.prevPhoto) photo = ED.prevPhoto; else if (ED.snapshot) Object.assign(photo, ED.snapshot);
  openCamera();
});
$('rvPlay').addEventListener('click', () => {
  $('review').classList.add('hidden');
  curCap = reviewCap; curMask = reviewMask;
  if (ED.fromNew) { userStrokes = []; rebuildWorld(curCap, curMask, 'creatures'); hint('Have fun! 💧', 1500); }
  else rebuildWorld(curCap, curMask, 'all');
});
$('bEdit').addEventListener('click', () => { if (photo) openEditor(false); });

/* ---------------------------------------------------------------------
   Settings panel
   --------------------------------------------------------------------- */
let setPending = 0, setLayout = false, setWind = false;
function fmt(v, step) { return step < 1 ? (+v).toFixed(step < 0.1 ? 2 : 1) : String(Math.round(v)); }
function buildSettings() {
  const box = $('setList'); box.innerHTML = '';
  for (const s of SETTINGS) {
    if (s.g) { const h = document.createElement('h3'); h.textContent = s.g; box.appendChild(h); continue; }
    const row = document.createElement('div'); row.className = 'srow';
    const lab = document.createElement('label'); lab.textContent = s.l; row.appendChild(lab);
    if (s.toggle) {
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!CFG[s.k];
      cb.addEventListener('change', () => { CFG[s.k] = cb.checked ? 1 : 0; applyLive(); });
      row.appendChild(cb);
    } else {
      const val = document.createElement('span'); val.textContent = fmt(CFG[s.k], s.step); row.appendChild(val);
      const inp = document.createElement('input'); inp.type = 'range';
      inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = CFG[s.k];
      inp.addEventListener('input', () => {
        CFG[s.k] = +inp.value; val.textContent = fmt(CFG[s.k], s.step);
        if (s.rebuild) setPending = Math.max(setPending, s.rebuild);
        if (s.layout) setLayout = true;
        if (s.wind) setWind = true;
        applyLive();
      });
      row.appendChild(inp);
      if (s.rebuild) { const n = document.createElement('div'); n.className = 'note'; n.textContent = 'applied when you press Done'; row.appendChild(n); }
    }
    box.appendChild(row);
  }
  const btns = document.createElement('div'); btns.className = 'setBtns';
  const mk = (t, fn) => { const b = document.createElement('button'); b.className = 'pill'; b.textContent = t; b.addEventListener('click', fn); btns.appendChild(b); };
  mk('↺ Default settings', () => {
    const changedRes = CFG.maskLong !== DEFAULTS.maskLong, changedGrid = CFG.cell !== DEFAULTS.cell || CFG.maxParticles !== DEFAULTS.maxParticles;
    Object.assign(CFG, DEFAULTS);
    setPending = Math.max(setPending, changedRes ? 2 : (changedGrid ? 1 : 0)); setLayout = true; setWind = true;
    applyLive(); buildSettings();
  });
  mk('🧽 Remove drawn walls', () => { userStrokes = []; rebuildWorld(curCap, curMask, 'all'); hint('Drawn walls removed', 1400); });
  mk('🗑️ Remove pipes, mills, wind…', () => { world.pipes = []; world.sewers = []; world.mills = []; world.winds = []; world.rebuildWind(); hint('All tools removed', 1400); });
  mk('🐟 Remove creatures', () => { world.creatures = []; });
  box.appendChild(btns);
}
function applyLive() { $('stats').style.display = CFG.showStats ? '' : 'none'; }
$('bSettings').addEventListener('click', () => { setPending = 0; setLayout = false; setWind = false; buildSettings(); $('settings').classList.remove('hidden'); });
$('setClose').addEventListener('click', () => {
  $('settings').classList.add('hidden');
  saveCfg();
  if (setPending === 2) {           // new simulation resolution -> redo wall detection
    curCap = prepareCapture(photo.edited);
    curMask = computeWalls(curCap, photo.sens, photo.thick, photo.dots);
    rebuildWorld(curCap, curMask, 'all');
  } else if (setPending === 1) rebuildWorld(curCap, curMask, 'all');
  else if (setLayout) layout();
  if (setWind && world) world.rebuildWind();
  while (world.creatures.length > CFG.maxCreatures) world.creatures.pop();
  setPending = 0;
});

/* ---------------------------------------------------------------------
   Demo drawing (procedural "pencil on paper" photo)
   --------------------------------------------------------------------- */
function makeDemoPhoto(aspect) {
  const W = 1600, H = Math.round(W / aspect);
  const c = makeCanvas(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W * 0.35, H * 0.3, 50, W * 0.5, H * 0.5, W * 0.85);
  g.addColorStop(0, '#f6f1e7'); g.addColorStop(1, '#a9a092');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pencil = (pts, wdt = 4.2) => {
    for (let pass = 0; pass < 2; pass++) {
      x.beginPath();
      for (let i = 0; i < pts.length - 1; i++) {
        const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
        const segs = Math.ceil(Math.hypot((bx - ax) * W, (by - ay) * H) / 12);
        for (let s = 0; s <= segs; s++) {
          const t = s / segs, jx = (rnd() - 0.5) * 2.2, jy = (rnd() - 0.5) * 2.2;
          const X = (ax + (bx - ax) * t) * W + jx, Y = (ay + (by - ay) * t) * H + jy;
          if (i === 0 && s === 0) x.moveTo(X, Y); else x.lineTo(X, Y);
        }
      }
      x.strokeStyle = pass ? 'rgba(70,70,80,.55)' : 'rgba(60,60,70,.75)';
      x.lineWidth = wdt * (pass ? 0.6 : 1); x.lineCap = 'round'; x.lineJoin = 'round';
      x.stroke();
    }
  };
  const circle = (cx, cy, r) => {
    const pts = []; for (let a = 0; a <= 24; a++) pts.push([cx + Math.cos(a / 24 * 6.283) * r / aspect, cy + Math.sin(a / 24 * 6.283) * r]);
    pencil(pts);
  };
  pencil([[0.12, 0.13], [0.19, 0.28]]); pencil([[0.31, 0.13], [0.24, 0.28]]);          // funnel
  pencil([[0.10, 0.40], [0.52, 0.52]]);                                               // ramp 1
  pencil([[0.88, 0.50], [0.50, 0.64]]);                                               // ramp 2
  pencil([[0.06, 0.66], [0.06, 0.93], [0.38, 0.93], [0.38, 0.68]]);                   // pond
  pencil([[0.62, 0.12], [0.62, 0.30], [0.80, 0.30]]);                                 // L-tube
  pencil([[0.68, 0.12], [0.68, 0.245], [0.80, 0.245]]);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) circle(0.60 + i * 0.07 + j * 0.035, 0.74 + j * 0.08, 0.022);
  pencil([[0.6, 0.97], [0.96, 0.78]]);                                                // ramp to drain
  return c;
}
function demoScene() {
  const W = world.MW, H = world.MH;
  world.pipes.push({ x: W * 0.215, y: H * 0.08, a: Math.PI / 2, acc: 0, row: 0, type: 0 });
  world.sewers.push({ x: W * 0.9, y: H * 0.88 });
  world.mills.push({ x: W * 0.47, y: H * 0.75, th: 0, om: 0, mul: 1 });
  // pre-filled pond with fish & a duck
  const r = world.r, sp = 2 * r, rowH = Math.sqrt(3) * r;
  let row = 0;
  for (let y = H * 0.75; y < H * 0.92; y += rowH, row++)
    for (let x = W * 0.07 + (row & 1 ? r : 0); x < W * 0.37; x += sp) world.add(x, y, 0, 0, 0);
  for (let i = 0; i < 4; i++) world.spawnCreature(W * (0.1 + i * 0.07), H * (0.82 + (i & 1) * 0.05), i === 3 ? 4 : i % 3);
  world.spawnCreature(W * 0.3, H * 0.74, 7);
  for (let i = 0; i < 20; i++) world.step(1 / 60, 0, CFG.gravity * world.U);
}

/* ---------------------------------------------------------------------
   Main loop
   --------------------------------------------------------------------- */
let last = performance.now(), acc = 0, fpsT = 0, frames = 0, simMs = 0;
function frame(t) {
  requestAnimationFrame(frame);
  if (!world) return;
  let dt = (t - last) / 1000; last = t;
  if (dt > 0.1) dt = 0.1;
  const G = CFG.gravity * world.U;
  if (tiltOn) { grav.x += (gravTarget.x * G - grav.x) * 0.25; grav.y += (gravTarget.y * G - grav.y) * 0.25; }
  else { grav.x += (0 - grav.x) * 0.2; grav.y += (G - grav.y) * 0.2; }
  acc += dt;
  const base = 1 / 60, ts = CFG.timeScale, sub = Math.ceil(ts), sdt = base * ts / sub;
  let ticks = 0;
  const t0 = performance.now();
  while (acc >= base && ticks < 2) {
    for (let k = 0; k < sub; k++) world.step(sdt, grav.x, grav.y);
    acc -= base; ticks++;
  }
  if (acc > base) acc = 0;
  if (ticks) simMs = simMs * 0.9 + 0.1 * (performance.now() - t0) / ticks;
  if (bgDirty) {
    renderer.updateBackgroundRect(bgCanvas, bgDirty[0], bgDirty[1], bgDirty[2] - bgDirty[0], bgDirty[3] - bgDirty[1]);
    bgDirty = null;
  }
  renderer.render(world, t / 1000);
  drawOverlay(t / 1000);
  frames++;
  if (t - fpsT > 500) {
    if (CFG.showStats) $('stats').textContent = `${Math.round(frames * 1000 / (t - fpsT))} fps · sim ${simMs.toFixed(1)} ms · ${world.N} drops · ${world.creatures.length} 🐟`;
    fpsT = t; frames = 0;
  }
}

function init() {
  try { renderer = new Renderer(glc); }
  catch (e) {
    document.body.innerHTML = '<div id="nogl">Sorry, this device needs WebGL2 to run Paper Splash.<br><small>' + e.message + '</small></div>';
    return;
  }
  photo = defaultPhoto(makeDemoPhoto(screenAspect()));
  photo.edited = makeEdited(photo);
  curCap = prepareCapture(photo.edited);
  curMask = computeWalls(curCap, photo.sens, photo.thick, photo.dots);
  rebuildWorld(curCap, curMask, null);
  demoScene();
  applyLive();
  buildFlyout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  hint('Take a 📷 photo of your drawing, or play with this one!', 4000);
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && stream) closeCamera(); last = performance.now(); });
init();
</script>
